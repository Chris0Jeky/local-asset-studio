name: Apply issue 345 board continuation lineage

on:
  push:
    branches:
      - fix/345-restyle-handoff-guards
    paths:
      - '.github/workflows/agent-patch-583-lineage.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove the board-source lineage regression fails before the fix
        run: |
          python .github/agent-patch-583-lineage.py --test-only
          if node --test tests/continuation_parent_claims.cjs; then
            echo '::error::The board-source lineage regression unexpectedly passed before the source fix.'
            exit 1
          fi
          echo 'Expected false lineage drop reproduced.'

      - name: Retain the distinct continuation source claim
        run: python .github/agent-patch-583-lineage.py --implementation

      - name: Verify lineage and adjacent frontend behavior
        run: |
          node --check app/static/app.js
          node --test tests/continuation_parent_claims.cjs
          node --test tests/workbench_handoff_guards.cjs
          node --test tests/frontend_handoffs.cjs
          python -m unittest tests/test_studio_ux.py -v
          python scripts/validate-repo.py
          git diff --check

      - name: Commit verified implementation
        run: |
          git add app/static/app.js tests/continuation_parent_claims.cjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(workbench): retain board continuation lineage'
          git push origin HEAD
