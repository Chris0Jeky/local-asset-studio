name: Prompt Studio
on:
  pull_request:
    paths: ['studio_prompt/**', 'scripts/studio_prompt.py', 'scripts/start_prompt_studio.py', 'app/static/prompt-lab.*', 'research/prompt-studio/**', 'tests/test_studio_prompt*.py', '.github/workflows/prompt-studio.yml']
  push:
    branches: [main]
    paths: ['studio_prompt/**', 'scripts/studio_prompt.py', 'scripts/start_prompt_studio.py', 'app/static/prompt-lab.*', 'research/prompt-studio/**', 'tests/test_studio_prompt*.py', '.github/workflows/prompt-studio.yml']
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - run: python -m unittest discover -s tests -p 'test_studio_prompt*.py' -v
      - run: python scripts/studio_prompt.py compile examples/prompt-studio/portrait.json --profile sdxl-prose-v1
      - run: python scripts/start_prompt_studio.py --help
