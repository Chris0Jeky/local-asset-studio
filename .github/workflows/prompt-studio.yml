name: Prompt Studio
on:
  pull_request:
    paths: ['studio_prompt/**', 'scripts/studio_prompt.py', 'scripts/start_prompt_studio.py', 'scripts/studio_adult_illustration_prompt.py', 'scripts/studio_adult_illustration_source_snapshot.py', 'scripts/studio_adult_illustration_source_fetch.py', 'scripts/studio_adult_illustration_acquisition_plan.py', 'scripts/studio_adult_illustration_taxonomy.py', 'scripts/validate_adult_illustration_benchmark_result.py', 'app/static/prompt-lab.*', 'app/static/reference-review.*', 'app/static/reference-analyze.*', 'app/static/prompt-projects.*', 'tests/test_reference_*.py', 'tests/reference_review*', 'tests/reference_analyze*', 'research/prompt-studio/**', 'research/adult-illustration/prompt-profile-vocabulary.json', 'research/adult-illustration/taxonomy-*.json', 'research/adult-illustration/benchmark-result-example.json', 'docs/adult-illustration/README.md', 'docs/adult-illustration/SOURCE-INTAKE.md', 'docs/adult-illustration/ACQUISITION-HANDOFF.md', 'tests/test_studio_prompt*.py', 'tests/test_adult_illustration*.py', 'tests/test_exact_anime_profiles.py', 'tests/test_prompt_projects*.py', 'tests/prompt_projects*', '.github/workflows/prompt-studio.yml']
  push:
    branches: [main]
    paths: ['studio_prompt/**', 'scripts/studio_prompt.py', 'scripts/start_prompt_studio.py', 'scripts/studio_adult_illustration_prompt.py', 'scripts/studio_adult_illustration_source_snapshot.py', 'scripts/studio_adult_illustration_source_fetch.py', 'scripts/studio_adult_illustration_acquisition_plan.py', 'scripts/studio_adult_illustration_taxonomy.py', 'scripts/validate_adult_illustration_benchmark_result.py', 'app/static/prompt-lab.*', 'app/static/reference-review.*', 'app/static/reference-analyze.*', 'app/static/prompt-projects.*', 'tests/test_reference_*.py', 'tests/reference_review*', 'tests/reference_analyze*', 'research/prompt-studio/**', 'research/adult-illustration/prompt-profile-vocabulary.json', 'research/adult-illustration/taxonomy-*.json', 'research/adult-illustration/benchmark-result-example.json', 'docs/adult-illustration/README.md', 'docs/adult-illustration/SOURCE-INTAKE.md', 'docs/adult-illustration/ACQUISITION-HANDOFF.md', 'tests/test_studio_prompt*.py', 'tests/test_adult_illustration*.py', 'tests/test_exact_anime_profiles.py', 'tests/test_prompt_projects*.py', 'tests/prompt_projects*', '.github/workflows/prompt-studio.yml']
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - run: python -m unittest discover -s tests -p 'test_studio_prompt*.py' -v
      - run: python -m unittest discover -s tests -p 'test_exact_anime_profiles.py' -v
      - run: python -m unittest discover -s tests -p 'test_reference_*.py' -v
      - run: python -m unittest discover -s tests -p 'test_adult_illustration*.py' -v
      - run: python -m unittest discover -s tests -p 'test_prompt_projects*.py' -v
      - run: python scripts/validate_adult_illustration_benchmark_result.py
      - run: python scripts/studio_prompt.py compile examples/prompt-studio/portrait.json --profile sdxl-prose-v1
      - run: python scripts/studio_adult_illustration_prompt.py profiles
      - run: python scripts/studio_adult_illustration_taxonomy.py source
      - run: python scripts/studio_adult_illustration_source_fetch.py --help
      - run: python scripts/studio_adult_illustration_acquisition_plan.py --help
      - run: python scripts/start_prompt_studio.py --help
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0 -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/reference_review_browser.py --output .runtime/reference-review/browser
      - run: python tests/reference_analyze_browser.py --output .runtime/reference-review/browser/analyze
      - run: python tests/prompt_projects_browser.py --output .runtime/reference-review/browser/projects
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-review-browser
          path: .runtime/reference-review/browser
          retention-days: 7
