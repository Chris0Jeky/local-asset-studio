name: Prompt Studio
on:
  pull_request:
    paths: ['studio_prompt/**', 'scripts/studio_prompt.py', 'scripts/start_prompt_studio.py', 'scripts/studio_adult_illustration_prompt.py', 'scripts/studio_adult_illustration_source_snapshot.py', 'scripts/studio_adult_illustration_source_fetch.py', 'app/static/prompt-lab.*', 'app/static/reference-review.*', 'tests/test_reference_*.py', 'tests/reference_review*', 'research/prompt-studio/**', 'research/adult-illustration/prompt-profile-vocabulary.json', 'tests/test_studio_prompt*.py', 'tests/test_adult_illustration*.py', '.github/workflows/prompt-studio.yml']
  push:
    branches: [main]
    paths: ['studio_prompt/**', 'scripts/studio_prompt.py', 'scripts/start_prompt_studio.py', 'scripts/studio_adult_illustration_prompt.py', 'scripts/studio_adult_illustration_source_snapshot.py', 'scripts/studio_adult_illustration_source_fetch.py', 'app/static/prompt-lab.*', 'app/static/reference-review.*', 'tests/test_reference_*.py', 'tests/reference_review*', 'research/prompt-studio/**', 'research/adult-illustration/prompt-profile-vocabulary.json', 'tests/test_studio_prompt*.py', 'tests/test_adult_illustration*.py', '.github/workflows/prompt-studio.yml']
permissions:
  contents: write
jobs:
  apply-acquisition-contract-fix:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/adult-illustration-acquisition-handoff'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/adult-illustration-acquisition-handoff
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align stable source file IDs
        shell: python
        run: |
          from pathlib import Path
          path = Path('studio_prompt/_adult_illustration_acquisition_plan_impl.py')
          text = path.read_text(encoding='utf-8')
          old = 'elif re.fullmatch(r"hf-file-[1-9][0-9]*", file_id) is None:'
          new = 'elif re.fullmatch(r"hf-file-[0-9a-f]{20}", file_id) is None:'
          if text.count(old) != 1:
              raise SystemExit('expected acquisition file-id check not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
      - run: python -m unittest tests.test_adult_illustration_acquisition_plan -v
      - name: Commit fix
        run: |
          git config user.name "Cristian Tcaci"
          git config user.email "59696583+Chris0Jeky@users.noreply.github.com"
          git add studio_prompt/_adult_illustration_acquisition_plan_impl.py
          git commit -m "fix: align acquisition plans with stable source file ids"
          git push origin HEAD:codex/adult-illustration-acquisition-handoff
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - run: python -m unittest discover -s tests -p 'test_studio_prompt*.py' -v
      - run: python -m unittest discover -s tests -p 'test_reference_*.py' -v
      - run: python -m unittest discover -s tests -p 'test_adult_illustration*.py' -v
      - run: python scripts/studio_prompt.py compile examples/prompt-studio/portrait.json --profile sdxl-prose-v1
      - run: python scripts/studio_adult_illustration_prompt.py profiles
      - run: python scripts/studio_adult_illustration_source_fetch.py --help
      - run: python scripts/start_prompt_studio.py --help
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0 -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/reference_review_browser.py --output .runtime/reference-review/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-review-browser
          path: .runtime/reference-review/browser
          retention-days: 7
