name: Chronological source snapshot
on:
  push:
    branches: [codex/chronological-recovery-followups]
    paths: [.github/workflows/chronological-snapshot.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/chronological-recovery-followups
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source identities before applying
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/chronological-proof
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          shas=['44ecd1f2c8fadd705e0bc4769efb9fe69724262d','863f1cad391f12923f09c8edb0c532d65af7f2e8','4d469c405e3d9f779510f9636b241fb6185e41fb']
          chunks=[]
          for sha in shas:
              request=urllib.request.Request('https://api.github.com/repos/Chris0Jeky/local-asset-studio/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response:blob=json.load(response)
              content=base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()==sha
              chunks.append(content)
          archive=b''.join(chunks)
          assert hashlib.sha256(archive).hexdigest()=='b46000d84b5cedce0b7d9b59974e9cb8874758c6c9e3b27e32e189b66e6745de'
          package=json.loads(lzma.decompress(archive));manifest=package['manifest']
          assert len(manifest)==17
          subprocess.run(['git','merge-base','--is-ancestor',package['base'],'HEAD'],check=True)
          for name,record in manifest.items():
              path=pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in ('app','tests','docs') or name=='CURRENT_STATE.md'
              if record['before_blob'] is None:assert not pathlib.Path(name).exists(),name
              else:
                  actual=subprocess.check_output(['git','rev-parse','HEAD:'+name],text=True).strip()
                  assert actual==record['before_blob'],('Concurrent change; nothing will be overwritten',name,actual)
          patch=pathlib.Path('/tmp/chronological-proof/source.patch');patch.write_text(package['patch'],encoding='utf-8')
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed==set(manifest)
          for name,record in manifest.items():assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==record['sha256'],name
          pathlib.Path('/tmp/chronological-proof/manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          print('Verified all 17 source files against tested manifest.')
          PY
          git diff --cached --check
          git commit -m 'fix: contain worker faults and reconcile retained outcomes (#95, #98, #110)'
          git fetch origin main
          git merge --no-edit origin/main
      - run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - name: Full source verification
        run: |
          set -o pipefail
          python -m unittest discover -s tests 2>&1 | tee /tmp/chronological-proof/full-suite.log
          python scripts/validate-repo.py 2>&1 | tee /tmp/chronological-proof/validation.log
          node --check app/static/app.js
          node --check app/static/production.js
          node tests/frontend_health.cjs
          node tests/production_terminal_frontend.cjs
          git diff --check
      - name: Publish only verified source
        run: |
          git push origin HEAD:codex/chronological-recovery-followups
          git rev-parse HEAD | tee /tmp/chronological-proof/published-commit.txt
      - name: Retain exact source and evidence
        if: always()
        run: |
          mkdir -p /tmp/chronological-proof
          git bundle create /tmp/chronological-proof/source.bundle HEAD
          git status --short > /tmp/chronological-proof/status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chronological-publication-proof
          path: /tmp/chronological-proof/
          retention-days: 3
