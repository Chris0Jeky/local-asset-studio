name: Temporary taxonomy depth fix

on:
  push:
    branches:
      - codex/adult-illustration-taxonomy-intake
    paths:
      - .github/workflows/tmp-apply-taxonomy-depth-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.repository == 'Chris0Jeky/local-asset-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/adult-illustration-taxonomy-intake
          fetch-depth: 0

      - name: Confirm regression fails before the fix
        shell: bash
        run: |
          set +e
          python -m unittest tests.test_adult_illustration_taxonomy_depth -v
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected the new regression to fail before applying the fix" >&2
            exit 1
          fi

      - name: Apply subtree-depth memoization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("studio_prompt/adult_illustration_taxonomy.py")
          text = path.read_text(encoding="utf-8")
          old = '''def _acyclic(graph: dict[str, list[str]], label: str, maximum_depth: int) -> None:
              visiting: set[str] = set()
              visited: set[str] = set()

              def visit(node: str, depth: int) -> None:
                  if depth > maximum_depth:
                      raise ValueError(f"Taxonomy {label} graph exceeds depth {maximum_depth}")
                  if node in visiting:
                      raise ValueError(f"Taxonomy {label} graph contains a cycle at {node!r}")
                  if node in visited:
                      return
                  visiting.add(node)
                  for target in graph.get(node, []):
                      visit(target, depth + 1)
                  visiting.remove(node)
                  visited.add(node)

              for node in sorted(graph):
                  visit(node, 1)
          '''
          new = '''def _acyclic(graph: dict[str, list[str]], label: str, maximum_depth: int) -> None:
              visiting: set[str] = set()
              subtree_depth: dict[str, int] = {}

              def depth(node: str) -> int:
                  if node in visiting:
                      raise ValueError(f"Taxonomy {label} graph contains a cycle at {node!r}")
                  cached = subtree_depth.get(node)
                  if cached is not None:
                      return cached
                  visiting.add(node)
                  try:
                      result = 1
                      for target in graph.get(node, []):
                          result = max(result, 1 + depth(target))
                  finally:
                      visiting.remove(node)
                  subtree_depth[node] = result
                  return result

              for node in sorted(graph):
                  if depth(node) > maximum_depth:
                      raise ValueError(f"Taxonomy {label} graph exceeds depth {maximum_depth}")
          '''
          old = "\n".join(line[10:] if line.startswith("          ") else line for line in old.splitlines())
          new = "\n".join(line[10:] if line.startswith("          ") else line for line in new.splitlines())
          if text.count(old) != 1:
              raise SystemExit("Expected exactly one original _acyclic implementation")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Verify the fix
        shell: bash
        run: |
          python -m py_compile \
            studio_prompt/adult_illustration_taxonomy.py \
            tests/test_adult_illustration_taxonomy.py \
            tests/test_adult_illustration_taxonomy_depth.py
          python -m unittest discover -s tests -p 'test_adult_illustration_taxonomy*.py' -v

      - name: Commit the reviewed fix and remove this workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-apply-taxonomy-depth-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio_prompt/adult_illustration_taxonomy.py tests/test_adult_illustration_taxonomy_depth.py .github/workflows/tmp-apply-taxonomy-depth-fix.yml
          git commit -m "fix: enforce adult taxonomy relationship depth"
          git push origin HEAD:codex/adult-illustration-taxonomy-intake
