name: Studio AV
on:
  pull_request:
    paths: ['studio_av/**','scripts/studio_av*','tests/test_studio_av*','research/av-studio/**','integrations/blender/av_job.py','.github/workflows/studio-av.yml']
  push:
    branches: [main]
    paths: ['studio_av/**','scripts/studio_av*','tests/test_studio_av*','research/av-studio/**','integrations/blender/av_job.py','.github/workflows/studio-av.yml']
permissions:
  contents: read
jobs:
  offline-and-mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg from the signed Ubuntu archives
        timeout-minutes: 4
        run: |
          # The runner's priority-one Azure mirror stalled both AV attempts.
          # Select the official HTTPS archives for this invocation only.
          cat > "$RUNNER_TEMP/studio-av.sources" <<'SOURCES'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu
          Suites: noble-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SOURCES
          apt_options=(
            -o "Dir::Etc::sourcelist=$RUNNER_TEMP/studio-av.sources"
            -o Dir::Etc::sourceparts=-
            -o Acquire::Retries=1
            -o Acquire::http::Timeout=15
            -o Acquire::https::Timeout=15
            -o APT::Update::Error-Mode=any
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --no-install-recommends -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - run: python -m pip install Pillow==12.3.0 -r research/av-studio/requirements-mcp.txt
      - run: python -m unittest discover -s tests -p 'test_studio_av*.py' -v
      - run: python scripts/studio_av_demo.py --out '${{ runner.temp }}/av-demo' --render
      - run: python scripts/studio_av_workbench.py '${{ runner.temp }}/av-demo/project.json' --workspace '${{ runner.temp }}/av-demo' --preview '${{ runner.temp }}/av-demo/render/preview.mp4' --out '${{ runner.temp }}/av-workbench.html'
