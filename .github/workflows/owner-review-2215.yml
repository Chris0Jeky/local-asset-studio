name: Backend root review verification
on:
  push:
    branches: [codex/chronological-audit-2215]
    paths: [.github/workflows/owner-review-2215.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact root guard and fixture patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/owner-review-proof
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin codex/mixed-batch-stage-ownership
          python - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess,urllib.request
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          sha='207e0ff68356fdee79ad95b60a544f139b4a9ec6'
          req=urllib.request.Request('https://api.github.com/repos/Chris0Jeky/local-asset-studio/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as response:blob=json.load(response)
          archive=base64.b64decode(blob['content'])
          assert hashlib.sha1(b'blob '+str(len(archive)).encode()+b'\0'+archive).hexdigest()==sha
          assert hashlib.sha256(archive).hexdigest()=='74b52174e8c50088a7eea783eb77cfe4df351eb0bdf585b0db3a4d04d3b4a28b'
          package=json.loads(lzma.decompress(archive));head='2efd3dbc39c0891265462bd6bba9cc0bab7ea433'
          assert package['head']==head
          assert git('rev-parse','origin/codex/mixed-batch-stage-ownership')==head, 'PR changed; preserve rather than overwrite'
          subprocess.run(['git','switch','-C','verified-owner','origin/codex/mixed-batch-stage-ownership'],check=True)
          allowed={'app/production.py','tests/test_production.py','tests/test_mixed_batch_owner.py','docs/reconciliation/2026-09-13-stage-ownership.md'}
          assert set(package['manifest'])==allowed
          for path,record in package['manifest'].items():assert git('rev-parse','HEAD:'+path)==record['before_blob'],path
          root=pathlib.Path('/tmp/owner-review-proof');patch=root/'review.patch';patch.write_text(package['patch'],encoding='utf-8')
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==allowed
          for path,record in package['manifest'].items():assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()==record['sha256'],path
          (root/'manifest.json').write_text(json.dumps({'base':package['base'],'previous_head':head,'files':package['manifest'],'tested_tree':git('write-tree')},indent=2),encoding='utf-8')
          PY
      - run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - name: Full suite and repository contracts
        run: |
          set -o pipefail
          python -m unittest discover -s tests 2>&1 | tee /tmp/owner-review-proof/full-suite.log
          python scripts/validate-repo.py 2>&1 | tee /tmp/owner-review-proof/validation.log
          git diff --cached --check
          git diff --exit-code
      - name: Publish verified root guard
        run: |
          git commit -m 'fix: verify backend storage identity with complete preflight fixtures (#228)'
          git push origin HEAD:codex/mixed-batch-stage-ownership
          git rev-parse HEAD > /tmp/owner-review-proof/published-commit.txt
          git rev-parse HEAD^{tree} > /tmp/owner-review-proof/published-tree.txt
          git diff --binary 3d3135a17811d2e4846ada05aae35e06f60d92f4 HEAD > /tmp/owner-review-proof/complete.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chronological-final-owner-proof
          path: /tmp/owner-review-proof/
          retention-days: 7
