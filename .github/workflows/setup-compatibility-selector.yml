name: Setup compatibility selector

on:
  pull_request:
    paths:
      - 'app/static/setup-compatibility-selector.js'
      - 'app/static/setup-compatibility-selector.css'
      - 'app/static/studio-shell.js'
      - 'tests/setup_compatibility_selector.cjs'
      - 'tests/test_setup_compatibility_selector.py'
      - 'tests/setup_compatibility_selector_browser.py'
      - '.github/workflows/setup-compatibility-selector.yml'

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/setup_compatibility_selector.cjs
      - run: python -m unittest discover -s tests -p 'test_setup_compatibility_selector.py' -v
      - run: python scripts/validate-repo.py

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/setup_compatibility_selector_browser.py --out .runtime/setup-compatibility-selector
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: setup-compatibility-selector-proof
          path: .runtime/setup-compatibility-selector/
          if-no-files-found: ignore
          retention-days: 7
