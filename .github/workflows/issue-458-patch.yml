name: Issue 458 admission patch

on:
  push:
    branches:
      - fix/reference-hold-observation-admission

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm the regression is red
        shell: bash
        run: |
          set +e
          PYTHONPATH=tests python -m unittest tests.test_reference_hold_observation_admission -v > "$RUNNER_TEMP/issue-458-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/issue-458-red.log"
          test "$status" -ne 0
          grep -q "require_worker_observation" "$RUNNER_TEMP/issue-458-red.log"

      - name: Apply the minimal observation admission split
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "app/server.py",
              '''    def require_worker(self):
                  if getattr(self, "reference_jobs", None): self.reference_jobs.require_available()
                  # Preserve pre-start/offline fixture behavior; never replace a dead worker
                  # or silently replay its queue. All queue writers share this admission.
                  if not Studio.worker_available(self):
                      raise StudioError('Studio worker is unavailable. Restart Studio; no work was queued or reserved.')
          ''',
              '''    def require_worker_observation(self):
                  # Known-prompt observation uses the shared worker without requesting
                  # admission for a new reservation, submission or inference call.
                  if not Studio.worker_available(self):
                      raise StudioError('Studio worker is unavailable. Restart Studio; no work was queued or reserved.')

              def require_worker(self):
                  if getattr(self, "reference_jobs", None): self.reference_jobs.require_available()
                  # Preserve pre-start/offline fixture behavior; new work never replaces a
                  # dead worker or silently replays its queue.
                  self.require_worker_observation()
          ''',
          )
          replace_once(
              "app/server.py",
              '''    def _resume_tracking(self, job):
                  self.require_worker()
          ''',
              '''    def _resume_tracking(self, job):
                  self.require_worker_observation()
          ''',
          )
          replace_once(
              "app/mixed_batch.py",
              '''        if action=='observe':
                      studio.require_worker()
          ''',
              '''        if action=='observe':
                      studio.require_worker_observation()
          ''',
          )
          PY

      - name: Run focused and adjacent recovery contracts
        shell: bash
        run: |
          PYTHONPATH=tests python -m unittest \
            tests.test_reference_hold_observation_admission \
            tests.test_mixed_batch \
            tests.test_mixed_batch_owner \
            tests.test_production_terminal \
            tests.test_reference_jobs -v

      - name: Commit verified production changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/server.py app/mixed_batch.py
          git commit -m "fix: separate observation worker admission"
          git push origin HEAD:fix/reference-hold-observation-admission
