name: Apply setup compatibility seam

on:
  push:
    branches: [codex/setup-compatibility-readonly-seam]
    paths:
      - tools/apply_setup_compatibility_seam.py
      - .github/workflows/setup-compatibility-seam-apply.yml

permissions:
  contents: write

concurrency:
  group: setup-compatibility-seam-apply
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/setup-compatibility-readonly-seam
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository test dependencies
        run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - name: Apply exact-match product patch
        run: python tools/apply_setup_compatibility_seam.py
      - name: Verify compatibility seam and adjacent contracts
        run: |
          python -m unittest discover -s tests -p 'test_setup_context_compatibility*.py' -v
          python -m unittest discover -s tests -p 'test_setup_compatibility.py' -v
          python -m unittest discover -s tests -p 'test_source_compatibility*.py' -v
          python -m unittest discover -s tests -p 'test_workflow_agent_bridge.py' -v
          python -m unittest discover -s tests -p 'test_recipe_shortlist_proposal.py' -v
          python -m compileall -q studio_workflow tests/test_setup_context_compatibility_seam.py
          python scripts/validate-repo.py
      - name: Remove temporary delivery files
        run: |
          rm tools/apply_setup_compatibility_seam.py
          rm .github/workflows/setup-compatibility-seam-apply.yml
          rm .github/workflows/setup-compatibility-seam-red.yml
          test ! -e tools/apply_setup_compatibility_seam.py
          test ! -e .github/workflows/setup-compatibility-seam-apply.yml
          test ! -e .github/workflows/setup-compatibility-seam-red.yml
      - name: Commit verified product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'feat: expose read-only setup compatibility seam'
          git push origin HEAD:codex/setup-compatibility-readonly-seam
