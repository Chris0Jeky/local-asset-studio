name: Grok permission schema regression

on:
  push:
    branches:
      - test/grok-permission-schema

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_agent_harness.GrokAdapterTests.test_grok_permission_rules_use_native_schema -v
