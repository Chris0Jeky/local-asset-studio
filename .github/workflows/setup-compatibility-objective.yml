name: Apply setup compatibility objective fix
on:
  push:
    branches: [codex/setup-compatibility-intelligence]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - name: Apply guarded objective fix
        run: python scripts/apply_setup_compatibility_objective_fix.py
      - name: Verify compatibility contracts and repository structure
        run: |
          python -m unittest discover -s tests -p 'test_setup_compatibility*.py' -v
          python scripts/validate-repo.py
      - name: Remove temporary patch helpers
        run: rm .github/workflows/setup-compatibility-objective.yml scripts/apply_setup_compatibility_objective_fix.py
      - name: Commit verified objective fix
        run: |
          git config user.name 'Cristian Tcaci'
          git config user.email '59696583+Chris0Jeky@users.noreply.github.com'
          git add -A
          git commit -m 'fix: validate setup slot objective identifiers'
          git push origin HEAD:codex/setup-compatibility-intelligence
