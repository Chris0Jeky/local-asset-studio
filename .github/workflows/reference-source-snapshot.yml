name: Reference source snapshot (temporary)
on:
  push:
    branches: [codex/reference-source-snapshot-20260914]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5bd25aca59caa364be0092416a57f859e6f80fda
          persist-credentials: false
      - name: Archive the exact public tracked source for offline verification
        run: |
          git rev-parse HEAD > source-identity.txt
          git archive --format=tar HEAD | gzip > reference-source.tar.gz
          sha256sum reference-source.tar.gz >> source-identity.txt
      - uses: actions/upload-artifact@v4
        with:
          name: reference-source-5bd25aca
          path: |
            reference-source.tar.gz
            source-identity.txt
          retention-days: 1
          if-no-files-found: error
