name: Frontier research tools
on:
  pull_request:
    paths:
      - 'research/frontier/**'
      - 'scripts/frontier_workbench.py'
      - 'tests/test_frontier_workbench.py'
      - '.github/workflows/frontier-research.yml'
  push:
    branches: [main]
    paths:
      - 'research/frontier/**'
      - 'scripts/frontier_workbench.py'
      - 'tests/test_frontier_workbench.py'
      - '.github/workflows/frontier-research.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_frontier_workbench.py -v
      - run: python scripts/frontier_workbench.py validate
      - run: python scripts/frontier_workbench.py render --out /tmp/frontier-workbench.html
