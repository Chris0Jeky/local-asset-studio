name: Apply source observation ordering fix
on:
  push:
    branches: [codex/setup-context-compatibility]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - name: Canonically order retained source observations
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('studio_workflow/source_compatibility.py')
          text = path.read_text(encoding='utf-8')
          old = """    source_observations, gallery = gallery_claims(
        report, candidate['id'], version_id, diagnostics)
    evidence = [provider_evidence] + [
"""
          new = """    source_observations, gallery = gallery_claims(
        report, candidate['id'], version_id, diagnostics)
    source_observations = sorted(source_observations, key=canonical)
    evidence = [provider_evidence] + [
"""
          count = text.count(old)
          print(f'observation ordering replacement: {count} exact match(es)')
          if count != 1:
              raise SystemExit(f'expected one source observation block, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Verify source, context, evaluator and substitution contracts
        run: |
          python -m unittest discover -s tests -p 'test_setup_context*.py' -v
          python -m unittest discover -s tests -p 'test_setup_source_evidence*.py' -v
          python -m unittest discover -s tests -p 'test_setup_compatibility*.py' -v
          python -m unittest discover -s tests -p 'test_setup_substitution*.py' -v
          python scripts/validate-repo.py
      - name: Remove temporary delivery workflow
        run: rm .github/workflows/setup-context-source-observation-order.yml
      - name: Commit verified implementation
        run: |
          git config user.name 'Cristian Tcaci'
          git config user.email '59696583+Chris0Jeky@users.noreply.github.com'
          git add -A
          git commit -m 'fix: canonicalize sealed source observations'
          git push origin HEAD:codex/setup-context-compatibility
