name: Setup context source observation ordering
on:
  push:
    branches: [codex/setup-context-compatibility]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_setup_context_source_diagnostic_order.py' -v
