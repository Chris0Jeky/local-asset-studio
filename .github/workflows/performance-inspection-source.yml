name: Temporary performance inspection source
on:
  push:
    branches: [codex/performance-inspection-source-1217]
    paths: [.github/workflows/performance-inspection-source.yml]
permissions:
  contents: read
jobs:
  windows-stat:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9d0b567dd5d1d3546dd38124d45243da19c01aa9
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements-runtime.txt
      - name: Diagnose native reader on actual writer fixtures
        shell: python
        run: |
          import inspect, json, pathlib, tempfile, sys
          sys.path[:0] = ['app', 'tests', '.']
          import resource_receipts as r
          from test_resource_receipts import make_observation
          original = r.require
          fields = ('st_dev','st_ino','st_size','st_mtime_ns','st_ctime_ns','st_mode','st_file_attributes','st_birthtime_ns')
          def view(info): return {key:getattr(info,key,None) for key in fields}
          def check(condition, code):
              if not condition and code == 'file_changed':
                  data = inspect.currentframe().f_back.f_locals
                  print(json.dumps({key:view(data[key]) for key in ('before','opened','after') if key in data}))
              return original(condition, code)
          r.require = check
          for i in range(3):
              with tempfile.TemporaryDirectory() as folder:
                  directory = make_observation(pathlib.Path(folder), job_id='synthetic-job')
                  try:
                      report = r.inspect_observation(directory)
                      print(json.dumps({'trial':i,'integrity':report['integrity']}))
                  except r.EvidenceError as error:
                      print(json.dumps({'trial':i,'reason':error.code}))
