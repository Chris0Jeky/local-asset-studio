name: Temporary performance inspection source
on:
  push:
    branches: [codex/performance-inspection-source-1217]
    paths: [.github/workflows/performance-inspection-source.yml]
permissions:
  contents: read
jobs:
  windows-stat:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare native path and descriptor metadata on synthetic files
        shell: python
        run: |
          import json, os, pathlib, tempfile, sys
          fields = ('st_dev', 'st_ino', 'st_size', 'st_mtime_ns', 'st_ctime_ns', 'st_mode', 'st_file_attributes', 'st_birthtime_ns')
          def view(info): return {key: getattr(info, key, None) for key in fields}
          with tempfile.TemporaryDirectory() as folder:
              path = pathlib.Path(folder) / 'synthetic.bin'
              path.write_bytes(b'resource fixture')
              fd = os.open(path, os.O_RDONLY | os.O_BINARY)
              try:
                  print(json.dumps({'python': sys.version, 'path': view(path.lstat()), 'descriptor': view(os.fstat(fd))}))
              finally:
                  os.close(fd)
