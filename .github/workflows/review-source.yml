name: Observe privacy layout regression
on:
  push:
    branches: [codex/privacy-qualification-20261028]
    paths: ['.github/workflows/review-source.yml']
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0ecbcbbc1c8015ae35ca5a1e7fec5a4e3194c48
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright==1.57.0 pillow psutil
      - run: bash scripts/ci-install-chromium.sh
        timeout-minutes: 4
      - name: Observe exact frontend on synthetic HTTP fixture without generation
        shell: bash
        run: |
          python - <<'PY'
          import sys,json,threading,pathlib,hashlib
          sys.path.insert(0,'tests')
          import studio_browser_smoke as fixture
          from browser_ports import browser_server
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('.runtime/layout-observation');out.mkdir(parents=True)
          server=browser_server(fixture.Handler);thread=threading.Thread(target=server.serve_forever,daemon=True);thread.start()
          origin='http://127.0.0.1:'+str(server.server_port)
          def geometry(page):
              return page.evaluate('''()=>({height:document.documentElement.scrollHeight,width:innerWidth,bodyClass:document.body.className,nodes:[...document.querySelectorAll('body > *,main > *,#createView > *,#positive,#generate,#workshopRecipeChange')].map(e=>({tag:e.tagName,id:e.id,classes:e.className,text:e.innerText?.slice(0,70),box:e.getBoundingClientRect().toJSON(),display:getComputedStyle(e).display,position:getComputedStyle(e).position,padding:getComputedStyle(e).padding,margin:getComputedStyle(e).margin}))})''')
          try:
              with sync_playwright() as p:
                  browser=p.chromium.launch()
                  page=browser.new_page(viewport={'width':1440,'height':900});errors=[]
                  page.on('pageerror',lambda e:errors.append(str(e)))
                  page.goto(origin+'/#create');page.wait_for_function('!!selected && schemaAvailable && !!document.querySelector("#workshopRecipeChange")')
                  page.wait_for_function('document.querySelector("#workshopEta").textContent.includes("42")');page.wait_for_timeout(200)
                  original=geometry(page);page.screenshot(path=str(out/'original.png'),full_page=True)
                  (out/'original.html').write_text(page.content())
                  page.locator('.privacy-bar').evaluate('e=>e.style.display="none"')
                  hidden=geometry(page)
                  (out/'geometry.json').write_text(json.dumps({'source':'c0ecbcbbc1c8015ae35ca5a1e7fec5a4e3194c48','original':original,'bar_hidden_diagnostic_only':hidden,'errors':errors,'posts':fixture.POSTS},indent=2))
                  print('Original height:',original['height'],'bar-hidden diagnostic:',hidden['height'])
                  assert not errors,errors
                  assert not fixture.POSTS,fixture.POSTS
                  browser.close()
          finally:server.shutdown();server.server_close();thread.join(5)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: privacy-layout-observation
          path: .runtime/layout-observation
          retention-days: 7
          if-no-files-found: error
