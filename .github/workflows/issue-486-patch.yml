name: Issue 486 live prerequisite patch

on:
  push:
    branches:
      - fix/live-use-case-prerequisites

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Confirm the regression is red
        shell: bash
        run: |
          set +e
          PYTHONPATH=tests python -m unittest tests.test_live_use_case_prerequisites -v > "$RUNNER_TEMP/issue-486-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/issue-486-red.log"
          test "$status" -ne 0
          grep -Eq "choose_live_value|LiveCaseSkip|live_data_selector" "$RUNNER_TEMP/issue-486-red.log"

      - name: Apply bounded live prerequisite and skip semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          target = Path('tests/studio_use_cases.py')
          text = target.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one replacement, found {count}: {old[:80]!r}')
              text = text.replace(old, new)

          def replace_driver(case_id: str, replacement: str) -> None:
              global text
              pattern = re.compile(
                  rf"@driver\('{re.escape(case_id)}'\)\ndef .*?(?=\n\n@driver\(|\n\n# --------------------------------------------------------------------------------------)",
                  re.S,
              )
              text, count = pattern.subn(replacement.rstrip(), text)
              if count != 1:
                  raise SystemExit(f'{case_id}: expected one driver replacement, found {count}')

          replace_once(
              "DEAD_END_KINDS = ('missing-control', 'unexplained-disabled', 'error-status')\nCLICK_ACTIONS = ('click', 'check', 'select')\n",
              """DEAD_END_KINDS = ('missing-control', 'unexplained-disabled', 'error-status')
          CLICK_ACTIONS = ('click', 'check', 'select')


          class LiveCaseSkip(RuntimeError):
              \"\"\"A named live-environment prerequisite, not a fabricated UI failure.\"\"\"

              def __init__(self, reason):
                  if not isinstance(reason, str) or not reason.strip() or len(reason.strip()) > 500:
                      raise ValueError('Live skip reason must be 1-500 characters')
                  super().__init__(reason.strip())


          def choose_live_value(values, preferred=None, excluded=()):
              \"\"\"Choose a bounded unique DOM value, preferring the fixture id when present.\"\"\"
              excluded = {item.strip() for item in excluded if isinstance(item, str) and item.strip()}
              choices = []
              for item in values or ():
                  if not isinstance(item, str):
                      continue
                  item = item.strip()
                  if not item or len(item) > 256 or item in choices or item in excluded:
                      continue
                  choices.append(item)
              preferred = preferred.strip() if isinstance(preferred, str) else None
              if preferred in choices:
                  return preferred
              return choices[0] if choices else None


          def case_result(row):
              if row.get('skipped'):
                  return 'SKIP'
              return 'PASS' if row.get('passed') else 'FAIL'


          def _css_attribute_value(value):
              return value.replace('\\\\', '\\\\\\\\').replace('"', '\\\\"').replace('\n', '\\\\a ')
          """,
          )

          replace_once(
              """    # -- helpers used by drivers --------------------------------------------------------
              def boot(self, route='#home'):
          """,
              """    # -- live prerequisite helpers -------------------------------------------------------
              def skip(self, reason):
                  if not self.live:
                      raise AssertionError('Fixture mode must not skip: ' + str(reason))
                  raise LiveCaseSkip(reason)

              def require_live(self, selector, reason, *, enabled=False, timeout=3000):
                  if not self.live:
                      return selector
                  locator = self.page.locator(selector).first
                  try:
                      locator.wait_for(state='attached', timeout=timeout)
                      probe = locator.evaluate(PROBE_ELEMENT)
                  except Exception:
                      self.skip(reason)
                  if not probe['shown']:
                      self.skip(reason)
                  if enabled and probe['disabled']:
                      detail = probe.get('reason') or ''
                      self.skip(reason + (': ' + detail if detail else ''))
                  return selector

              def live_data_selector(self, attribute, fixture_value=None, *, scope='', reason='no matching live item', excluded=(), timeout=3000):
                  if not isinstance(attribute, str) or not re.fullmatch(r'data-[a-z0-9-]{1,64}', attribute):
                      raise ValueError('Live selector attribute must be a bounded data-* name')
                  prefix = scope.strip() + ' ' if scope and scope.strip() else ''
                  base = prefix + '[' + attribute + ']'
                  if self.live:
                      try:
                          self.page.locator(base).first.wait_for(state='attached', timeout=timeout)
                      except Exception:
                          self.skip(reason)
                      script = """nodes => nodes.filter(node => {
                        const style = getComputedStyle(node), rect = node.getBoundingClientRect();
                        return rect.width > 0 && rect.height > 0 && style.display !== 'none' && style.visibility !== 'hidden';
                      }).map(node => node.getAttribute(%s))""" % json.dumps(attribute)
                      values = self.page.eval_on_selector_all(base, script)
                  else:
                      values = [fixture_value]
                  selected = choose_live_value(values, fixture_value, excluded)
                  if selected is None:
                      if self.live:
                          self.skip(reason)
                      raise ValueError('Fixture selector requires a bounded value')
                  return selected, prefix + '[' + attribute + '=\"' + _css_attribute_value(selected) + '\"]'

              # -- helpers used by drivers --------------------------------------------------------
              def boot(self, route='#home'):
          """,
          )

          replace_driver('reference-edit-one-source', r'''@driver('reference-edit-one-source')
          def _one_reference(c):
              c.boot('#create')
              c.act('#workshopRecipeChange', note='open the recipe picker', supplementary=True, navigation=c.live)
              c.act('#presetList [data-id="anima-portrait"]', note='a text-only illustration recipe', navigation=c.live)
              c.act('#uxPullAsset', note='deliberate wrong turn: text-only recipe has no reference slot', navigation=c.live)
              c.act('#uxSourcePicker[open], #referenceHint, #uxNotice', 'read', note='what the screen says after the wrong turn')
              c.act('#workshopRecipeChange', note='open the recipe picker', supplementary=True, navigation=c.live)
              c.act('#presetSearch', 'fill', typed='Atelier')
              c.act('#presetList [data-id="qwen-1ref"]', note='the one-reference Qwen Atelier recipe', navigation=c.live)
              c.act('#uxPullAsset', navigation=c.live)
              if c.page.locator('#uxSourcePicker[open]').count():
                  _, asset_selector = c.live_data_selector(
                      'data-ux-pull', 'asset-0', scope='#uxSourcePicker', reason='no Workspace image asset'
                  )
                  if c.live:
                      c.act(asset_selector, 'read', note='current Workspace source is available; attachment is read-only')
                      c.skip('live read-only mode does not attach Workspace assets')
                  try:
                      c.page.click(asset_selector, timeout=4000); c.page.wait_for_timeout(500)
                  except Exception:
                      pass
              elif c.live:
                  c.skip('the installed reference recipe did not open a source picker')
              c.act('#positive', 'fill', typed='Change the cloak to deep blue. Keep the face, hair and lantern exactly as they are.')
              c.act('#generate', 'read', note='readiness only; never pressed')
              return c.ready(), 'run control enabled=%s' % c.ready()
          ''')

          replace_driver('three-reference-identity-pose-style', r'''@driver('three-reference-identity-pose-style')
          def _three_references(c):
              c.boot('#create')
              c.act('#workshopRecipeChange', note='open the recipe picker', supplementary=True, navigation=c.live)
              c.act('#presetList [data-id="qwen-3ref"]', note='the three-reference Qwen Atelier recipe', navigation=c.live)
              c.require_live('[data-ref-role="0"]', 'no installed three-reference recipe')
              for index, (role, asset) in enumerate([('identity', 'asset-0'), ('pose', 'asset-1'), ('style', 'asset-4')]):
                  c.act('[data-ref-role="%d"]' % index, 'select', typed=role, navigation=c.live)
                  c.act('#uxPullAsset', note='attach picture %d' % (index + 1), navigation=c.live)
                  picked = False
                  if c.page.locator('#uxSourcePicker[open]').count():
                      _, asset_selector = c.live_data_selector(
                          'data-ux-pull', asset, scope='#uxSourcePicker', reason='fewer than three Workspace image assets'
                      )
                      if c.live:
                          c.act(asset_selector, 'read', note='current Workspace source is available; attachment is read-only')
                          c.skip('live read-only mode does not attach the three reference images')
                      try:
                          c.page.select_option('#uxSourceSlot', str(index), timeout=3000)
                          c.page.click(asset_selector, timeout=4000); c.page.wait_for_timeout(600); picked = True
                      except Exception:
                          pass
                  elif c.live:
                      c.skip('the installed three-reference recipe did not open a source picker')
                  if not picked and c.page.locator('#uxSourcePicker[open]').count():
                      try: c.page.click('[data-ux-close="uxSourcePicker"]', timeout=2000)
                      except Exception: pass
              c.act('[data-ref-contribution="0"]', 'fill', typed='Face, hair colour and the brass lantern.')
              c.act('#positive', 'fill', typed='Same character, seated and reading. Keep the face and lantern unchanged.')
              c.act('#generate', 'read', note='readiness only; never pressed')
              filled = c.page.evaluate('referenceRecords.filter(r=>r.file).length')
              return c.ready() and filled == 3, '%d/3 slots attached, run control enabled=%s' % (filled, c.ready())
          ''')

          replace_driver('compare-settings-from-recipe', r'''@driver('compare-settings-from-recipe')
          def _compare(c):
              c.boot('#create')
              c.act('#workshopRecipeChange', note='open the recipe picker', supplementary=True, navigation=c.live)
              c.act('#presetList [data-id="anima-portrait"]', note='the baseline recipe', navigation=c.live)
              c.act('#positive', 'fill', typed=BRIEF)
              c.act('#workshopReview', note='open run details', supplementary=True, navigation=c.live)
              c.act('#planComparison', navigation=c.live)
              if c.live:
                  c.skip('live read-only mode does not open or prepare comparison plans')
              c.act('#experimentAxis', 'select', typed='cfg')
              c.act('#experimentValues', 'read', note='proposed candidate values')
              proposed = len([v for v in (c.page.locator('#experimentValues').input_value() or '').split(',') if v.strip()])
              before = c.studies()
              c.act('#experimentBudget', 'fill', typed=str(max(proposed, 1)), note='%d proposed values need at least %d runs' % (proposed, proposed))
              c.act('#prepareExperiment')
              fresh = c.wait_for_new_study(before)
              status = c.dialog_status('#experimentStatus')
              detail = '%d new study listed (allowance %d for %d values)%s' % (len(fresh), max(proposed, 1), proposed, '; planner said: ' + status if status else '')
              c.act('#productionList', 'read', note=detail)
              return bool(fresh), detail
          ''')

          replace_driver('review-and-keep-winner', r'''@driver('review-and-keep-winner')
          def _review(c):
              c.boot('#production')
              c.act('#productionList', 'read', note='%d studies listed' % c.wait_for_studies())
              _, project_selector = c.live_data_selector(
                  'data-project', 'c' * 32, scope='#productionList', reason='no reviewable study'
              )
              c.act(project_selector, note='the newest available comparison', navigation=c.live)
              c.require_live('#productionDetail [data-candidate-open]', 'no completed comparison candidate')
              c.act('#blindComparison', note='reveal candidate settings', navigation=c.live)
              c.act('#productionDetail [data-candidate-open]', note='open a candidate at full size', navigation=c.live)
              if c.page.locator('#assetDialog[open]').count():
                  try: c.page.click('#closeAssetDialog', timeout=3000); c.page.wait_for_timeout(300)
                  except Exception: pass
              c.act('#productionNotes', 'fill', typed='Candidate A keeps the silhouette and the lantern glow; B loses the face.')
              if c.live:
                  c.skip('live read-only mode does not record winner decisions')
              c.act('#productionDetail [data-choose-candidate]', note='keep the winner')
              c.page.wait_for_timeout(600)
              recorded = 'reviewed' in (c.page.locator('#productionDetail').inner_text().lower() if c.page.locator('#productionDetail').count() else '')
              c.act('#productionDetail', 'read', note='choice recorded=%s' % recorded)
              return recorded, 'study state shows reviewed=%s' % recorded
          ''')

          replace_driver('reuse-keeper-as-reference', r'''@driver('reuse-keeper-as-reference')
          def _reuse(c):
              c.boot('#assets')
              c.page.wait_for_timeout(600)
              c.act('#assetGrid', 'read', note='saved pictures listed')
              selected_asset, open_selector = c.live_data_selector(
                  'data-asset-open', 'asset-1', scope='#assetGrid', reason='no Workspace image asset'
              )
              c.act(open_selector, note='open the newest available picture', navigation=c.live)
              _, handoff_selector = c.live_data_selector(
                  'data-ux-handoff', selected_asset, reason='the selected asset has no continuation handoff'
              )
              c.act(handoff_selector, note='continue with this picture', navigation=c.live)
              c.require_live('#uxDestination', 'no compatible continuation destination')
              c.act('#uxDestination', 'select', typed='qwen-1ref', navigation=c.live)
              if c.live:
                  c.skip('live read-only mode does not prepare asset handoffs')
              c.act('#uxPrepareHandoff')
              c.page.wait_for_timeout(800)
              lineage = c.page.evaluate('typeof parentAssets !== "undefined" ? parentAssets[0] : null')
              c.act('#uxContinuation', 'read', note='lineage parent=%s' % lineage)
              c.act('#positive', 'fill', typed='Same character at dawn. Keep the face, cloak and lantern unchanged.')
              c.act('#generate', 'read', note='readiness only; never pressed')
              return lineage == selected_asset, 'lineage parent=%s, run control enabled=%s' % (lineage, c.ready())
          ''')

          replace_driver('restyle-recent-output-with-a-look', r'''@driver('restyle-recent-output-with-a-look')
          def _restyle(c):
              \"\"\"The owner's 14 Sep 2026 report: a liked output, a second picture with the wanted look, no idea which recipe.\"\"\"
              c.boot('#create')
              c.page.wait_for_timeout(600)
              c.act('#workshopResults > summary', note='open recent runs', supplementary=True, navigation=c.live)
              c.require_live('#gallery .reference-output', 'no completed image output')
              c.act('#gallery .reference-output', note='continue with the newest completed output', navigation=c.live)
              c.require_live('#uxHandoffIntents [data-ux-destination="restyle"]', 'no compatible Restyle route')
              c.act('#uxHandoffIntents [data-ux-destination="restyle"]', note='the route that borrows a look', navigation=c.live)
              c.act('#uxHandoffDetails', 'read', note='what Restyle does with this picture')
              try: c.page.click('#uxHandoff details:has(#uxHandoffPrompt) > summary', timeout=2000)
              except Exception: pass
              c.act('#uxHandoffPrompt', 'read', note='the wording prepared for this pass')
              if c.live:
                  c.skip('live read-only mode does not prepare Restyle handoffs')
              c.act('#uxPrepareHandoff')
              c.page.wait_for_timeout(800)
              board = c.page.evaluate('typeof selected !== "undefined" && !!(selected.continuation_capability && selected.continuation_capability.board_min)')
              if board:
                  c.act('#uxBlockers', 'read', note='what is still missing after preparing')
                  c.act('#uxPullAsset', note='add the picture whose look is wanted')
                  if c.page.locator('#uxSourcePicker[open]').count():
                      try: c.page.select_option('#uxSourceSlot', '0', timeout=3000)
                      except Exception: pass
                      _, asset_selector = c.live_data_selector('data-ux-pull', 'asset-4', scope='#uxSourcePicker', reason='no second Workspace image asset')
                      c.act(asset_selector, note='a saved picture for Picture 1')
                      if c.page.locator('#uxSourcePicker[open]').count():
                          try: c.page.click('[data-ux-close="uxSourcePicker"]', timeout=2000)
                          except Exception: pass
                  else: c.act('#referenceCards', 'read', note='the picker did not open; board state as found')
              else:
                  c.act('#uxContinuation', 'read', note='the source panel: nothing missing, no board to fill')
                  c.act('#positive', 'read', note='the prepared wording: the finish, what to keep, the source description')
              c.page.wait_for_timeout(400)
              c.act('#generate', 'read', note='readiness only; never pressed')
              attached = c.page.evaluate('typeof lastUploaded !== "undefined" && !!lastUploaded' if board else 'typeof uploaded !== "undefined" && !!uploaded')
              filled = c.page.evaluate('typeof referenceRecords !== "undefined" ? referenceRecords.filter(r=>r.file).length : 0') if board else 0
              words = c.page.evaluate('(document.querySelector("#positive").value || "").trim().split(/\\s+/).filter(Boolean).length')
              done = c.ready() and attached and (filled >= 1 if board else words >= 20)
              return done, 'source attached=%s, board recipe=%s, %d board picture(s), %d prepared words, run control enabled=%s' % (attached, board, filled, words, c.ready())
          ''')

          replace_driver('combine-character-with-another-pose', r'''@driver('combine-character-with-another-pose')
          def _combine(c):
              \"\"\"The owner's 14 Sep 2026 attempt: 'the pose of the second image' typed into a one-picture recipe gave the same picture.\"\"\"
              c.boot('#create')
              c.page.wait_for_timeout(600)
              c.act('#workshopResults > summary', note='open recent runs', supplementary=True, navigation=c.live)
              c.require_live('#gallery .reference-output', 'no completed image output')
              c.act('#gallery .reference-output', note='continue with the newest completed output', navigation=c.live)
              c.require_live('#uxHandoffIntents [data-ux-destination="combine"]', 'no compatible Combine route')
              c.act('#uxHandoffIntents [data-ux-destination="combine"]', note='the route that combines two pictures', navigation=c.live)
              c.act('#uxHandoffDetails', 'read', note='what Combine does with this picture')
              try: c.page.click('#uxHandoff details:has(#uxHandoffPrompt) > summary', timeout=2000)
              except Exception: pass
              c.act('#uxHandoffPrompt', 'read', note='the wording prepared for this pass: image 1, image 2, the bracketed fills')
              if c.live:
                  c.skip('live read-only mode does not prepare Combine handoffs')
              c.act('#uxPrepareHandoff')
              c.page.wait_for_timeout(800)
              c.act('#uxBlockers', 'read', note='what is still missing after preparing: Picture 1 and the fills')
              c.act('#uxPullAsset', note='add the picture whose pose is wanted')
              if c.page.locator('#uxSourcePicker[open]').count():
                  try: c.page.select_option('#uxSourceSlot', '0', timeout=3000)
                  except Exception: pass
                  _, asset_selector = c.live_data_selector('data-ux-pull', 'asset-1', scope='#uxSourcePicker', reason='no second Workspace image asset')
                  c.act(asset_selector, note='a saved picture for Picture 1')
                  if c.page.locator('#uxSourcePicker[open]').count():
                      try: c.page.click('[data-ux-close="uxSourcePicker"]', timeout=2000)
                      except Exception: pass
              else: c.act('#referenceCards', 'read', note='the picker did not open; board state as found')
              c.act('#uxPair', 'read', note='the two pictures side by side, in the order the model reads them')
              wording = c.page.evaluate('(document.querySelector("#positive").value || "")')
              filled_wording = wording
              answers = (('who is in image', 'the witch in the black and red robe'), ('pose', 'leaning forward, one hand on her hip, the other held out'), ('clothes', 'a black and red robe with gold trim, a wide-brimmed black hat'))
              fields = c.page.evaluate('[...document.querySelectorAll("#uxFills:not([hidden]) [data-ux-fill]")].map(i => i.dataset.uxFill)')
              if fields:
                  for index, placeholder in enumerate(fields):
                      words = next((words for key, words in answers if key in placeholder), 'the witch')
                      c.act('[data-ux-fill="%s"]' % placeholder.replace('"', '\\\"'), 'fill', typed=words, note='field %d of %d' % (index + 1, len(fields)))
                  c.page.wait_for_timeout(400)
                  filled_wording = c.page.evaluate('(document.querySelector("#positive").value || "")')
              else:
                  for _ in range(6):
                      start = filled_wording.find('['); end = filled_wording.find(']', start)
                      if start < 0 or end < start: break
                      words = next((words for key, words in answers if key in filled_wording[start:end]), 'the witch')
                      filled_wording = filled_wording[:start] + words + filled_wording[end + 1:]
                  c.act('#positive', 'fill', typed=filled_wording)
                  c.page.wait_for_timeout(400)
              c.act('#generate', 'read', note='readiness only; never pressed')
              attached = c.page.evaluate('typeof lastUploaded !== "undefined" && !!lastUploaded')
              filled = c.page.evaluate('typeof referenceRecords !== "undefined" ? referenceRecords.filter(r=>r.file).length : 0')
              brackets = c.page.evaluate('((document.querySelector("#positive").value || "").match(/\\[/g) || []).length')
              done = c.ready() and attached and filled >= 1 and brackets == 0 and 'image 2' in filled_wording
              return done, 'source attached=%s, %d board picture(s), %d bracket(s) left, run control enabled=%s' % (attached, filled, brackets, c.ready())
          ''')

          replace_driver('draw-a-pose-for-combine', r'''@driver('draw-a-pose-for-combine')
          def _draw_pose(c):
              \"\"\"#444: the stick figure the skeleton recipe needs is drawn on the page, and drawing it submits nothing.\"\"\"
              import studio_browser_smoke as fixture
              c.boot('#create')
              c.page.wait_for_timeout(600)
              c.act('#workshopResults > summary', note='open recent runs', supplementary=True, navigation=c.live)
              c.require_live('#gallery .reference-output', 'no completed image output')
              c.act('#gallery .reference-output', note='continue with the newest completed output', navigation=c.live)
              c.require_live('#uxHandoffIntents [data-ux-destination="combine"]', 'no compatible Combine route')
              c.act('#uxHandoffIntents [data-ux-destination="combine"]', note='the route that combines two pictures', navigation=c.live)
              c.act('#uxDestination', 'select', typed='combine-klein-9b-skeleton', note='the recipe whose image 1 is a drawn skeleton', navigation=c.live)
              if c.live:
                  c.skip('live read-only mode does not prepare or render pose-guide handoffs')
              c.act('#uxPrepareHandoff')
              c.page.wait_for_timeout(800)
              c.act('#uxPoseEditor', 'read', note='the pose is drawn here, beside the two pictures')
              if not c.page.locator('#uxPoseCanvas').count():
                  return False, 'Needs the prepared fixture pair.'
              c.act('#uxPoseStart', 'select', typed='bent', note='start from the research figure, then correct it')
              c.act('[data-ux-joint="4"]', note='pick one joint for the keyboard')
              before = c.page.evaluate('document.querySelector("#uxPoseCanvas").toDataURL()')
              for key in ('ArrowRight', 'ArrowRight', 'Shift+ArrowUp'): c.page.keyboard.press(key)
              c.page.wait_for_timeout(200)
              nudged = c.page.evaluate('document.querySelector("#uxPoseCanvas").toDataURL()') != before
              c.observe('the arrow keys moved the picked joint', nudged, 'the drawing did not change under the keyboard')
              c.act('#uxPoseUnknown', note='leave one joint, and its limbs, out of the guide')
              posts = len(fixture.POSTS)
              c.act('#uxPoseUse')
              c.page.wait_for_function('!!(typeof referenceRecords !== "undefined" && referenceRecords[0] && referenceRecords[0].file)', timeout=10000)
              state = c.page.evaluate('({preset:selected.id,file:(referenceRecords[0]||{}).file,missing:!!(referenceRecords[0]||{}).missing,sha:(referenceRecords[0]||{}).sha256,keep:getControl("positive").value.includes("black and red robe")})')
              routes = [item['path'] for item in fixture.POSTS[posts:]]
              c.observe('the guide was attached without a model run', state['preset'] == 'combine-klein-9b-skeleton' and bool(state['file']) and not state['missing'] and len(state['sha']) == 64 and state['keep'] and routes == ['/api/pose/render'],
                        'state=%r routes=%r' % (state, routes))
              return True, 'guide %s sha=%s; character wording retained=%s; routes=%s' % (state['file'], str(state['sha'])[:12], bool(state['keep']), routes)
          ''')

          replace_driver('build-and-prepare-node-workflow', r'''@driver('build-and-prepare-node-workflow')
          def _workflow(c):
              c.goto('/workflow-studio.html#builder', note='workflow builder')
              try: c.page.wait_for_selector('#loadNodes', timeout=8000)
              except Exception: pass
              c.act('#schemaState', 'read', note='catalog state before anything is loaded')
              c.require_live('#loadNodes', 'the local workflow node catalog is unavailable')
              c.act('#loadNodes', navigation=c.live)
              try: c.page.wait_for_function("document.querySelector('#nodeCount').textContent.includes('installed')", timeout=8000)
              except Exception: pass
              options = c.page.eval_on_selector_all('#presetChoice option', 'nodes => nodes.map(n => n.value).filter(Boolean)')
              if not options and c.live:
                  c.skip('no registered workflow preset is available')
              if options:
                  try: c.page.select_option('#presetChoice', options[0], timeout=3000)
                  except Exception: pass
              c.act('#loadPreset', navigation=c.live)
              c.page.wait_for_timeout(500)
              if c.live:
                  c.require_live('#compileWorkflow', 'the loaded workflow is not ready to compile', enabled=True)
                  c.skip('live read-only mode does not compile or persist workflow documents')
              c.act('#compileWorkflow')
              c.page.wait_for_timeout(500)
              c.act('#exportGraph', 'read', note='export availability after the check')
              c.act('#saveSharedWorkflow', 'read', note='save to Workspace')
              c.act('#prepareSavedRun', 'read', note='prepare a run from a saved revision')
              runs = submissions(OBSERVED_POSTS)
              c.act('#workflowStatus', 'read', note='%d run requests sent' % len(runs))
              exportable = c.page.locator('#exportGraph').count() and not c.page.locator('#exportGraph').is_disabled()
              return bool(exportable) and not runs, 'export available=%s, run requests=%d' % (bool(exportable), len(runs))
          ''')

          replace_driver('frames-to-native-export', r'''@driver('frames-to-native-export')
          def _native_export(c):
              c.boot('#assets')
              c.page.wait_for_timeout(600)
              c.act('#assetGrid', 'read', note='saved pictures listed')
              c.act('#assetType', 'select', typed='image', note='images only', navigation=c.live)
              first_asset, first_selector = c.live_data_selector(
                  'data-asset-check', 'asset-0', scope='#assetGrid', reason='fewer than two Workspace image assets'
              )
              _, second_selector = c.live_data_selector(
                  'data-asset-check', 'asset-1', scope='#assetGrid', reason='fewer than two Workspace image assets', excluded=(first_asset,)
              )
              c.act(first_selector, 'check', navigation=c.live)
              c.act(second_selector, 'check', navigation=c.live)
              if c.live:
                  c.skip('live read-only mode does not prepare native exports')
              c.act('#nativeExport')
              c.act('#nativeKind', 'select', typed='atlas')
              c.act('#nativeAssetList input[data-native-duration]', 'fill', typed='120')
              before = c.studies()
              c.act('#prepareNative')
              fresh = c.wait_for_new_study(before)
              status = c.dialog_status('#nativeStatus')
              detail = '%d new study listed%s' % (len(fresh), '; export dialog said: ' + status if status else '')
              c.act('#productionList', 'read', note=detail)
              return bool(fresh), detail
          ''')

          replace_once(
              """def run_case(spec, page, origin, live, screenshots):
              run = CaseRun(spec, page, origin, live, screenshots)
              passed, detail, failure = False, '', ''
              try: passed, detail = DRIVERS[spec['id']](run)
              except Exception as error: failure = type(error).__name__ + ': ' + str(error).splitlines()[0][:200]
              row = {'id': spec['id'], 'goal': spec['goal'], 'starting_view': spec['starting_view'],
                     'success_condition': spec['success_condition'], 'wrong_turn': bool(spec.get('wrong_turn')),
                     'steps_intended': len(spec['steps']), 'passed': bool(passed) and not failure,
                     'detail': detail, 'failure': failure}
              row.update(case_totals(run.records))
              row['steps'] = run.records
              return row
          """,
              """def run_case(spec, page, origin, live, screenshots):
              run = CaseRun(spec, page, origin, live, screenshots)
              passed, detail, failure, skipped, skip_reason = False, '', '', False, ''
              try:
                  passed, detail = DRIVERS[spec['id']](run)
              except LiveCaseSkip as skip:
                  skipped, skip_reason = True, str(skip)
                  detail = 'skipped: ' + skip_reason
              except Exception as error:
                  failure = type(error).__name__ + ': ' + str(error).splitlines()[0][:200]
              row = {'id': spec['id'], 'goal': spec['goal'], 'starting_view': spec['starting_view'],
                     'success_condition': spec['success_condition'], 'wrong_turn': bool(spec.get('wrong_turn')),
                     'steps_intended': len(spec['steps']), 'passed': bool(passed) and not failure and not skipped,
                     'skipped': skipped, 'skip_reason': skip_reason,
                     'detail': detail, 'failure': failure}
              row.update(case_totals(run.records))
              row['steps'] = run.records
              return row
          """,
          )

          table_pattern = re.compile(r"def table\(rows\):.*?(?=\n\ndef main\()", re.S)
          table_replacement = '''def table(rows):
              header = ['case', 'int', 'took', 'clk', 'sw', 'dead', 'unexp', 'words', 'result']
              body = [[row['id'][:34], str(row['steps_intended']), str(row['steps_taken']), str(row['clicks']),
                       str(row['page_switches']), str(row['dead_ends']), str(row['unexplained_disabled']),
                       str(row['instruction_words']), case_result(row)] for row in rows]
              widths = [max(len(header[i]), *(len(line[i]) for line in body)) for i in range(len(header))] if body else [len(h) for h in header]
              out = ['  '.join(header[i].ljust(widths[i]) for i in range(len(header))),
                     '  '.join('-' * widths[i] for i in range(len(header)))]
              out += ['  '.join(line[i].ljust(widths[i]) for i in range(len(header))) for line in body]
              return '\\n'.join(out)
          '''
          text, count = table_pattern.subn(table_replacement.rstrip(), text)
          if count != 1:
              raise SystemExit(f'expected one table replacement, found {count}')

          replace_once(
              """                print(('PASS ' if rows[-1]['passed'] else 'FAIL ') + spec['id'] + ' · ' + (rows[-1]['detail'] or rows[-1]['failure']), flush=True)
          """,
              """                print(case_result(rows[-1]) + ' ' + spec['id'] + ' · ' + (rows[-1]['detail'] or rows[-1]['failure']), flush=True)
          """,
          )
          replace_once(
              """              'cases': len(rows), 'passed': len([row for row in rows if row['passed']]),
              'generation_submissions': len(submitted), 'posts_observed': len(OBSERVED_POSTS), 'page_errors': errors,
          """,
              """              'cases': len(rows), 'passed': len([row for row in rows if row['passed']]),
              'skipped': len([row for row in rows if row.get('skipped')]),
              'generation_submissions': len(submitted), 'posts_observed': len(OBSERVED_POSTS), 'page_errors': errors,
          """,
          )
          replace_once(
              """    print('mode=%s cases=%d passed=%d generation submissions=%d of %d browser POSTs observed, page errors=%d' % (matrix['mode'], matrix['cases'], matrix['passed'], matrix['generation_submissions'], len(OBSERVED_POSTS), len(errors)))
          """,
              """    print('mode=%s cases=%d passed=%d skipped=%d generation submissions=%d of %d browser POSTs observed, page errors=%d' % (matrix['mode'], matrix['cases'], matrix['passed'], matrix['skipped'], matrix['generation_submissions'], len(OBSERVED_POSTS), len(errors)))
          """,
          )

          target.write_text(text, encoding='utf-8')

          docs = Path('docs/UX-USE-CASE-MATRIX.md')
          body = docs.read_text(encoding='utf-8')
          marker = '## The matrix\n'
          if body.count(marker) != 1:
              raise SystemExit('expected one UX matrix insertion point')
          section = '''## Live read-only coverage and explicit skips — 18 September 2026

          Fixture mode remains the complete deterministic interface qualification: every authored journey must pass against known synthetic evidence. Live mode is deliberately different. It reads the current loopback Studio and therefore reports one of three outcomes:

          - **PASS** — the journey's read-only success condition was reachable with the installed Studio and current local evidence;
          - **SKIP** — a named environmental prerequisite was absent, or completing the success condition would create server state that live mode is forbidden to create;
          - **FAIL** — evidence was available but the interface still produced a missing control, unexplained disabled control, page error or another genuine defect.

          Data-backed drivers no longer assume fixture identifiers such as `asset-0`, `asset-1` or the synthetic comparison id. They retain the fixture id when it is actually rendered; otherwise they use the first visible value in the live UI's newest-first order. If no suitable Workspace image, completed output, reviewable study, compatible route, workflow preset or other prerequisite exists, the row records `skip_reason` and stops before creating a false `missing-control` dead end.

          Live mode still never attaches a Workspace source, prepares a comparison or export, records a winner, prepares a handoff, compiles/persists a workflow or renders a pose guide. Those state-creating boundaries are explicit named skips. Zero generation submissions remains a hard failure invariant in both modes. This closes #486's coverage-accounting defect without claiming that a machine with no local evidence exercised a journey it could not support.

          '''
          docs.write_text(body.replace(marker, section + marker), encoding='utf-8')
          PY

      - name: Run focused offline contracts
        run: |
          PYTHONPATH=tests python -m unittest \
            tests.test_live_use_case_prerequisites \
            tests.test_use_case_matrix -v

      - name: Install fixture browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium

      - name: Run complete fixture matrix
        run: python -u tests/studio_use_cases.py --out "$RUNNER_TEMP/use-case-fixture-after-486.json"

      - name: Verify fixture matrix
        run: |
          python - <<'PY'
          import json, os
          path = os.path.join(os.environ['RUNNER_TEMP'], 'use-case-fixture-after-486.json')
          matrix = json.load(open(path, encoding='utf-8'))
          failed = [row['id'] for row in matrix['rows'] if not row['passed']]
          assert matrix['mode'] == 'fixture'
          assert matrix['skipped'] == 0
          assert matrix['generation_submissions'] == 0
          assert not matrix['page_errors'], matrix['page_errors']
          assert not failed, failed
          print('fixture cases=%d passed=%d skipped=%d' % (matrix['cases'], matrix['passed'], matrix['skipped']))
          PY

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/studio_use_cases.py docs/UX-USE-CASE-MATRIX.md
          git commit -m "fix: report live use-case prerequisites as named skips"
          git push origin HEAD:fix/live-use-case-prerequisites
