name: Maintenance pass 2 source snapshot
on:
  push:
    branches: [codex/maintenance-pass2-source-20260913]
    paths: [.github/workflows/maintenance-pass2-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 61a8c4e16b8e64b8bdea5a121bec71f2b0758cb8
          persist-credentials: false
      - name: Export tracked source and public issue index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD^{tree})" = c7e1c8e0857661ce614ba7dd635a4de2beb90062
          git archive --format=tar HEAD > "$RUNNER_TEMP/source.tar"
          gh api --paginate 'repos/Chris0Jeky/local-asset-studio/issues?state=open&per_page=100' --slurp > "$RUNNER_TEMP/issues.json"
      - uses: actions/upload-artifact@v4
        with:
          name: maintenance-pass2-pinned-source
          path: |
            ${{ runner.temp }}/source.tar
            ${{ runner.temp }}/issues.json
          retention-days: 1
