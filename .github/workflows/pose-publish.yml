name: Publish verified pose continuation candidates
on:
  push:
    branches: [codex/pose-continuation-transfer-20260916]
    paths: [.github/workflows/pose-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: transfer
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 5d502e490ac611126c09f250a7e41f34aed666c3
          path: source
      - name: Publish only hash-checked code patches, never tooling files
        working-directory: source
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          targets = [
              ('pose-parent-fix.patch','1c0ec4db8e0953c2c9211c4c4ed8b10ce5408ed76efcd7a54863db8b24041ddf','c7d5ac0fad404fe41eccc59d66b09924d386563d','codex/pose-guide-handoff-build-2','test: drive missing pose readiness through the actual event listener'),
              ('pose-precision.patch','bce01d91a563bc608478c07c04a0090ce158d66d02e2951f98dea2d8aaa2d472','cd5c8ecc6d403a46f4600f48a0c7110313f6a9c0','codex/pose-precision-build-1','feat: set precise joint positions with explicit draft and undo')
          ]
          for name, digest, expected_tree, branch, message in targets:
              path=Path('../transfer/.transfer')/name
              assert hashlib.sha256(path.read_bytes()).hexdigest()==digest,name
              subprocess.run(['git','apply','--unidiff-zero','--index',str(path.resolve())],check=True)
              tree=subprocess.check_output(['git','write-tree'],text=True).strip()
              assert tree==expected_tree,(name,tree)
              subprocess.run(['git','diff','--cached','--check'],check=True)
              subprocess.run(['node','tests/pose_guide_handoff.cjs'],check=True)
              subprocess.run(['node','tests/pose_editor_core.cjs'],check=True)
              subprocess.run(['python','-m','py_compile','tests/pose_editor_handoff_browser.py'],check=True)
              subprocess.run(['git','-c','user.name=Cristian Tcaci','-c','user.email=59696583+Chris0Jeky@users.noreply.github.com','commit','-m',message],check=True)
              subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
              subprocess.run(['git','rev-parse','HEAD','HEAD^{tree}'],check=True)
          PY
