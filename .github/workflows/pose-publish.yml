name: Publish reviewed pose continuation fixes
on:
  push:
    branches: [codex/pose-continuation-transfer-20260916]
    paths: [.github/workflows/pose-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: transfer
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 09286d618793072756210e69adef6c5b56a1f278
          fetch-depth: 0
          path: source
      - name: Publish verified parent and child merge trees
        working-directory: source
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          def run(*args):
              return subprocess.check_output(args,text=True).strip()
          def apply(name,digest,expected):
              patch=(Path('../transfer/.transfer')/name).resolve()
              assert hashlib.sha256(patch.read_bytes()).hexdigest()==digest
              subprocess.run(['git','apply','--unidiff-zero','--index',str(patch)],check=True)
              tree=run('git','write-tree');assert tree==expected,(name,tree)
              subprocess.run(['git','diff','--cached','--check'],check=True)
              subprocess.run(['node','tests/pose_guide_handoff.cjs'],check=True)
              subprocess.run(['node','tests/pose_editor_core.cjs'],check=True)
              subprocess.run(['python','-m','py_compile','tests/pose_editor_handoff_browser.py'],check=True)
              return tree
          identity=['-c','user.name=Cristian Tcaci','-c','user.email=59696583+Chris0Jeky@users.noreply.github.com']
          tree=apply('pose-parent-review.patch','b8c71d2af7701367b04c9813ac608c375432795852bb9e141b3624274b6fb197','d293ee5decad121c27d9c883724bc472ca0a7bb6')
          parent=run('git',*identity,'commit-tree',tree,'-p','09286d618793072756210e69adef6c5b56a1f278','-m','fix: preserve newer reference operations during pose rendering')
          subprocess.run(['git','push','origin',parent+':refs/heads/codex/pose-guide-handoff-build-3'],check=True)
          # Only the ephemeral checkout is reset; all feature branches preserve their original commits.
          subprocess.run(['git','reset','--hard','9240c885e5d15e9cedea74cef64a0b49de11625b'],check=True)
          tree=apply('pose-child-review.patch','6cb3931f5db95b64328d58ca46aa7d6c2f3ca90830179c22186d734e7a135761','cf2e4548bed26f2eeaa342c860a5fd8594cf8c6b')
          child=run('git',*identity,'commit-tree',tree,'-p','9240c885e5d15e9cedea74cef64a0b49de11625b','-p',parent,'-m','fix: restrict pose arrow keys and retain reviewed reference handoff')
          subprocess.run(['git','push','origin',child+':refs/heads/codex/pose-precision-build-2'],check=True)
          print('PARENT',parent,'CHILD',child)
          PY
