name: Publish maintenance pass 6
on:
  push:
    branches: [codex/maintenance-pass6-transport-20260914]
    paths: [.github/workflows/maintenance-pass6-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 20c46dd45044a6f9193b3e562df5bee4e5fc8912
      - name: Verify exact source and publish isolated feature branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import base64, hashlib, json, os, pathlib, subprocess, zlib
          repo='Chris0Jeky/local-asset-studio'
          base='20c46dd45044a6f9193b3e562df5bee4e5fc8912'
          chunks=['4eb4649fa311c82fe546a32da4015553f31f6820','634e91ec7c7ad98e696e11bc4be2879ad45ca851','8cac3fc7f2ee55911b5478cfdf3a9dda65ae8baf','82d550ad422fea94ab53833bd1536e8a0eb47858','b5b2b9e9e46e65216dd0130e8252f8fb8e1b318c']
          def blob_hash(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          payload=b''
          for index, sha in enumerate(chunks):
              obj=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/git/blobs/{sha}']))
              data=base64.b64decode(''.join(obj['content'].split()),validate=True)
              assert blob_hash(data)==sha
              if index==0:
                  # Correct the detected one-byte transport omission, then
                  # require the original local blob and whole-payload hashes.
                  assert data.count(b'JkJb1ULAJHp5ML')==1
                  data=data.replace(b'JkJb1ULAJHp5ML',b'JkJb1ULAJPhp5ML')
                  assert blob_hash(data)=='25d3bf182f3059428b8a13a24a7d1dd3e95ade2e'
              payload+=data
          assert hashlib.sha256(payload).hexdigest()=='7002b70036423dd2cd371ca727ff759dc5d660e4786b6c264d65212f463a915a'
          raw=zlib.decompress(base64.b64decode(payload,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='847890dd456719cf09054b3913519873dfc2e9dfd87899989709f0fae5a54742'
          specs=json.loads(raw)
          assert [s['branch'] for s in specs]==['codex/native-export-decode-guards','codex/pixel-export-aspect']
          def git(*args):return subprocess.check_output(['git',*args]).decode().strip()
          receipts=[]
          for spec in specs:
              assert spec['base']==base
              assert not git('ls-remote','--heads','origin','refs/heads/'+spec['branch']), 'Existing branch; refusing overwrite'
              git('checkout','--detach',base)
              assert git('rev-parse','HEAD^{tree}')=='a428ce04dd5e4e6edd2121eadda55a6dc509cf06'
              patch=spec['patch'].encode()
              assert hashlib.sha256(patch).hexdigest()==spec['patch_sha256']
              subprocess.run(['git','apply','--index','--whitespace=error'],input=patch,check=True)
              assert git('write-tree')==spec['tree'], 'Source mismatch'
              assert not any(p.startswith('.github/') for p in git('diff','--cached','--name-only').splitlines())
              subprocess.run(['git','diff','--cached','--check'],check=True)
              git('-c','user.name=Studio maintenance','-c','user.email=studio-maintenance@users.noreply.github.com','commit','-m',spec['message'])
              assert git('rev-parse','HEAD^{tree}')==spec['tree']
              git('push','origin','HEAD:refs/heads/'+spec['branch'])
              receipts.append({'branch':spec['branch'],'head':git('rev-parse','HEAD'),'tree':spec['tree'],'final_tree':spec['final_tree']})
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'publication.json'
          path.write_text(json.dumps(receipts,indent=2),encoding='utf-8')
          print(path.read_text())
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: maintenance-pass6-publication
          path: ${{ runner.temp }}/publication.json
          retention-days: 1
