name: Native procedural shading (opt-in)
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'scripts/procgen_*.py'
      - 'scripts/procgen_generators.json'
      - 'scripts/engine_validation.py'
      - 'scripts/ci_blender_*.py'
      - 'tests/test_procgen*.py'
      - 'tests/test_ci_blender_runtime.py'
      - 'research/procgen/blender-shading-runtime.json'
      - 'docs/PROCEDURAL-NATIVE-CI.md'
      - '.github/workflows/procgen-native-shading.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: procgen-native-shading-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    if: >-
      github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.body, 'Native Blender shading qualification: requested')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record exact source and verify bootstrap offline
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/procgen-native-evidence"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          git show -s --format='commit %H%ntree %T%nparents %P' > "$RUNNER_TEMP/procgen-native-evidence/source.txt"
          python -m unittest discover -s tests -p test_ci_blender_runtime.py -v
      - name: Download and checksum the explicit official runtime
        id: runtime
        timeout-minutes: 4
        run: >-
          python scripts/ci_blender_runtime.py
          --descriptor research/procgen/blender-shading-runtime.json
          --work "$RUNNER_TEMP/procgen-blender-runtime"
          --evidence "$RUNNER_TEMP/procgen-native-evidence"
      - name: Require Blender build, bundled Python, NumPy and exporter identity
        timeout-minutes: 2
        env:
          BLENDER_EXE: ${{ steps.runtime.outputs.binary }}
        run: |
          set -o pipefail
          timeout --kill-after=10s 90s "$BLENDER_EXE" --background --factory-startup --disable-autoexec --offline-mode --python-exit-code 1 --python scripts/ci_blender_identity.py -- research/procgen/blender-shading-runtime.json "$RUNNER_TEMP/procgen-native-evidence/runtime.json" 2>&1 | tee "$RUNNER_TEMP/procgen-native-evidence/runtime.log"
      - name: Require six production exports and inspect all 18 GLB normals
        timeout-minutes: 19
        env:
          PROCGEN_LIVE_BLENDER: ${{ steps.runtime.outputs.binary }}
          PROCGEN_REQUIRE_SHADING_NATIVE: '1'
          PROCGEN_SHADING_EVIDENCE: ${{ runner.temp }}/procgen-native-evidence/shading
        run: |
          set -o pipefail
          timeout --kill-after=10s 1110s python -m unittest discover -s tests -p test_procgen_shading_native.py -v 2>&1 | tee "$RUNNER_TEMP/procgen-native-evidence/qualification.log"
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads((Path(os.environ['PROCGEN_SHADING_EVIDENCE']) / 'receipt.json').read_text())
          if (receipt['state'] != 'passed' or len(receipt['cases']) != 6
                  or any(len(case['lods']) != 3 for case in receipt['cases'])):
              raise SystemExit('Requested native qualification lacks six passed cases and 18 LOD exports')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: procgen-native-shading-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/procgen-native-evidence/
          if-no-files-found: error
          retention-days: 30
