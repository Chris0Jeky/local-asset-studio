name: Observation publication barriers
on:
  pull_request:
    paths:
      - 'app/server.py'
      - 'app/observation_state.py'
      - 'app/file_replace.py'
      - 'tests/test_file_replace.py'
      - 'tests/test_observation*.py'
      - 'tests/test_operator_disposition_publication.py'
      - 'tests/test_reference_hold_observation_admission.py'
      - 'tests/test_server.py'
      - 'tests/test_worker_recovery.py'
      - 'tests/test_submission_recovery.py'
      - '.github/workflows/observation-publication.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: observation-publication-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  barriers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git log -1 --format=%H
      - run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - run: python -m unittest discover -s tests -p 'test_observation*.py' -v
      - run: python -m unittest discover -s tests -p test_file_replace.py -v
      - run: python -m unittest discover -s tests -p test_operator_disposition_publication.py -v
      - run: python -m unittest discover -s tests -p test_reference_hold_observation_admission.py -v
      - run: python -m unittest discover -s tests -p test_server.py -v
      - run: python -m unittest discover -s tests -p test_worker_recovery.py -v
      - run: python -m unittest discover -s tests -p test_submission_recovery.py -v
      - run: python scripts/validate-repo.py
