name: Rebase verified UTF-8 recovery import fix

on:
  push:
    branches:
      - audit/698-fatal-utf8-import

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact current parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c323f58a293b1fcab8c97f075216f15af6a20979"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/publish-698-fatal-utf8-import-rebase.yml"
      - name: Install focused browser dependencies
        run: |
          python -m pip install playwright==1.57.0 -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
          python -m playwright install --with-deps chromium
      - name: Apply verified disjoint correction and publish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/asset_recovery_shelf_browser.py')
          source = path.read_text(encoding='utf-8')
          old = """                await shelf(page, True)
                          async with page.expect_download() as download_info:
          """
          new = """                await shelf(page, True)
                          malformed = await page.evaluate('''async()=>{const r=(await assetShelfStore.list()).find(record=>record.slot==='detail'),p=structuredClone(r.payload);
                            p.draft.notes='Malformed UTF-8 marker \\uFFFD';
                            const sealed=await StudioAssetRecoveryShelf.seal(r.slot,p,{id:'e'.repeat(32),generation:1,created_at:1,updated_at:1},crypto);
                            return StudioAssetRecoveryShelf.encode([sealed]);}''')
                          malformed_bytes = malformed.encode('utf-8')
                          if b'\\xef\\xbf\\xbd' not in malformed_bytes:
                              raise AssertionError('Synthetic bundle did not contain the replacement-character UTF-8 bytes')
                          malformed_bytes = malformed_bytes.replace(b'\\xef\\xbf\\xbd', b'\\x80', 1)
                          invalid_import_before = await page.evaluate('localStorage.getItem(StudioAssetRecoveryShelf.KEY)')
                          invalid_import_writes = len(writes)
                          await page.set_input_files('#assetShelfImport', {
                              'name': 'malformed-utf8-recovery.json', 'mimeType': 'application/json',
                              'buffer': malformed_bytes})
                          await page.wait_for_function('!assetShelfChanging')
                          check('SHELF-UTF8-01 malformed UTF-8 is refused before replacement decoding',
                                await page.evaluate('''() => assetShelfImported===null &&
                                  document.querySelector('#assetShelfImportPreview').hidden &&
                                  document.querySelector('#assetShelfStatus').textContent.includes('valid UTF-8')''') and
                                await page.evaluate('localStorage.getItem(StudioAssetRecoveryShelf.KEY)') == invalid_import_before and
                                len(writes) == invalid_import_writes)
                          async with page.expect_download() as download_info:
          """
          if source.count(old) != 1:
              raise SystemExit('expected one exact shelf export insertion point')
          path.write_text(source.replace(old, new), encoding='utf-8')

          ui = Path('app/static/asset-recovery-shelf-ui.js')
          source = ui.read_text(encoding='utf-8')
          anchor = """function assetShelfDownload(text,name){
            const url=URL.createObjectURL(new Blob([text],{type:'application/json;charset=utf-8'})),a=document.createElement('a');
            a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
          }
          """
          replacement = anchor + """async function assetShelfImportText(file){
            const data=await file.arrayBuffer();
            try{return new TextDecoder('utf-8',{fatal:true}).decode(data);}
            catch(_){throw Error('Recovery import must be valid UTF-8 JSON.');}
          }
          """
          if source.count(anchor) != 1:
              raise SystemExit('expected one exact download helper')
          source = source.replace(anchor, replacement)
          old_import = "const records=await StudioAssetRecoveryShelf.decode(await file.text());"
          new_import = "const records=await StudioAssetRecoveryShelf.decode(await assetShelfImportText(file));"
          if source.count(old_import) != 1:
              raise SystemExit('expected one File.text recovery import')
          ui.write_text(source.replace(old_import, new_import), encoding='utf-8')

          doc = Path('docs/revision-commands/392-ASSET-RECOVERY-SHELF.md')
          text = doc.read_text(encoding='utf-8')
          old_doc = """- Strict JSON rejects duplicate keys, including escaped duplicates, non-finite
            numbers, unknown versions/fields, invalid identities and mismatched digests.
          """
          new_doc = """- Import decodes the bounded file bytes as fatal UTF-8 before JSON parsing; malformed
            byte sequences are refused rather than replacement-normalized. Strict JSON rejects duplicate
            keys, including escaped duplicates, non-finite numbers, unknown versions/fields, invalid
            identities and mismatched digests.
          """
          if text.count(old_doc) != 1:
              raise SystemExit('expected one strict JSON documentation bullet')
          doc.write_text(text.replace(old_doc, new_doc), encoding='utf-8')
          PY

          test "$(git diff --name-only | sort)" = "$(printf '%s\n' app/static/asset-recovery-shelf-ui.js docs/revision-commands/392-ASSET-RECOVERY-SHELF.md tests/asset_recovery_shelf_browser.py | sort)"
          python tests/asset_recovery_shelf_browser.py --inert --out .runtime/asset-recovery-shelf-rebased
          python -m unittest discover -s tests -p test_asset_recovery_shelf.py -v
          node --check app/static/asset-recovery-shelf-ui.js
          python -m py_compile tests/asset_recovery_shelf_browser.py
          python scripts/validate-repo.py
          git diff --check

          rm .github/workflows/publish-698-fatal-utf8-import-rebase.yml
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "199175422+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add app/static/asset-recovery-shelf-ui.js tests/asset_recovery_shelf_browser.py docs/revision-commands/392-ASSET-RECOVERY-SHELF.md .github/workflows/publish-698-fatal-utf8-import-rebase.yml
          git diff --cached --check
          git commit -m "fix: reject malformed UTF-8 recovery imports"
          git push origin HEAD:audit/698-fatal-utf8-import
