name: Apply issue 614 curated experiments guard
on:
  push:
    branches:
      - fix/614-curated-experiments-guard
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the curated-only assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate-repo.py')
          source = path.read_text(encoding='utf-8')
          anchor = "    assert not name.startswith(OPERATIONAL_PREFIXES), 'Operational output in Git: '+name\n"
          addition = anchor + "    assert not name.startswith('experiments/') or name.startswith('experiments/curated/'), 'Operational output in Git: '+name\n"
          if addition in source:
              pass
          elif anchor in source:
              path.write_text(source.replace(anchor, addition, 1), encoding='utf-8')
          else:
              raise SystemExit('Tracked-file payload loop changed')
          PY
      - name: Verify focused contracts
        run: python -m unittest discover -s tests -p test_repo_payload_guard.py -v
      - name: Validate repository
        run: |
          python scripts/validate-repo.py
          git diff --check
      - name: Commit verified implementation and retire publisher
        run: |
          git rm .github/workflows/agent-patch-614.yml
          git config user.name 'Cristian Tcaci'
          git config user.email '59696583+Chris0Jeky@users.noreply.github.com'
          git add scripts/validate-repo.py
          git commit -m 'chore: enforce curated-only experiment payloads'
          git push origin HEAD:fix/614-curated-experiments-guard
