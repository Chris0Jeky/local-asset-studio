name: Apply issue 345 handoff intent notice
on:
  push:
    branches:
      - fix/345-handoff-intent-discard-notice
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove silent discard before correction
        shell: bash
        run: |
          set +e
          node --test tests/workbench_handoff_intent_notice.cjs > /tmp/handoff-intent-red.log 2>&1
          status=$?
          set -e
          cat /tmp/handoff-intent-red.log
          test "$status" -ne 0
          grep -F "changing handoff task clears the uncommitted extra picture and explains it" /tmp/handoff-intent-red.log
          grep -F "preset selection calls the hoisted reset directly" /tmp/handoff-intent-red.log
      - name: Make extra-picture discard explicit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/static/studio-workbench.js')
          text = path.read_text(encoding='utf-8')

          old = "const dest=e.target.closest('[data-ux-destination]');if(dest&&!handoffBusy){handoffIntent=dest.dataset.uxDestination;handoffRecipes();}"
          new = "const dest=e.target.closest('[data-ux-destination]');if(dest&&!handoffBusy){const next=dest.dataset.uxDestination;if(pendingStyle&&next!==handoffIntent){pendingStyle=null;announce('The extra picture was not attached because you changed the handoff task. Choose it again if the new task needs it.');}handoffIntent=next;handoffRecipes();}"
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)

          old_guard = "pendingInputs.clear();if(typeof dismissSecondPicture==='function')dismissSecondPicture();syncCreate();"
          new_guard = "pendingInputs.clear();dismissSecondPicture();syncCreate();"
          assert text.count(old_guard) == 1, text.count(old_guard)
          text = text.replace(old_guard, new_guard)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify handoff behavior
        run: |
          node --check app/static/studio-workbench.js
          node --test tests/workbench_handoff_intent_notice.cjs tests/workbench_handoff_guards.cjs tests/workbench_board_source_recovery.cjs tests/frontend_handoffs.cjs
          python -m unittest tests.test_workbench_handoff_intent_notice tests.test_workbench_handoff_guards tests.test_workbench_board_source_recovery tests.test_studio_ux -v
          python scripts/validate-repo.py
          git diff --check
      - name: Commit verified implementation
        shell: bash
        run: |
          rm .github/workflows/agent-patch-345-handoff-intent.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/static/studio-workbench.js tests/workbench_handoff_intent_notice.cjs tests/test_workbench_handoff_intent_notice.py .github/workflows/agent-patch-345-handoff-intent.yml
          git diff --cached --check
          git commit -m "fix(workbench): announce discarded handoff pictures"
          git push origin "HEAD:${GITHUB_REF_NAME}"
