name: Recovery review publication
on:
  push:
    branches: [codex/chronological-recovery-followups]
    paths: [.github/workflows/recovery-review-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/chronological-recovery-followups
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only the reviewed three-file patch
        run: |
          mkdir -p /tmp/review-proof
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          encoded=''
          payload=base64.b64decode(encoded)
          assert hashlib.sha256(payload).hexdigest()=='926221c38776bdb2d175c0b9c22ade7b10a1f775e06269d2f604cae85d3cb9a6'
          data=json.loads(lzma.decompress(payload));manifest=data['manifest']
          assert set(manifest)=={'app/server.py','tests/test_worker_recovery.py','docs/reconciliation/2026-09-13-recovery-followups.md'}
          for name,record in manifest.items():
              assert subprocess.check_output(['git','rev-parse','HEAD:'+name],text=True).strip()==record['before'],name
          patch=pathlib.Path('/tmp/review-proof/source.patch');patch.write_text(data['patch'],encoding='utf-8')
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          for name,record in manifest.items():assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==record['after'],name
          pathlib.Path('/tmp/review-proof/manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          PY
      - run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - name: Verify final source before publishing
        run: |
          set -o pipefail
          python -m unittest discover -s tests 2>&1 | tee /tmp/review-proof/full-suite.log
          python scripts/validate-repo.py 2>&1 | tee /tmp/review-proof/validation.log
          node --check app/static/studio-shell.js
          git diff --cached --check
      - name: Publish the verified regression fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve project uncertainty after a failed job-state write'
          git push origin HEAD:codex/chronological-recovery-followups
          git rev-parse HEAD > /tmp/review-proof/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-regression-proof
          path: /tmp/review-proof/
          retention-days: 7
