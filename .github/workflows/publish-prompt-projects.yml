name: Publish verified prompt-project source (temporary)
on:
  push:
    branches: [codex/prompt-publish-service-20260915]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: transfer
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 1c0c347290ebc5b66336a5b58db17184f5d529c8
          path: source
      - name: Apply only the hash-pinned patch and publish a new branch
        working-directory: source
        shell: python
        run: |
          import base64, hashlib, lzma, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == '1c0c347290ebc5b66336a5b58db17184f5d529c8'
          encoded = ''.join((pathlib.Path('../transfer/.handoff') / f'service-{i}.b64').read_text() for i in range(4))
          decoder = lzma.LZMADecompressor()
          patch = decoder.decompress(base64.b64decode(encoded, validate=True), max_length=1048576)
          assert decoder.eof and not decoder.unused_data
          assert hashlib.sha256(patch).hexdigest() == 'ef66151223afe711e28a5db2ade3f41e4eedb1a75dc119e8d29a6ad92418e87a'
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          assert git('write-tree') == '696341f3b0d1b42e298038a12836492d24da5360'
          git('config', 'user.name', 'OpenAI')
          git('config', 'user.email', 'noreply@openai.com')
          git('commit', '-m', 'feat(prompt): persist revisioned reference briefs with durable commands')
          subprocess.run(['git', 'push', '--force-with-lease=refs/heads/codex/prompt-projects:', 'origin', 'HEAD:refs/heads/codex/prompt-projects'], check=True)
          print(git('rev-parse', 'HEAD', 'HEAD^{tree}'))
