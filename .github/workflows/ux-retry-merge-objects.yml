name: UX reconciliation objects
on:
  push:
    branches: ['codex/ux-retry-source-20260913']
    paths: ['.github/workflows/ux-retry-merge-objects.yml']
permissions:
  contents: write
jobs:
  objects:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4ff057c84abb26664d066160580677361c857eb4
          persist-credentials: false
      - name: Reconcile pinned source and verify complete tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --depth=1 origin a4bdd89343616be399886a5f26ffef38adf35381
          python - <<'PY'
          import base64, json, os, subprocess, urllib.request
          from pathlib import Path
          old='a4bdd89343616be399886a5f26ffef38adf35381'
          def previous(path):
              return subprocess.check_output(['git','show',old+':'+path]).decode('utf-8')
          same=['.github/workflows/setup-lineage-browser.yml','app/static/studio.css','docs/ux-qa/SETUP-LINEAGE-RESULTS.json','docs/ux-qa/SETUP-LINEAGE-REVIEW.json','docs/ux-qa/SETUP-LINEAGE.md','tests/frontend_handoffs.cjs','tests/setup_lineage_browser.py']
          for path in same:
              p=Path(path);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(previous(path),encoding='utf-8')
          p=Path('app/static/app.js');s=p.read_text(encoding='utf-8');source=previous(str(p))
          start=s.index("$('#save').onclick=");end=s.index("$('#savedList').onclick=",start)
          a=source.index('// A failed availability read can leave');b=source.index("$('#savedList').onclick=",a)
          p.write_text(s[:start]+source[a:b]+s[end:],encoding='utf-8')
          p=Path('app/static/index.html');s=p.read_text(encoding='utf-8');s=s.replace('<div id="savedList"></div>','<p id="setupStatus" class="status" role="status" aria-live="polite"></p><div id="savedList"></div>');p.write_text(s,encoding='utf-8')
          p=Path('docs/ux-qa/README.md');s=p.read_text(encoding='utf-8');source=previous(str(p));section=source[source.index('## Named setup lineage follow-up'):source.index('## What this pass changes')]
          # Retain the current metadata section and original blank line exactly.
          p.write_text(s[:s.index('\n')+1]+section.rstrip()+'\n\n'+s[s.index('\n')+1:],encoding='utf-8')
          paths=same+['app/static/app.js','app/static/index.html','docs/ux-qa/README.md']
          subprocess.run(['git','add','--',*paths],check=True)
          actual=subprocess.check_output(['git','write-tree']).decode().strip()
          expected='7bba9ea5b06a5ede9e415c7d26d5804d1421ea54'
          if actual!=expected:raise SystemExit('Tree mismatch: '+actual+'; no objects published')
          expected_blobs={'app/static/app.js':'e92886916179efd19e9dfdf4052456773f3774bb','app/static/index.html':'659ed98882298ed2771282e88ec8d67d693c21a5','docs/ux-qa/README.md':'dd54e38fdab470868e143dbdf9921edb36adc697'}
          results={}
          for path,sha in expected_blobs.items():
              data=json.dumps({'encoding':'base64','content':base64.b64encode(Path(path).read_bytes()).decode()}).encode()
              req=urllib.request.Request('https://api.github.com/repos/Chris0Jeky/local-asset-studio/git/blobs',data=data,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=30) as response:result=json.load(response)
              if result['sha']!=sha:raise SystemExit('Blob mismatch: '+path)
              results[path]=sha
          Path('/tmp/ux-merge-objects.json').write_text(json.dumps({'tree':actual,'blobs':results},indent=2),encoding='utf-8')
          print(json.dumps({'tree':actual,'blobs':results},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ux-reconciliation-objects
          path: /tmp/ux-merge-objects.json
          retention-days: 1
