name: Check studio
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_revision_consistency*.py' -v
      - run: python -m py_compile tests/test_revision_consistency_matrix.py tests/test_revision_consistency_retained_evidence.py
      - run: git diff --check
