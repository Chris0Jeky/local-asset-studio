name: Check studio
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - name: Full offline suite with resource lifetime diagnostics
        # Runs 35774618663 and 35774621616 reached narration tests without
        # assertion/leak failures but exhausted 600 seconds. Keep a bounded
        # 15-minute hosted budget; the wrapper's default and leak checks stay intact.
        env:
          FULL_SUITE_LIFETIME_BUDGET_SECONDS: '900'
        run: python tests/check_full_suite_lifetime.py
      - run: python scripts/validate-repo.py
