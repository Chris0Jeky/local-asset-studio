name: Check studio
on: [push, pull_request]
permissions:
  contents: read
jobs:
  repair-typed-pose-history:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/pose-editor-redo'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the implementation branch
        uses: actions/checkout@v4
        with:
          ref: codex/pose-editor-redo
          fetch-depth: 0
      - name: Confirm the regression is red before repair
        run: |
          if node tests/pose_editor_redo.cjs; then
            echo "Typed-position regression unexpectedly passed before repair" >&2
            exit 1
          fi
      - name: Apply exact guarded replacement
        run: python scripts/apply_pose_typed_history_fix.py
      - name: Verify the repaired contracts
        run: |
          node --check app/static/pose-editor-core.js
          node --check app/static/studio-workbench.js
          node tests/pose_editor_redo.cjs
          node tests/pose_editor_core.cjs
          node tests/pose_guide_handoff.cjs
          python -m py_compile tests/pose_editor_handoff_browser.py
          git diff --check
      - name: Restore the normal workflow and commit the product repair
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          test "$BRANCH_NAME" = "codex/pose-editor-redo"
          git checkout origin/main -- .github/workflows/check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && { echo "No repair produced"; exit 1; }
          git commit -m "fix: retain typed pose edits in history"
          git push origin HEAD:"$BRANCH_NAME"
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - name: Full offline suite with resource lifetime diagnostics
        run: python tests/check_full_suite_lifetime.py
      - run: python scripts/validate-repo.py
