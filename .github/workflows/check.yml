name: Check studio
on: [push, pull_request]
permissions:
  contents: write
jobs:
  checks:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/revision-request-envelope-bound
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve the client bound when hashing server envelopes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('studio_workflow/documents.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'from .core import document, decode, need':
                  'from .core import document, decode, digest, need',
              "canonical_value({'action': 'create', **value}).sha256":
                  "digest({'action': 'create', **value})",
              "canonical_value({'action': 'fork', 'id': key, **value}).sha256":
                  "digest({'action': 'fork', 'id': key, **value})",
              "canonical_value({'action': 'restore' if restore else 'command', 'id': key, **value}).sha256":
                  "digest({'action': 'restore' if restore else 'command', 'id': key, **value})",
          }
          for before, after in replacements.items():
              if text.count(before) != 1:
                  raise SystemExit(f'expected one replacement anchor, found {text.count(before)}: {before}')
              text = text.replace(before, after)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify public bounds and affected contracts
        run: |
          python -m unittest discover -s tests -p 'test_revision_consistency_request_bounds.py' -v
          python -m unittest discover -s tests -p 'test_workflow_documents.py' -v
          python -m unittest discover -s tests -p 'test_revision_consistency_values.py' -v
          python -m py_compile studio_workflow/documents.py studio_workflow/revision_consistency.py tests/test_revision_consistency_request_bounds.py
          git diff --check
      - name: Publish the verified implementation on the disposable branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add studio_workflow/documents.py
          git commit -m 'Preserve request bounds for revision action hashes'
          git push origin HEAD:test/revision-request-envelope-bound
