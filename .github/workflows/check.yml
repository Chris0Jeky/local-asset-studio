name: Check studio
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record checkout and suite-runner provenance
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git show -s --format='commit %H%ntree %T%nparents %P'
          git ls-files -s -- .github/workflows/check.yml tests/check_full_suite_lifetime.py tests/full_suite_lifetime_worker.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - name: Full offline suite with resource lifetime diagnostics
        # Runs 35774618663 and 35774621616 reached narration tests without
        # assertion/leak failures but exhausted 600 seconds. On 15 Oct 2026 the
        # 5,505-test suite ran in 791-810 s when it passed and three unrelated PRs
        # (#1401, #1414, runs 38714358534 and 38721815097) hit the 900 s budget
        # mid-suite with no failure. Keep a bounded 20-minute hosted budget;
        # the wrapper's default and leak checks stay intact.
        env:
          FULL_SUITE_LIFETIME_BUDGET_SECONDS: '1200'
        run: python tests/check_full_suite_lifetime.py
      - run: python scripts/validate-repo.py
