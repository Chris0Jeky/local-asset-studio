name: Materialize tested readiness change
on:
  push:
    branches: [codex/readiness-materialize]
    paths:
      - '.github/readiness_apply.py'
      - '.github/workflows/readiness-materialize.yml'
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'Chris0Jeky/local-asset-studio' && github.ref == 'refs/heads/codex/readiness-materialize'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only hash-checked tested files
        run: |
          test "$(git rev-parse HEAD^)" = aebe10c58c7fa3ce8f89276740096eaf98c2cc20
          python .github/readiness_apply.py
          git rm .github/readiness_apply.py .github/workflows/readiness-materialize.yml
          git add app/server.py app/static/app.js docs/OPERATIONS.md
          git diff --cached --check
      - run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - run: python -m unittest discover -s tests -p 'test_preset_model*.py' -v
      - run: python scripts/validate-repo.py
      - name: Publish clean implementation branch, never main
        run: |
          git config user.name 'Local Asset Studio tooling'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code origin refs/heads/codex/preset-model-readiness; then
            echo 'Output branch already exists; preserve it and stop.'
            exit 1
          fi
          TREE=$(git write-tree)
          COMMIT=$(printf 'fix(models): unify preset readiness and installer eligibility\n\nFixes #104. Fixes #116. Refs #9.\n' | git commit-tree "$TREE" -p aebe10c58c7fa3ce8f89276740096eaf98c2cc20)
          git push origin "$COMMIT:refs/heads/codex/preset-model-readiness"
          echo "Implementation commit: $COMMIT"
