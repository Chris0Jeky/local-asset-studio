name: Temporary performance source object
on:
  push:
    branches: [codex/performance-recovery-export]
    paths: [.github/workflows/performance-recovery-export.yml]
permissions:
  contents: write
jobs:
  object:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify patch and create only the tested Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp server-job-resources.patch "$RUNNER_TEMP/server.patch"
          echo "e9757f30f78a7ba9c0c5ca67356f7926e7ea464e2782009d076d5b1a27290ad3  $RUNNER_TEMP/server.patch" | sha256sum -c -
          git checkout --detach 368886191434433eb5205d54688ce0093a4adb7f
          git apply --index "$RUNNER_TEMP/server.patch"
          test "$(git hash-object app/server.py)" = 177adbf17267cedd148c3ecd44b1856e23b2ea4c
          python - <<'PY'
          import base64,json,os,urllib.request
          from pathlib import Path
          raw=Path('app/server.py').read_bytes()
          payload=json.dumps({'encoding':'base64','content':base64.b64encode(raw).decode()}).encode()
          request=urllib.request.Request('https://api.github.com/repos/Chris0Jeky/local-asset-studio/git/blobs',data=payload,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(request,timeout=30) as response: result=json.load(response)
          assert result['sha']=='177adbf17267cedd148c3ecd44b1856e23b2ea4c'
          Path(os.environ['RUNNER_TEMP'],'blob.json').write_text(json.dumps({'path':'app/server.py','sha':result['sha']}))
          print('Verified and stored server blob',result['sha'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: job-resource-server-object
          path: ${{ runner.temp }}/blob.json
          retention-days: 1
          if-no-files-found: error
