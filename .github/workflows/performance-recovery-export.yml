name: Temporary performance current source
on:
  push:
    branches: [codex/performance-recovery-export]
    paths: [.github/workflows/performance-recovery-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bae487066e6ced083f2852040ffcd9c236a94b19
          fetch-depth: 0
          persist-credentials: false
      - name: Export current tracked main only
        run: |
          mkdir -p "$RUNNER_TEMP/performance-current"
          git branch performance-current HEAD
          git bundle create "$RUNNER_TEMP/performance-current/source.bundle" performance-current
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/performance-current/identity.txt"
          cd "$RUNNER_TEMP/performance-current"
          sha256sum source.bundle > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: performance-current-bae4870
          path: ${{ runner.temp }}/performance-current/
          retention-days: 1
          if-no-files-found: error
