name: Apply issue 592 adaptive documentation follow-ups
on:
  push:
    branches:
      - fix/592-adaptive-doc-tooling
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the owner-decision and lane-count corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          handoff = Path('docs/adaptive-studio/assets/SESSION-HANDOFF.md')
          text = handoff.read_text(encoding='utf-8')
          anchor = "> Work from `docs/adaptive-studio/assets/` in `Chris0Jeky/local-asset-studio`. Read README, ART-DIRECTION, DELIVERY-SPEC and the selected catalogue rows. This is a future production session; the strategy pass produced no art. First reconcile the repository and existing accepted assets. Do not replace current work or generate the entire catalogue.\n>\n"
          addition = anchor + "> Before selecting those IDs, confirm the owner's open `adaptive-pilot-world` choice in `HUMAN_TODO.md`; the list below is a proposed lane, not a decision.\n>\n"
          if addition in text:
              pass
          elif anchor in text:
              handoff.write_text(text.replace(anchor, addition, 1), encoding='utf-8')
          else:
              raise SystemExit('Adaptive handoff insertion point changed')

          guide = Path('CLAUDE.md')
          text = guide.read_text(encoding='utf-8')
          old = '19 further\npath-filtered lanes'
          new = '20 further\npath-filtered lanes'
          if new in text:
              pass
          elif old in text:
              guide.write_text(text.replace(old, new, 1), encoding='utf-8')
          else:
              raise SystemExit('CI lane-count sentence changed')
          PY
      - name: Verify focused contracts
        run: |
          python docs/adaptive-studio/assets/test_brief.py -v
          python docs/adaptive-studio/assets/brief.py validate
      - name: Validate repository
        run: |
          python scripts/validate-repo.py
          git diff --check
      - name: Commit verified implementation and retire publisher
        run: |
          git rm .github/workflows/agent-patch-592.yml
          git config user.name 'Cristian Tcaci'
          git config user.email '59696583+Chris0Jeky@users.noreply.github.com'
          git add docs/adaptive-studio/assets/SESSION-HANDOFF.md CLAUDE.md
          git commit -m 'docs: correct adaptive production handoff boundaries'
          git push origin HEAD:fix/592-adaptive-doc-tooling
