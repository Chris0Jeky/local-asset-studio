name: Grok token-exposure review

on:
  push:
    branches:
      - review/grok-token-exposure

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_grok_permission_sensitive tests.test_agent_harness.GrokAdapterTests -v
