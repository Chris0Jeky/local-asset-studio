name: Temporary adult acquisition file-id fix

on:
  push:
    branches:
      - codex/adult-illustration-acquisition-handoff
    paths:
      - .github/workflows/tmp-fix-adult-acquisition-hf-id.yml

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.repository == 'Chris0Jeky/local-asset-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/adult-illustration-acquisition-handoff
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact contract alignment
        shell: python
        run: |
          from pathlib import Path

          path = Path('studio_prompt/_adult_illustration_acquisition_plan_impl.py')
          text = path.read_text(encoding='utf-8')
          old = 'elif re.fullmatch(r"hf-file-[1-9][0-9]*", file_id) is None:'
          new = 'elif re.fullmatch(r"hf-file-[0-9a-f]{20}", file_id) is None:'
          if text.count(old) != 1:
              raise SystemExit('expected acquisition file-id check not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
      - name: Verify focused contract
        run: python -m unittest tests.test_adult_illustration_acquisition_plan -v
      - name: Commit reviewed fix
        run: |
          git config user.name "Cristian Tcaci"
          git config user.email "59696583+Chris0Jeky@users.noreply.github.com"
          git add studio_prompt/_adult_illustration_acquisition_plan_impl.py
          git commit -m "fix: align acquisition plans with stable source file ids"
          git push origin HEAD:codex/adult-illustration-acquisition-handoff
