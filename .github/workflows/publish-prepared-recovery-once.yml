name: Publish reviewed prepared-draft recovery once
on:
  push:
    branches: [codex/prepared-draft-recovery-20261003]
    paths: [.github/maintenance/apply-prepared-recovery.py]
permissions: {}
jobs:
  publish:
    if: github.repository == 'Chris0Jeky/local-asset-studio' && github.ref == 'refs/heads/codex/prepared-draft-recovery-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pillow
      - name: Verify shared-adoption follow-up
        run: |
          test "$(git rev-parse HEAD^)" = 80a02f059bfbaedeb7ed6569445898e53ff3425f
          python .github/maintenance/apply-prepared-recovery.py
          git diff --check
          node tests/prepared_draft_recovery.cjs
          node tests/looks_frontend.cjs
          node tests/studio_ux.cjs
          python -m unittest discover -s tests -p test_prepared_draft_recovery.py -v
      - name: Commit only reviewed changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/static/studio-workbench.js tests/prepared_draft_recovery.cjs tests/prepared_draft_browser.py
          git commit -m 'fix: preserve prepared plans and failed Look holds during shared setup adoption'
          git push origin HEAD:refs/heads/codex/prepared-draft-recovery-20261003
