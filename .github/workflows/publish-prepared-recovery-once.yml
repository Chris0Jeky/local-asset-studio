name: Publish reviewed prepared-draft recovery once
on:
  push:
    branches: [codex/prepared-draft-recovery-20261003]
    paths: [.github/maintenance/apply-prepared-recovery.py]
permissions: {}
jobs:
  publish:
    if: github.repository == 'Chris0Jeky/local-asset-studio' && github.ref == 'refs/heads/codex/prepared-draft-recovery-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pillow
      - name: Apply exact reviewed edits and verify contracts
        run: |
          test "$(git rev-parse HEAD^)" = 5a6e8ef400ea2b7e30d54d9e11a96425f5d68881
          python .github/maintenance/apply-prepared-recovery.py
          git diff --check
          node tests/prepared_draft_recovery.cjs
          node tests/looks_frontend.cjs
          node tests/studio_ux.cjs
          python -m unittest discover -s tests -p test_prepared_draft_recovery.py -v
      - name: Commit only feature changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/static/app.js app/static/studio-core.js app/static/studio-workbench.js
          git commit -m 'fix: round-trip prepared tile and parallax plans through drafts and setups'
          git push origin HEAD:refs/heads/codex/prepared-draft-recovery-20261003
