name: Apply issue 345 workbench handoff guards

on:
  push:
    branches:
      - fix/345-restyle-handoff-guards

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reproduce the regressions before the fix
        run: |
          if node --test tests/workbench_handoff_guards.cjs; then
            echo '::error::The regression tests unexpectedly passed before the source fix.'
            exit 1
          fi
          echo 'Expected pre-fix failures reproduced.'

      - name: Patch the workbench state transitions
        run: python .github/agent-patch-345.py

      - name: Verify focused frontend behavior
        run: |
          node --check app/static/studio-workbench.js
          node --test tests/workbench_handoff_guards.cjs
          node --test tests/frontend_handoffs.cjs
          python -m unittest tests/test_studio_ux.py
          python scripts/validate-repo.py
          git diff --check

      - name: Commit verified implementation
        run: |
          git rm .github/workflows/agent-patch-345.yml .github/agent-patch-345.py
          git add app/static/studio-workbench.js tests/workbench_handoff_guards.cjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(workbench): guard deferred restyle handoffs'
          git push origin HEAD
