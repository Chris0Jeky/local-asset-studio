name: Apply Hugging Face scalar language fix

on:
  push:
    branches:
      - test/hf-scalar-language

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/hf-scalar-language
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Accept scalar language metadata and cover source snapshots in CI
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('studio_prompt/adult_illustration_source_intake.py')
          source = source_path.read_text(encoding='utf-8')
          base_line = '        raise ValueError("Hugging Face base_model metadata is invalid")\n'
          language_block = (
              base_line
              + '\n'
              + '    language = card.get("language")\n'
              + '    if isinstance(language, str):\n'
              + '        if not language.strip() or len(language) > 1_024:\n'
              + '            raise ValueError("Hugging Face language metadata is invalid")\n'
              + '        languages = [language.strip()]\n'
              + '    else:\n'
              + '        languages = _bounded_strings(\n'
              + '            language, "Hugging Face languages", maximum=128\n'
              + '        )\n'
          )
          if source.count(base_line) != 1:
              raise SystemExit(f'base-model insertion anchor drifted: {source.count(base_line)}')
          source = source.replace(base_line, language_block)
          old_language = '            "languages": _bounded_strings(card.get("language"), "Hugging Face languages", maximum=128),\n'
          new_language = '            "languages": languages,\n'
          if source.count(old_language) != 1:
              raise SystemExit(f'language metadata anchor drifted: {source.count(old_language)}')
          source_path.write_text(source.replace(old_language, new_language), encoding='utf-8')

          workflow_path = Path('.github/workflows/prompt-studio.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          script_anchor = "'scripts/studio_adult_illustration_prompt.py', 'app/static/prompt-lab.*'"
          script_replacement = "'scripts/studio_adult_illustration_prompt.py', 'scripts/studio_adult_illustration_source_snapshot.py', 'app/static/prompt-lab.*'"
          if workflow.count(script_anchor) != 2:
              raise SystemExit(f'Prompt Studio script path anchors drifted: {workflow.count(script_anchor)}')
          workflow = workflow.replace(script_anchor, script_replacement)
          test_anchor = "'tests/test_adult_illustration_prompt*.py'"
          if workflow.count(test_anchor) != 3:
              raise SystemExit(f'adult illustration test anchors drifted: {workflow.count(test_anchor)}')
          workflow = workflow.replace(test_anchor, "'tests/test_adult_illustration*.py'")
          workflow_path.write_text(workflow, encoding='utf-8')
          PY

      - name: Verify focused and stacked adult-illustration contracts
        run: |
          python -m unittest tests.test_adult_illustration_source_language -v
          python -m unittest discover -s tests -p 'test_adult_illustration*.py' -v
          python scripts/validate_adult_illustration_intelligence.py
          python -m py_compile studio_prompt/adult_illustration_source_intake.py scripts/studio_adult_illustration_source_snapshot.py tests/test_adult_illustration_source_language.py
          git diff --check

      - name: Publish the verified implementation on the disposable branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add studio_prompt/adult_illustration_source_intake.py tests/test_adult_illustration_source_language.py .github/workflows/prompt-studio.yml
          git commit -m 'Accept scalar Hugging Face language metadata'
          git push origin HEAD:test/hf-scalar-language
