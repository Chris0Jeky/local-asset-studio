name: Accelerator planner integrity
on:
  push:
    branches: [codex/accelerator-planner-integrity]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - name: Run focused regression contracts
        run: python -m unittest discover -s tests -p 'test_accelerator_planner_integrity.py' -v
