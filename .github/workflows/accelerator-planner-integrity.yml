                      message='Acceleration strength is not a style sweep; use a reviewed exact-configuration comparison to change it.'
                  elif control in SCHEDULE_CONTROLS and any(not item['inactive'] for item in held.values()):
                      code='accelerator_schedule'
                      message='Accelerator inactivity is not established for every bound input; inspect exact-configuration guidance rather than a generic family schedule.'
                  else:
                      code='shared_accelerator_input'
                      message='This control shares an input with held acceleration settings; use a reviewed exact-configuration comparison.'
                  withheld.append({'id':axis['id'],'control':control,'code':code,'accelerator_slots':slots,
                                   'accelerator_files':[held[slot]['entry']['file'] for slot in slots], 'message':message})
              return copy.deepcopy({'axes_available':available,'axes_withheld':withheld,
                                    'notice':'Known settings-library roles only, not installed-byte or compatibility attestation. '
                                             'Unknown files and embedded acceleration are not covered. Inspection does not validate existing variants.'})
          ''', '''def _family_axis_records(preset,kb):
              """Bound family axes plus explicit reasons documented choices are unavailable."""
              result=[]
              for axis in family_entry(preset,kb).get('axes') or []:
                  if not isinstance(axis,dict):continue
                  control=axis.get('control')
                  if not isinstance(control,str) or not _bound(preset,control):continue
                  documented=[]
                  for value in axis.get('values') or []:
                      if not isinstance(value,(dict,list)) and value not in documented:documented.append(value)
                  if not documented:continue
                  record={'id':axis.get('id') or control,'control':control,
                          'rationale':axis.get('rationale') or '','sources':list(axis.get('sources') or [])}
                  if control in CHOICE_CONTROLS:
                      offered=[]
                      for value in ((preset.get('choices') or {}).get(control) or []):
                          if not isinstance(value,(dict,list)) and value not in offered:offered.append(value)
                      values=[value for value in documented if value in offered]
                      if not values:
                          result.append(('withheld',{'id':record['id'],'control':control,
                              'code':'unsupported_choice_values','accelerator_slots':[],'accelerator_files':[],
                              'documented_values':documented,'offered_values':offered,
                              'message':"None of the documented values are offered by this recipe's current choices."}))
                          continue
                  else:values=documented
                  result.append(('available',dict(record,values=values)))
              return result


          def _family_axes(preset,kb):
              """Bound, currently offered family axes before the accelerator policy."""
              return [axis for disposition,axis in _family_axis_records(preset,kb) if disposition=='available']


          def inspect_axes(preset,kb,base_controls=None):
              """Explain existing holds and unsupported choices without changing inputs."""
              held=accelerator_slots(preset,kb,base_controls)
              blocked=_held_controls(preset,held)
              causes={slot:_held_controls(preset,{slot:item}) for slot,item in held.items()}
              available=[];withheld=[]
              for disposition,axis in _family_axis_records(preset,kb):
                  if disposition=='withheld':withheld.append(axis);continue
                  control=axis['control']
                  if control not in blocked:
                      available.append(axis);continue
                  slots=[slot for slot,controls in causes.items() if control in controls]
                  if control in held:
                      code='accelerator_strength'
                      message='Acceleration strength is not a style sweep; use a reviewed exact-configuration comparison to change it.'
                  elif control in SCHEDULE_CONTROLS and any(not item['inactive'] for item in held.values()):
                      code='accelerator_schedule'
                      message='Accelerator inactivity is not established for every bound input; inspect exact-configuration guidance rather than a generic family schedule.'
                  else:
                      code='shared_accelerator_input'
                      message='This control shares an input with held acceleration settings; use a reviewed exact-configuration comparison.'
                  withheld.append({'id':axis['id'],'control':control,'code':code,'accelerator_slots':slots,
                                   'accelerator_files':[held[slot]['entry']['file'] for slot in slots], 'message':message})
              return copy.deepcopy({'axes_available':available,'axes_withheld':withheld,
                                    'notice':'Known settings-library roles only, not installed-byte or compatibility attestation. '
                                             'Unknown files and embedded acceleration are not covered. Inspection does not validate existing variants.'})
          ''')

          replace('app/settings_planner.py', '''    held=accelerator_slots(preset,kb,base)
              if not active:raise ValueError('Turn on at least one LoRA slot before remixing its weights')
              blocked=_held_controls(preset,held)
              active=[slot for slot in active if slot not in blocked]
              if not active:raise ValueError('Turn on a non-accelerator LoRA slot to remix; acceleration settings stay unchanged')
              for slot,item in held.items():
          ''', '''    held=accelerator_slots(preset,kb,base)
              active_held={slot:item for slot,item in held.items() if not item['inactive']}
              if not active:raise ValueError('Turn on at least one LoRA slot before remixing its weights')
              blocked=_held_controls(preset,held)
              active=[slot for slot in active if slot not in blocked]
              if not active:raise ValueError('Turn on a non-accelerator LoRA slot to remix; acceleration settings stay unchanged')
              for slot,item in active_held.items():
          ''')
          replace('app/settings_planner.py', '''    held_note=('; selected accelerator strengths and sampling settings remain unchanged' if held else '')
              counted=active+[slot for slot,item in held.items() if not item['inactive']]
          ''', '''    held_note=('; selected accelerator strengths and sampling settings remain unchanged' if active_held else '')
              counted=active+list(active_held)
          ''')
          replace('app/settings_planner.py', '''        variants.append({'label':f"All {'non-accelerator' if held else 'active'} LoRAs at {steps[1]}",'controls':controls,'rationale':_warned(rationale+held_note,controls,counted,warn),
          ''', '''        variants.append({'label':f"All {'non-accelerator' if active_held else 'active'} LoRAs at {steps[1]}",'controls':controls,'rationale':_warned(rationale+held_note,controls,counted,warn),
          ''')

          replace('app/production.py', '''        elif mode=='grid':
              if not available:raise ValueError('The settings library documents no axis this recipe can change; selected accelerator settings need a reviewed exact-configuration comparison')
          ''', '''        elif mode=='grid':
              if not available:
                  message='The settings library documents no axis this recipe can change'
                  held=settings_planner.accelerator_slots(preset,kb,controls)
                  if any(not item['inactive'] for item in held.values()):
                      message+='; selected accelerator settings need a reviewed exact-configuration comparison'
                  raise ValueError(message)
          ''')

          replace('app/static/production.js', '''    $('#clearPlanned').onclick=()=>{++plannerRequestId;plannedVariants=null;renderPlanner();};
              $('#plannerAxes').onchange=()=>{plannerAxisIds=[...$('#plannerAxes').querySelectorAll('input:checked')].map(i=>i.value);requestPlan('grid');};
              $('#plannedVariants').onclick=e=>{const drop=e.target.closest('[data-drop-variant]');if(!drop)return;++plannerRequestId;plannedVariants.splice(Number(drop.dataset.dropVariant),1);if(!plannedVariants.length)plannedVariants=null;renderPlanner();};
          ''', '''    $('#clearPlanned').onclick=()=>{++plannerRequestId;plannedVariants=null;renderPlanner();$('#experimentStatus').textContent='Planned variants cleared locally. Nothing was reserved or submitted.';};
              $('#plannerAxes').onchange=()=>{plannerAxisIds=[...$('#plannerAxes').querySelectorAll('input:checked')].map(i=>i.value);requestPlan('grid');};
              $('#plannedVariants').onclick=e=>{const drop=e.target.closest('[data-drop-variant]');if(!drop)return;++plannerRequestId;plannedVariants.splice(Number(drop.dataset.dropVariant),1);if(!plannedVariants.length)plannedVariants=null;renderPlanner();$('#experimentStatus').textContent='Variant removed locally. Nothing was reserved or submitted.';};
          ''')
          replace('app/static/production.js', '''  $('#plannerLimits').innerHTML=(plannerWithheld.length?'<p><b>Settings held for acceleration</b></p><ul>'+plannerWithheld.map(a=>'<li><b>'+esc(a.id)+'</b>: '+esc(a.message)+' ('+esc((a.accelerator_slots||[]).join(', '))+')</li>').join('')+'</ul>':'')+(plannerNotice?'<p>'+esc(plannerNotice)+'</p>':'');
          ''', '''  $('#plannerLimits').innerHTML=(plannerWithheld.length?'<p><b>Settings unavailable for this recipe</b></p><ul>'+plannerWithheld.map(a=>{const slots=a.accelerator_slots||[];return '<li><b>'+esc(a.id)+'</b>: '+esc(a.message)+(slots.length?' ('+esc(slots.join(', '))+')':'')+'</li>';}).join('')+'</ul>':'')+(plannerNotice?'<p>'+esc(plannerNotice)+'</p>':'');
          ''')
          replace('app/static/production.js', '''    $('#experimentStatus').textContent=mode==='inspect'?plannerAxes.length+' settings available; '+plannerWithheld.length+' held. Existing variants are unchanged. Nothing was reserved or submitted.':plannedVariants.length+' documented variants planned. Nothing is reserved until you prepare the plan.';
          ''', '''    $('#experimentStatus').textContent=mode==='inspect'?plannerAxes.length+' settings available; '+plannerWithheld.length+' unavailable. Existing variants are unchanged. Nothing was reserved or submitted.':plannedVariants.length+' documented variants planned. Nothing is reserved until you prepare the plan.';
          ''')
          replace('app/static/production.js', '''    plannerAxes=[];plannerWithheld=[];plannerNotice='';renderPlanner(mode!=='inspect');$('#experimentStatus').textContent=err.message;
          ''', '''    plannerAxes=[];plannerAxisIds=[];plannerWithheld=[];plannerNotice='';renderPlanner(mode!=='inspect');$('#experimentStatus').textContent=err.message;
          ''')

          replace('tests/test_settings_inspection.py', '''        self.assertEqual([r['id'] for r in report['axes_withheld']], ['steps', 'sampler', 'accelerator'])
              self.assertEqual([r['code'] for r in report['axes_withheld']],
                               ['accelerator_schedule', 'accelerator_schedule', 'accelerator_strength'])
              self.assertTrue(all(r['accelerator_slots'] == ['lora'] for r in report['axes_withheld']))
          ''', '''        self.assertEqual([r['id'] for r in report['axes_withheld']], ['steps', 'sampler', 'empty', 'accelerator'])
              self.assertEqual([r['code'] for r in report['axes_withheld']],
                               ['accelerator_schedule', 'accelerator_schedule', 'unsupported_choice_values', 'accelerator_strength'])
              held=[r for r in report['axes_withheld'] if r['code']!='unsupported_choice_values']
              self.assertTrue(all(r['accelerator_slots'] == ['lora'] for r in held))
              unavailable=next(r for r in report['axes_withheld'] if r['id']=='empty')
              self.assertEqual((unavailable['documented_values'],unavailable['offered_values']),(['karras'],['simple','beta']))
          ''')
          replace('tests/test_settings_inspection.py', '''        self.assertEqual([r['id'] for r in report['axes_withheld']], ['accelerator'])
          ''', '''        self.assertEqual([r['id'] for r in report['axes_withheld']], ['empty', 'accelerator'])
