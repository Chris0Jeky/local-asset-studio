name: Apply accelerator planner integrity patch
on:
  push:
    branches: [codex/accelerator-planner-integrity]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - name: Apply guarded source patch
        run: python scripts/apply_accelerator_planner_patch.py
      - name: Verify focused and adjacent contracts
        run: |
          python -m unittest discover -s tests -p 'test_accelerator_planner_integrity.py' -v
          python -m unittest discover -s tests -p 'test_settings_*.py' -v
          python -m unittest discover -s tests -p 'test_production_planner_inspection.py' -v
          node tests/production_planner_inspection.cjs
          python scripts/validate-repo.py
      - name: Commit verified implementation
        run: |
          git config user.name 'Cristian Tcaci'
          git config user.email '59696583+Chris0Jeky@users.noreply.github.com'
          git add -A
          git commit -m 'fix: keep accelerator planner evidence truthful'
          git push origin HEAD:codex/accelerator-planner-integrity
