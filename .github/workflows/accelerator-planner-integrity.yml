          replace('tests/test_settings_inspection.py', '''        self.assertEqual(report['axes_withheld'], [])
              self.assertIn('unknown files', report['notice'].lower())
          ''', '''        self.assertEqual([r['id'] for r in report['axes_withheld']], ['empty'])
              self.assertIn('unknown files', report['notice'].lower())
          ''')
          replace('tests/test_settings_inspection.py', '''        self.assertNotIn('empty', ids)
          ''', '''        self.assertIn('empty', ids)
              self.assertEqual(next(r for r in self.inspect()['axes_withheld'] if r['id']=='empty')['code'],
                               'unsupported_choice_values')
          ''')

          replace('docs/EXPERIMENTS.md', '''Two buttons under **Advanced: plan several settings from the library** plan
