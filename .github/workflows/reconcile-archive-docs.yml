name: Reconciled Archive documentation objects
on:
  push:
    branches: [codex/storage-resume-source-20261029]
    paths: ['.github/workflows/reconcile-archive-docs.yml']
permissions:
  contents: write
jobs:
  objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cfca66203233fc2b670c749533455eb55626a4b9
          persist-credentials: false
      - name: Reconcile the two documentation entries and verify exact tree
        shell: bash
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess
          encoded=''
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='c33d79b6099ec4929761cb8798c07b7545305fbe5ece9b49c966fb2069a989b6'
          pathlib.Path('/tmp/reconcile.patch').write_bytes(patch)
          subprocess.run(['git','apply','--index','/tmp/reconcile.patch'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert subprocess.check_output(['git','write-tree']).decode().strip()=='d8e1bdebf5078e6ceec077855b3575a172b966ba'
          PY
          python scripts/validate-repo.py
      - name: Publish verified documentation objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,pathlib,subprocess
          def git(*args):return subprocess.check_output(['git',*args])
          def api(path,data):return json.loads(subprocess.check_output(['gh','api','--method','POST','repos/Chris0Jeky/local-asset-studio/git/'+path,'--input','-'],input=json.dumps(data).encode()))
          paths=git('diff','--cached','--name-only').decode().splitlines()
          assert paths==['CURRENT_STATE.md','docs/PRIVATE-CREATIONS.md']
          entries=[]
          for path in paths:
              sha=git('rev-parse',':'+path).decode().strip()
              assert api('blobs',{'encoding':'base64','content':base64.b64encode(git('cat-file','blob',sha)).decode()})['sha']==sha
              entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          tree=api('trees',{'base_tree':'73aa67088c7b3a68a2b9a95178330a26965261af','tree':entries})['sha']
          assert tree=='d8e1bdebf5078e6ceec077855b3575a172b966ba'
          pathlib.Path('publication.json').write_text(json.dumps({'tree':tree,'entries':entries,'branch_moved':False},indent=2)+'\n')
          print('Verified documentation tree:',tree,'No branch moved.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reconciled-archive-documentation
          path: publication.json
          if-no-files-found: error
          retention-days: 2
