name: Reconciliation snapshot
on:
  push:
    branches: [codex/oldest-issue-reconciliation]
    paths: [.github/workflows/reconciliation-snapshot.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/oldest-issue-reconciliation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify tested source and reconcile concurrent main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/recovery-evidence
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          blobs = ['af652e86eb37095b1d1c40e79545e8d345d41667','55d40a73280a908b2fbb8a71db84677c38c239ee','597d2dea1053c17a700f06ec730b56db725428ab','5ceabcf2b5d59e095888690aaee289e87551b39f']
          chunks = []
          for sha in blobs:
              request = urllib.request.Request('https://api.github.com/repos/Chris0Jeky/local-asset-studio/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  blob = json.load(response)
              data = base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              chunks.append(data)
          archive = b''.join(chunks)
          assert hashlib.sha256(archive).hexdigest() == '29af44fce786531a36dfc1f343210a06e854e618789c28e1640ddaca3f31edf5'
          package = json.loads(lzma.decompress(archive))
          subprocess.run(['git','merge-base','--is-ancestor',package['base'],'HEAD'],check=True)
          manifest = package['manifest']
          assert len(manifest) == 16
          for name, record in manifest.items():
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0] in ('app','tests','docs')
              before = record['before_blob']
              if before is None:
                  assert not pathlib.Path(name).exists(), name
              else:
                  actual = subprocess.check_output(['git','rev-parse','HEAD:' + name],text=True).strip()
                  assert actual == before, ('Concurrent branch change; preserve rather than overwrite', name, actual, before)
          patch = pathlib.Path('/tmp/recovery-evidence/source.patch')
          patch.write_text(package['patch'],encoding='utf-8')
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          changed = set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed == set(manifest), changed
          for name, record in manifest.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == record['sha256'], name
          pathlib.Path('/tmp/recovery-evidence/manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          subprocess.run(['git','commit','-m','fix: reconcile experiment time and submission evidence (#93, #94)'],check=True)
          result = subprocess.run(['git','merge','--no-edit','origin/main'])
          if result.returncode:
              conflicts = subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
              assert conflicts == ['tests/frontend_handoffs.cjs'], ('Unexpected conflict; nothing will be pushed', conflicts)
              name = conflicts[0]
              current = subprocess.check_output(['git','rev-parse','origin/main:' + name],text=True).strip()
              assert current == '24456ab7c7f3f68ef383aab0adfa9d85195f780e', 'New upstream test changes require review'
              ours = subprocess.check_output(['git','show','HEAD:' + name],text=True)
              theirs = subprocess.check_output(['git','show','origin/main:' + name],text=True)
              addition = ours[ours.index('async function explicitLocalAbandonment()'):ours.index('(async () => {')]
              assert addition.endswith('}\n\n') and theirs.count('(async () => {') == 1
              merged = theirs.replace('(async () => {',addition + '(async () => {\n  await explicitLocalAbandonment();',1)
              assert hashlib.sha256(merged.encode()).hexdigest() == 'd4b847678d4d3e4fe239a8f9fcda5d8db461047b766e15ab45512f7e74ffe127'
              pathlib.Path(name).write_text(merged,encoding='utf-8')
              subprocess.run(['git','add',name],check=True)
              subprocess.run(['git','commit','--no-edit'],check=True)
          print('Verified source and reconciled current main without dropping either frontend contract.')
          PY
      - run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - name: Full repository suite and validation
        run: |
          set -o pipefail
          python -m unittest discover -s tests 2>&1 | tee /tmp/recovery-evidence/full-suite.log
          python scripts/validate-repo.py 2>&1 | tee /tmp/recovery-evidence/validation.log
          git diff --check
      - name: Publish only after verification
        run: |
          git push origin HEAD:codex/oldest-issue-reconciliation
          git rev-parse HEAD | tee /tmp/recovery-evidence/published-commit.txt
      - name: Retain verification source and logs
        if: always()
        run: |
          mkdir -p /tmp/recovery-evidence
          git bundle create /tmp/recovery-evidence/source.bundle HEAD
          git status --short > /tmp/recovery-evidence/status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment-recovery-publication
          path: /tmp/recovery-evidence/
          retention-days: 3
