name: Windows runtime safety
on:
  pull_request:
    paths:
      - 'app/**'
      - 'studio_prompt/http_extension.py'
      - 'studio_workflow/addressable_figures.py'
      - 'tests/test_addressable_figures*.py'
      - 'tests/test_reference*.py'
      - 'tests/test_native_export*.py'
      - 'tests/test_backend*.py'
      - 'tests/test_model*.py'
      - 'tests/test_av_client*.py'
      - 'tests/test_mixed_batch_http.py'
      - 'tests/check_mixed_batch_lifetime.py'
      - 'tests/test_performance_history.py'
      - 'tests/test_resource_receipts*.py'
      - 'tests/test_resource_comparison.py'
      - 'scripts/compare-resource-observations.py'
      - 'scripts/inspect-resource-observation.py'
      - 'tests/test_resource_probe*.py'
      - 'scripts/profile-resources.py'
      - 'scripts/summarize-resources.py'
      - 'tests/requirements-runtime.txt'
      - '.github/workflows/runtime-safety.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'studio_prompt/http_extension.py'
      - 'studio_workflow/addressable_figures.py'
      - 'tests/test_addressable_figures*.py'
      - 'tests/test_reference*.py'
      - 'tests/test_native_export*.py'
      - 'tests/test_backend*.py'
      - 'tests/test_model*.py'
      - 'tests/test_av_client*.py'
      - 'tests/test_mixed_batch_http.py'
      - 'tests/check_mixed_batch_lifetime.py'
      - 'tests/test_performance_history.py'
      - 'tests/test_resource_receipts*.py'
      - 'tests/test_resource_comparison.py'
      - 'scripts/compare-resource-observations.py'
      - 'scripts/inspect-resource-observation.py'
      - 'tests/test_resource_probe*.py'
      - 'scripts/profile-resources.py'
      - 'scripts/summarize-resources.py'
      - 'tests/requirements-runtime.txt'
      - '.github/workflows/runtime-safety.yml'
permissions:
  contents: read
concurrency:
  group: runtime-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fault-contracts:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements-runtime.txt -r research/game-assets/requirements-media.txt
      - name: Mixed-batch loopback lifetime
        run: python tests/check_mixed_batch_lifetime.py
      - name: AV client fixture lifetime
        run: python -m unittest discover -s tests -p 'test_av_client*.py' -v
      - name: Addressable figure storage
        run: python -m unittest discover -s tests -p 'test_addressable_figures*.py' -v
      - run: python -m unittest discover -s tests -p test_backend_safety.py -v
      - run: python -m unittest discover -s tests -p test_backend_startup_interlock.py -v
      - run: python -m unittest discover -s tests -p test_model_install_safety.py -v
      - run: python -m unittest discover -s tests -p test_model_library.py -v
      - run: python -m unittest discover -s tests -p 'test_reference*.py' -v
      - run: python -m unittest discover -s tests -p 'test_native_export*.py' -v
      - run: python -m unittest discover -s tests -p 'test_resource_probe*.py' -v
      - run: python -m unittest discover -s tests -p test_performance_history.py -v
      - run: python -m unittest discover -s tests -p 'test_resource_receipts*.py' -v
      - run: python -m unittest discover -s tests -p test_resource_comparison.py -v
