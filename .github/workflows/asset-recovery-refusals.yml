name: Asset recovery refused retries
on:
  pull_request:
    paths:
      - 'app/static/workspace.js'
      - 'app/static/asset-recovery*.js'
      - 'app/static/index.html'
      - 'app/workspace.py'
      - 'app/server.py'
      - 'tests/asset_recovery_refusal*'
      - 'tests/test_asset_recovery_refusal.py'
      - 'tests/asset_detail_contracts.cjs'
      - 'tests/asset_detail_browser.py'
      - 'tests/studio_browser_smoke.py'
      - '.github/workflows/asset-recovery-refusals.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asset-refusals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright==1.57.0 -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p test_asset_recovery_refusal.py -v
      - run: python tests/asset_recovery_refusal_browser.py --out .runtime/asset-recovery-refusal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-recovery-refusal-${{ matrix.os }}
          path: .runtime/asset-recovery-refusal
          retention-days: 7
