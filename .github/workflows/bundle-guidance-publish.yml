name: Publish checked bundle guidance patch
on:
  push:
    branches: [codex/bundle-guidance-source]
    paths: [.github/workflows/bundle-guidance-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f251f828a29334fe7e7da4bc9f8e1f63c0ccaf10
          path: work
      - name: Validate bytes, apply only the reviewed patch, create feature branch
        working-directory: work
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          parent = 'f251f828a29334fe7e7da4bc9f8e1f63c0ccaf10'
          expected_patch = '5c21abb7cccf6acd5179d1d1b03e403a97c92a147f2e7fc4dfe443f5008fa6c1'
          expected = {
            '.github/workflows/bundle-workflow-browser.yml': '14eed7e7aeffeb615761a9351fcde00249e0da72',
            'app/static/bundle-explorer.js': '0147c0435a7abc99b455a087c1f5ca94e3e43e2b',
            'app/static/bundle-guidance-client.js': '55b1bf2e39c9cc3cff7429da53901cee08e2882f',
            'app/static/bundle-guidance.css': '3a31b55d50e64e5dbf16662c748f1e4bb12f55f1',
            'app/static/bundle-guidance.js': 'b1ac9db0ad88c52f05644801e5f63ca67a853f22',
            'docs/bundle-studio/README.md': '25cc1e84e30b954f4abef14c7705acdfb7283869',
            'docs/bundle-studio/SCOPED-GUIDANCE.md': 'd9eca31d07d7a0e92a91d5ec6230dcc6470bf115',
            'presets/settings-kb.json': 'df9868872beb91b264f0d0b46c2e4ef66002b60f',
            'studio_workflow/guidance.py': '6934dd80151309ec7df8fbb88780321e11496aaf',
            'studio_workflow/http_extension.py': '1766d88d2d6b24147000eb11faa8cd7a421226ac',
            'tests/bundle_guidance_browser.py': 'e5f08763d937adc8bf17ed8635efee8f99945547',
            'tests/bundle_guidance_client.cjs': '67ac8f4f2683ae21d18bd97990b23c83f10a8aeb',
            'tests/test_bundle_guidance.py': '9a221e03903ce314bed92b4620638268eebe6212'
          }
          def git(*args): return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == parent
          assert not git('status', '--porcelain')
          encoded = ''.join((Path('../transport/.agent-transfer') / f'guidance-{i}.txt').read_text().strip() for i in range(5))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == expected_patch, 'Transport corruption: nothing applied'
          patch_path = Path('../checked-guidance.patch'); patch_path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(patch_path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch_path)], check=True)
          assert set(git('diff', '--cached', '--name-only').splitlines()) == set(expected)
          for path, sha in expected.items():
              assert git('rev-parse', ':' + path) == sha, 'Unexpected resulting bytes: ' + path
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          print('All 13 resulting file identities match locally tested source.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Explain bundle settings with resource-scoped claims and contextual guidance'
          # An empty expected ref permits creation only and rejects a racing branch.
          git push --force-with-lease=refs/heads/codex/bundle-contextual-guidance: origin HEAD:refs/heads/codex/bundle-contextual-guidance
          git rev-parse HEAD
