name: Chronological audit source
on:
  push:
    branches: [codex/chronological-audit-2215]
    paths: [.github/workflows/chronological-audit-2215.yml]
permissions:
  contents: write
jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        slice: [schema, owner]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      SLICE: ${{ matrix.slice }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and reconcile current main without overwriting concurrent edits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/chronological-proof
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main codex/backend-schema-captures codex/mixed-batch-stage-ownership
          python - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess,urllib.request
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          blobs=['e0cdbcf2b7ba7bf958466883b5eba59e3d03d553','708662503b320559bd493fdd2491254f27e01e07','da996ea3e6b10ca84dcbe5ae835955f5c2b21560','551e7d3d6cb52c3b5f6ee8257b972e4bf22003a5','22d8ffb3f80ed7b3b7d01d6293fcbafe9b89d6cb','5543a07c9d5ba75bb632cd18891eb6b7780382e7','d56dc04f69d90c539e9e3ba937f6daa4a2accb15','174c494c0f7554b2302efd576c16af449a23e484']
          chunks=[]
          for sha in blobs:
              req=urllib.request.Request('https://api.github.com/repos/Chris0Jeky/local-asset-studio/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response:blob=json.load(response)
              raw=base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              chunks.append(raw)
          archive=b''.join(chunks)
          assert hashlib.sha256(archive).hexdigest()=='c69470cce8cb541e7b4d528f2987517c18729cf245cb495ba0ab2e26608385d0'
          package=json.loads(lzma.decompress(archive));name=os.environ['SLICE'];item=package['slices'][name]
          expected={'schema':'362594b7ac6feefb8a6410ef341dc1016183f3f8','owner':'28cfe3b54e221ce0f18b5dd8615dfc82dd6b49d3'}
          branches={'schema':'codex/backend-schema-captures','owner':'codex/mixed-batch-stage-ownership'}
          branch=branches[name];assert item['branch']==branch
          assert git('rev-parse','origin/'+branch)==expected[name], 'Branch changed; reconcile rather than overwrite'
          subprocess.run(['git','switch','-C','verified-slice','origin/'+branch],check=True)
          subprocess.run(['git','merge','--no-edit','origin/main'],check=True)
          subprocess.run(['git','merge-base','--is-ancestor',package['base'],'HEAD'],check=True)
          if name=='schema':assert git('rev-parse','HEAD:.github/workflows/graph-validation.yml')=='3abcccbdad580c74b20d411fc060b44806c30453'
          allowed={'schema':{'scripts/validate-live.py','tests/test_schema_capture.py','docs/GRAPH-SCHEMA-CAPTURES.md','docs/reconciliation/2026-09-13-schema-capture.md'},'owner':{'app/production.py','tests/test_mixed_batch.py','tests/test_mixed_batch_owner.py','docs/reconciliation/2026-09-13-stage-ownership.md'}}[name]
          assert set(item['manifest'])==allowed
          for path,record in item['manifest'].items():
              before=record['before_blob']
              if before is None:assert not pathlib.Path(path).exists(),path
              else:assert git('rev-parse','HEAD:'+path)==before, ('Concurrent source edit; preserve it',path)
          root=pathlib.Path('/tmp/chronological-proof');patch=root/'source.patch';patch.write_text(item['patch'],encoding='utf-8')
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==allowed
          for path,record in item['manifest'].items():assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()==record['sha256'],path
          (root/'manifest.json').write_text(json.dumps({'slice':name,'branch':branch,'integrated_main':git('rev-parse','origin/main'),'files':item['manifest'],'tested_tree':git('write-tree')},indent=2),encoding='utf-8')
          print('Verified exact source identities against main',git('rev-parse','origin/main'))
          PY
      - run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - name: Full suite and repository contracts
        run: |
          set -o pipefail
          python -m unittest discover -s tests 2>&1 | tee /tmp/chronological-proof/full-suite.log
          python scripts/validate-repo.py 2>&1 | tee /tmp/chronological-proof/validation.log
          git diff --cached --check
          git diff --exit-code
      - name: Publish only verified source
        run: |
          if [ "$SLICE" = schema ]; then
            branch=codex/backend-schema-captures
            git commit -m 'feat: capture and replay backend-bound graph schema evidence (#9, #97)'
          else
            branch=codex/mixed-batch-stage-ownership
            git commit -m 'fix: bind mixed-batch disposition to owning plan and stage (#228)'
          fi
          git push origin HEAD:"$branch"
          git rev-parse HEAD | tee /tmp/chronological-proof/published-commit.txt
          git rev-parse HEAD^{tree} | tee /tmp/chronological-proof/published-tree.txt
          git rev-parse origin/main > /tmp/chronological-proof/integrated-main.txt
          git diff --binary origin/main HEAD > /tmp/chronological-proof/complete.patch
          if [ "$SLICE" = schema ]; then git bundle create /tmp/chronological-proof/source.bundle HEAD; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chronological-${{ matrix.slice }}-proof
          path: /tmp/chronological-proof/
          retention-days: 7
