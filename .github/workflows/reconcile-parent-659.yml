name: Reconcile parent 659
on:
  push:
    branches:
      - codex/narration-policy-hardening-659
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/narration-policy-hardening-659
          fetch-depth: 0
      - name: Merge audited parent and verify combined contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          parent='origin/codex/narration-profile-contract'
          git fetch origin codex/narration-profile-contract:refs/remotes/origin/codex/narration-profile-contract
          if git merge-base --is-ancestor "$parent" HEAD; then
            echo 'Audited parent is already incorporated.'
            exit 0
          fi

          set +e
          git merge --no-commit --no-ff "$parent"
          merge_status=$?
          set -e

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [[ -n "$unresolved" && "$unresolved" != 'docs/spoken-briefs/VOICE-PROFILE.md' ]]; then
            echo 'Unexpected merge conflicts:'
            printf '%s\n' "$unresolved"
            exit 1
          fi
          if [[ "$merge_status" -ne 0 && -z "$unresolved" ]]; then
            echo 'Merge failed without the expected documentation conflict.'
            exit 1
          fi
          if [[ -n "$unresolved" ]]; then
            git checkout --ours docs/spoken-briefs/VOICE-PROFILE.md
          fi

          python .github/reconcile_parent_659.py
          git add docs/spoken-briefs/VOICE-PROFILE.md \
            research/voice-profiles/README.md \
            docs/superpowers/plans/2026-09-19-narration-policy-hardening.md
          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo 'Unresolved merge conflicts remain.'
            git diff --name-only --diff-filter=U
            exit 1
          fi

          python -m unittest discover -s tests -p 'test_voice_profile*.py' -v
          python -m unittest discover -s tests -p 'test_spoken_brief*.py' -v

          git commit -m 'chore(voice): reconcile parent profile audit correction'
          git push origin HEAD:codex/narration-policy-hardening-659
