name: Reconcile parent 659
on:
  push:
    branches:
      - codex/narration-policy-hardening-659
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/narration-policy-hardening-659
          fetch-depth: 0
      - name: Merge audited parent and preserve issue 659 contracts
        shell: bash
        run: |
          set -euo pipefail
          parent='origin/codex/narration-profile-contract'
          git fetch origin codex/narration-profile-contract:refs/remotes/origin/codex/narration-profile-contract
          if git merge-base --is-ancestor "$parent" HEAD; then
            echo 'Audited parent is already incorporated.'
            exit 0
          fi

          set +e
          git merge --no-commit --no-ff "$parent"
          merge_status=$?
          set -e

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [[ -n "$unresolved" && "$unresolved" != 'docs/spoken-briefs/VOICE-PROFILE.md' ]]; then
            echo 'Unexpected merge conflicts:'
            printf '%s\n' "$unresolved"
            exit 1
          fi
          if [[ "$merge_status" -ne 0 && -z "$unresolved" ]]; then
            echo 'Merge failed without a resolvable content conflict.'
            exit 1
          fi
          if [[ -n "$unresolved" ]]; then
            git checkout --ours docs/spoken-briefs/VOICE-PROFILE.md
          fi

          python - <<'PY'
          from pathlib import Path

          voice_path = Path('docs/spoken-briefs/VOICE-PROFILE.md')
          voice = voice_path.read_text(encoding='utf-8')
          old_registry = (
              'A local profile cannot silently replace a checked-in revision. Replacement requires:\n\n'
              '- the same stable profile ID;\n'
              '- a strictly higher integer revision;\n'
              '- `supersedes_profile_sha256` equal to the exact currently resolved profile hash.\n\n'
              'This compare-and-swap rule makes stale or competing local edits fail closed. '
              'New local profile IDs must not claim to supersede an unknown record.'
          )
          new_registry = (
              'A local profile can overlay a checked-in catalogue profile only when it carries:\n\n'
              '- the same stable profile ID;\n'
              '- a strictly higher integer revision than the checked-in profile;\n'
              '- `supersedes_profile_sha256` equal to the exact checked-in catalogue profile hash.\n\n'
              'This guard detects catalogue drift: a local overlay prepared for different checked-in '
              'profile bytes is refused. It is not a mutable registry compare-and-swap operation, a '
              'persisted local revision chain, or a concurrent-writer lock. Each resolution starts from '
              'the checked-in catalogue and then applies at most one local record per profile ID. '
              'Replacing the registry file is an external operator action; two competing writers are not '
              'serialized by the resolver. Issue #671 tracks a genuine local CAS update boundary if that '
              'stronger property is needed.\n\n'
              'New local profile IDs must not claim to supersede an unknown catalogue record.'
          )
          if old_registry not in voice:
              raise SystemExit('Expected stale registry paragraph was not found')
          voice = voice.replace(old_registry, new_registry)
          voice = voice.replace(
              'A local profile registry may change the profile binding under the compare-and-swap rules above.',
              'A local profile registry may overlay a checked-in profile under the catalogue-drift guard above.',
          )
          voice = voice.replace(
              '- the local revision names the exact checked-in/profile revision it supersedes.',
              '- the local overlay names the exact checked-in catalogue profile it replaces.',
          )
          voice = voice.replace(
              'canonical hashes, revision compare-and-swap, delivery binding,',
              'canonical hashes, catalogue-bound overlay validation, delivery binding,',
          )
          old_evidence = (
              '- that a custom producer adapter exists.\n\n'
              'Those require local retained evidence and human listening. Broader producer, audition, '
              'replacement, alignment, and dialogue tooling remains #28; transcript and pronunciation '
              'workflow remains #641.'
          )
          new_evidence = (
              '- that a custom producer adapter exists;\n'
              '- that local registry file writers are serialized or form a durable predecessor chain.\n\n'
              'Those require local retained evidence and human listening. Broader producer, audition, '
              'replacement, alignment, and dialogue tooling remains #28; transcript and pronunciation '
              'workflow remains #641; stronger registry mutation semantics remain #671.'
          )
          if old_evidence not in voice:
              raise SystemExit('Expected stale evidence paragraph was not found')
          voice = voice.replace(old_evidence, new_evidence)
          voice_path.write_text(voice, encoding='utf-8')

          readme_path = Path('research/voice-profiles/README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace('## Local registry', '## Local catalogue overlay')
          readme = readme.replace('Replacing a checked-in profile requires:', 'Overlaying a checked-in profile requires:')
          readme = readme.replace(
              '"supersedes_profile_sha256": "the exact currently resolved profile hash"',
              '"supersedes_profile_sha256": "the exact checked-in catalogue profile hash"',
          )
          old_readme = (
              'The replacement must contain the complete strict profile schema. A stale hash, unchanged '
              'revision, duplicate ID, unsupported field, malformed hash, filesystem path masquerading '
              'as an asset ID, or inconsistent acceptance state is rejected.\n\n'
              'The compare-and-swap link prevents one local experiment from silently overwriting evidence '
              'produced from another revision.'
          )
          new_readme = (
              'The overlay must contain the complete strict profile schema. A hash for different checked-in '
              'catalogue bytes, unchanged revision, duplicate ID, unsupported field, malformed hash, '
              'filesystem path masquerading as an asset ID, or inconsistent acceptance state is rejected.\n\n'
              'This is a catalogue-drift guard, not a mutable compare-and-swap registry. Resolution always '
              'starts from the checked-in catalogue and applies at most one local record per profile ID. '
              'The resolver does not retain local predecessor state or serialize competing file writers; '
              'issue #671 tracks that stronger mutation boundary.'
          )
          if old_readme not in readme:
              raise SystemExit('Expected stale research README paragraph was not found')
          readme = readme.replace(old_readme, new_readme)
          readme = readme.replace(
              'The normalized result is evidence for a later local profile revision.',
              'The normalized result is evidence for a later local catalogue overlay.',
          )
          readme_path.write_text(readme, encoding='utf-8')

          plan_path = Path('docs/superpowers/plans/2026-09-19-narration-policy-hardening.md')
          plan = plan_path.read_text(encoding='utf-8')
          plan = plan.replace(
              "Keep PR #653's profile catalogue, local compare-and-swap registry, profile/delivery manifest binding, and pre-side-effect execution admission unchanged.",
              "Keep PR #653's profile catalogue, catalogue-bound local overlay, profile/delivery manifest binding, and pre-side-effect execution admission unchanged.",
          )
          plan = plan.replace(
              'A local profile registry may change only the profile binding; it cannot redefine candidates, measurements, evaluation text, contrast pairing, or long-form requirements.',
              'A local profile registry may overlay only the profile binding from the checked-in catalogue; it cannot redefine candidates, measurements, evaluation text, contrast pairing, or long-form requirements, and it is not treated as durable mutable CAS state.',
          )
          plan_path.write_text(plan, encoding='utf-8')
          PY

          git add docs/spoken-briefs/VOICE-PROFILE.md \
            research/voice-profiles/README.md \
            docs/superpowers/plans/2026-09-19-narration-policy-hardening.md
          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo 'Unresolved merge conflicts remain.'
            git diff --name-only --diff-filter=U
            exit 1
          fi

          python -m unittest discover -s tests -p 'test_voice_profile*.py' -v
          python -m unittest discover -s tests -p 'test_spoken_brief*.py' -v

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(voice): reconcile parent profile audit correction'
          git push origin HEAD:codex/narration-policy-hardening-659
