name: Setup lineage workflow QA
on:
  pull_request:
    paths:
      - 'app/static/**'
      - 'app/workspace.py'
      - 'tests/setup_lineage_browser.py'
      - 'tests/frontend_handoffs.cjs'
      - 'tests/studio_browser_smoke.py'
      - 'tests/asset_detail_browser.py'
      - '.github/workflows/setup-lineage-browser.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: node tests/frontend_handoffs.cjs
      - name: Restore, save and reload against real setup storage
        run: python tests/setup_lineage_browser.py --out .runtime/setup-lineage-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: setup-lineage-workflow-proof
          path: .runtime/setup-lineage-proof/
          if-no-files-found: ignore
          retention-days: 7
