name: Publish verified reference worker tree (one shot)
on:
  push:
    branches: [codex/reference-analysis-worker]
    paths: [.github/workflows/publish-reference-worker.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/reference-analysis-worker
      - name: Apply only the tested patch and remove transfer files
        run: |
          python - <<'PY'
          import base64,lzma,pathlib,subprocess
          parts=[pathlib.Path('.github/reference-worker-patch.'+str(i)) for i in range(4)]
          raw=''.join(p.read_text().strip() for p in parts)
          patch=lzma.decompress(base64.b64decode(raw,validate=True))
          subprocess.run(['git','apply','--index','--binary','-'],input=patch,check=True)
          for p in parts:p.unlink()
          pathlib.Path('.github/workflows/publish-reference-worker.yml').unlink()
          subprocess.run(['git','add','-A'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='d53f060e5a2f10592e635a0db40b6ea825ef4993',tree
          PY
          git config user.name 'Cristian Tcaci'
          git config user.email '59696583+Chris0Jeky@users.noreply.github.com'
          git commit -m 'feat(prompt): coordinate durable local reference analysis through Studio worker'
          git push origin HEAD:refs/heads/codex/reference-analysis-worker
