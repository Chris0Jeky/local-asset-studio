name: Prepared draft recovery
on:
  pull_request:
    paths:
      - 'app/static/app.js'
      - 'app/static/studio-core.js'
      - 'app/static/studio-workbench.js'
      - 'app/tiles.py'
      - 'app/parallax.py'
      - 'tests/prepared_draft*'
      - 'tests/test_prepared_draft_recovery.py'
      - 'tests/studio_browser_smoke.py'
      - '.github/workflows/prepared-draft-recovery.yml'
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pillow playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p test_prepared_draft_recovery.py -v
      - run: python tests/prepared_draft_browser.py
