name: Maintenance pass 5 source
on:
  push:
    branches: [codex/maintenance-pass5-retry-20260914]
    paths: [.github/workflows/maintenance-pass5-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2f91421ecbe0e014cceef1074f4d79e4c57051df
          persist-credentials: false
      - name: Export tracked source and current issue index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=tar HEAD > "$RUNNER_TEMP/source.tar"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/identity.txt"
          gh api --paginate 'repos/Chris0Jeky/local-asset-studio/issues?state=open&per_page=100' --slurp > "$RUNNER_TEMP/issues.json"
      - uses: actions/upload-artifact@v4
        with:
          name: maintenance-pass5-source
          path: |
            ${{ runner.temp }}/source.tar
            ${{ runner.temp }}/identity.txt
            ${{ runner.temp }}/issues.json
          retention-days: 1
