name: Issue 562 taxonomy source authentication

on:
  push:
    branches:
      - codex/adult-illustration-taxonomy-membership-inspection

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'Chris0Jeky/local-asset-studio' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Confirm forged-source regression is red
        shell: bash
        run: |
          set +e
          python -m unittest tests.test_adult_illustration_prompt_membership_source_auth -v > "$RUNNER_TEMP/source-auth-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/source-auth-red.log"
          test "$status" -ne 0
          grep -q "inspect_prompt_membership" "$RUNNER_TEMP/source-auth-red.log"

      - name: Align the retained patch guard with reviewed documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/_issue_562_source_auth_patch.py')
          text = path.read_text(encoding='utf-8')
          old = "The saved index's content identity is validated, but inspection does not receive source bytes. It therefore records:"
          new = "The saved index's content identity, current source metadata and current reviewed overlay are validated, but inspection does not receive source bytes. It therefore records:"
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one stale evidence-identity guard')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Apply exact source reconstruction requirement
        run: python scripts/_issue_562_source_auth_patch.py

      - name: Run focused membership and compiler contracts
        run: |
          python -m py_compile \
            studio_prompt/adult_illustration_prompt_membership.py \
            scripts/studio_adult_illustration_prompt.py \
            tests/test_adult_illustration_prompt_membership.py \
            tests/test_adult_illustration_prompt_membership_source_auth.py
          python -m unittest \
            tests.test_adult_illustration_prompt_membership_source_auth \
            tests.test_adult_illustration_prompt_membership \
            tests.test_adult_illustration_taxonomy_prompt_integration \
            tests.test_adult_illustration_prompt_cli -v

      - name: Publish verified correction and remove temporary machinery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            studio_prompt/adult_illustration_prompt_membership.py \
            scripts/studio_adult_illustration_prompt.py \
            tests/test_adult_illustration_prompt_membership.py \
            tests/test_adult_illustration_prompt_membership_source_auth.py \
            docs/adult-illustration/TAXONOMY-MEMBERSHIP-INSPECTION.md
          git rm \
            .github/workflows/issue-562-source-auth-patch.yml \
            scripts/_issue_562_source_auth_patch.py
          git commit -m "fix: authenticate taxonomy membership from exact source bytes"
          git push origin HEAD:codex/adult-illustration-taxonomy-membership-inspection
