name: Collection recovery protocol
on:
  pull_request:
    paths:
      - 'app/static/collection-*.js'
      - 'app/static/index.html'
      - 'app/workspace.py'
      - 'studio_workflow/collection*.py'
      - 'tests/*collection*'
      - '.github/workflows/collection-recovery.yml'
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright==1.57.0 -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p "test_collection*.py" -v
      - name: Native origin, sessionStorage, WebCrypto, HTTP and SQLite
        run: python tests/collection_command_browser.py
