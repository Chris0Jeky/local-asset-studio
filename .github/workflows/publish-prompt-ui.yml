name: Publish verified prompt-project UI (temporary)
on:
  push:
    branches: [codex/prompt-publish-ui-20260915]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: transfer
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 828e9bde73b2b8506153292aeed7b94619cfac2c
          path: source
      - name: Publish the exact tested import-race correction
        working-directory: source
        shell: python
        run: |
          import base64, hashlib, lzma, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == '828e9bde73b2b8506153292aeed7b94619cfac2c'
          decoder = lzma.LZMADecompressor()
          patch = decoder.decompress(base64.b64decode(pathlib.Path('../transfer/.handoff/correction.b64').read_text(), validate=True), max_length=1048576)
          assert decoder.eof and not decoder.unused_data
          assert hashlib.sha256(patch).hexdigest() == 'e70a419303e11a031bf146a9dbc71447159b24c80dd88c07db7419c502c6e650'
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          assert git('write-tree') == '6ce92857909da6dc8429d82787a812ada0373123'
          git('config', 'user.name', 'OpenAI')
          git('config', 'user.email', 'noreply@openai.com')
          git('commit', '-m', 'fix(prompt): reject stale file imports after opening a saved brief')
          subprocess.run(['git', 'push', '--force-with-lease=refs/heads/codex/prompt-project-ui:828e9bde73b2b8506153292aeed7b94619cfac2c', 'origin', 'HEAD:refs/heads/codex/prompt-project-ui'], check=True)
          print(git('rev-parse', 'HEAD', 'HEAD^{tree}'))
