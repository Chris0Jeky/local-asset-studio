name: Apply setup context integrity fixes
on:
  push:
    branches: [codex/setup-context-compatibility]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - name: Repair one-shot patch helper quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_setup_context_integrity_fixes.py')
          text = path.read_text(encoding='utf-8')
          old = '    """Fingerprint every retained field trusted by downstream compatibility."""\n'
          new = '    # Fingerprint every retained field trusted by downstream compatibility.\n'
          count = text.count(old)
          print(f'helper quoting replacement: {count} exact match(es)')
          if count != 1:
              raise SystemExit(f'expected one helper quoting block, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Apply guarded integrity patch
        run: python scripts/apply_setup_context_integrity_fixes.py
      - name: Verify context, source, evaluator and substitution contracts
        run: |
          python -m unittest discover -s tests -p 'test_setup_context_compatibility*.py' -v
          python -m unittest discover -s tests -p 'test_setup_source_evidence*.py' -v
          python -m unittest discover -s tests -p 'test_setup_compatibility*.py' -v
          python -m unittest discover -s tests -p 'test_setup_substitution*.py' -v
          python scripts/validate-repo.py
      - name: Remove temporary patch helpers
        run: rm .github/workflows/setup-context-review-findings.yml scripts/apply_setup_context_integrity_fixes.py
      - name: Commit verified implementation
        run: |
          git config user.name 'Cristian Tcaci'
          git config user.email '59696583+Chris0Jeky@users.noreply.github.com'
          git add -A
          git commit -m 'fix: bind compatibility to verified live context'
          git push origin HEAD:codex/setup-context-compatibility
