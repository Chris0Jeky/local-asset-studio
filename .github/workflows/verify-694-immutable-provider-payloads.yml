                  request, response = self._completed
                  if self.cache is None:
                      evidence = unavailable_payload_evidence(
                          raw_payload_sha256,
                          len(response.body),
                          "cache-disabled",
                      )
                  elif self._pending is not None:
                      pending_request, pending_response = self._pending
                      if pending_request != request or pending_response != response:
                          raise AssertionError("Pending provider response identity changed")
                      stored_key = self.cache.store(request, response)
                      if stored_key != self._receipt["request_key"]:
                          raise ValueError("Stored cache identity changed during finalization")
                      evidence = self.cache.inspect_payload(raw_payload_sha256)
                  else:
                      evidence = self.cache.retain_payload(response.body)
                  if self.cache is not None and evidence.get("state") != "retained":
                      raise ValueError("Provider payload evidence was not retained")
                  self._payload_evidence = evidence
                  self._pending = None
                  self._completed = None

          '''
          text = text[:start] + replacement + text[end:]
          anchor = """    def abort(self) -> None:
                  self._pending = None
          """
          replacement = """    def abort(self) -> None:
                  self._pending = None
                  self._completed = None
                  self._payload_evidence = None
          """
          if text.count(anchor) != 1:
              raise SystemExit('HTTP abort anchor changed')
          http.write_text(text.replace(anchor, replacement), encoding='utf-8')

          public = Path('studio_prompt/adult_illustration_source_transport.py')
          text = public.read_text(encoding='utf-8')
          anchor = """    transport.finalize(digest)
              receipt = transport.receipt
              return {
          """
          replacement = """    transport.finalize(digest)
              receipt = transport.receipt
              payload_evidence = transport.payload_evidence
              return {
          """
          if text.count(anchor) != 1:
              raise SystemExit('public finalize anchor changed')
          text = text.replace(anchor, replacement)
          anchor = """        "raw_payload_ref": {
                      "sha256": digest,
                      "cache_key": receipt["request_key"],
                      "retained_in_cache": receipt["cache_state"]
                      in {"miss", "refreshed", "hit", "revalidated"},
                  },
          """
          replacement = """        "raw_payload_ref": {
                      "sha256": digest,
                      "cache_key": receipt["request_key"],
                      "retained_in_cache": payload_evidence["state"] == "retained",
                      "payload_evidence": payload_evidence,
                  },
          """
          if text.count(anchor) != 1:
              raise SystemExit('public payload-ref anchor changed')
          public.write_text(text.replace(anchor, replacement), encoding='utf-8')
          PY

          cat > docs/adult-illustration/SOURCE-PAYLOAD-EVIDENCE.md <<'MD'
          # Immutable provider payload evidence

          Issue: #694. Parent transport stack: #579 → #687.

          ## Two stores with different authority

          The conditional-GET request cache remains mutable. Its request-key record holds the
          latest exact 200 response, validators and route evidence needed for cache hits and 304
          revalidation. Replacing that record does not preserve history.

          Successful validated provider JSON is additionally retained under
          `payloads/<sha256>.json`. This path is content-addressed, published from a fully written
          same-filesystem temporary file through an exclusive hard link, and never replaced.
          Equal bodies deduplicate. Changed bodies for the same provider/version receive different
          paths, so an old exported result cannot resolve silently to newer bytes.

          New `raw_payload_ref` records retain the request cache key for source/request provenance
          and add `payload_evidence` with a stable schema, digest, byte count, relative content key
          and one of three states:

          - `retained`: exact validated bytes are present;
          - `unavailable`: bytes are absent or retention was disabled;
          - `corrupt`: a digest path is present but unreadable, unsafe, malformed or mismatched.

          `retained_in_cache` remains for compatibility, but is true only when immutable payload
          evidence was confirmed. It no longer infers history from the mutable request-key file.

          ## Compatibility

          Existing request-cache records remain readable. A later cache hit or 304 is a new
          observation and retains its current exact body immutably before exporting a new result.
          Old exported references that lack `payload_evidence` remain mutable-cache hints only;
          the system does not invent historical bytes for them.

          A validated network 200 retains its content-addressed body before the mutable request
          record is replaced. If immutable publication fails, finalization fails and the old
          request record remains unchanged. If later request-record publication fails after the
          content body was retained, the unreferenced content object may remain safely deduplicated;
          no successful result is returned.

          ## Bounds and non-authority

          The immutable store accepts only bounded bytes that pass the existing strict provider
          JSON decoder. Symlinks, path escape, size drift, unreadable files and digest mismatch are
          refused or surfaced as corrupt. It stores metadata only—never model files, credentials,
          packages or generated media—and every evidence record retains the existing false
          download/install/execution/generation/training flags.

          This slice does **not** define quota, pruning or evidence-lifetime policy. Explicit
          pruning and quota admission remain open in #694; until then retained objects are not
          deleted automatically and no permanent-retention guarantee is claimed.
          MD
      - name: Verify focused and programme contracts
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tests${PYTHONPATH:+:$PYTHONPATH}"
          python -m unittest tests.test_adult_illustration_payload_evidence -v | tee /tmp/provider-payload-green.log
          python -m unittest \
            tests.test_adult_illustration_source_transport \
            tests.test_adult_illustration_source_transport_cli \
            tests.test_adult_illustration_source_transport_hardening \
            tests.test_adult_illustration_source_transport_incomplete_read -v \
            | tee /tmp/provider-transport-green.log
          python -m unittest discover -s tests -p 'test_adult_illustration*.py' -v \
            | tee /tmp/adult-programme-green.log
          python -m py_compile \
            studio_prompt/_adult_illustration_source_transport_payloads.py \
            studio_prompt/_adult_illustration_source_transport_cache.py \
            studio_prompt/_adult_illustration_source_transport_http.py \
            studio_prompt/adult_illustration_source_transport.py \
            tests/test_adult_illustration_payload_evidence.py
          python scripts/validate-repo.py | tee /tmp/provider-validator.log
          git diff --check
      - name: Package exact tested files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/studio_prompt artifact/tests artifact/docs/adult-illustration artifact/evidence
          cp studio_prompt/_adult_illustration_source_transport_payloads.py artifact/studio_prompt/
          cp studio_prompt/_adult_illustration_source_transport_cache.py artifact/studio_prompt/
          cp studio_prompt/_adult_illustration_source_transport_http.py artifact/studio_prompt/
          cp studio_prompt/adult_illustration_source_transport.py artifact/studio_prompt/
          cp tests/test_adult_illustration_payload_evidence.py artifact/tests/
          cp docs/adult-illustration/SOURCE-PAYLOAD-EVIDENCE.md artifact/docs/adult-illustration/
          cp /tmp/provider-payload-red.log artifact/evidence/red.log
          cp /tmp/provider-payload-green.log artifact/evidence/focused-green.log
          cp /tmp/provider-transport-green.log artifact/evidence/transport-green.log
          cp /tmp/adult-programme-green.log artifact/evidence/programme-green.log
          cp /tmp/provider-validator.log artifact/evidence/validator.log
          git diff -- \
            studio_prompt/_adult_illustration_source_transport_payloads.py \
            studio_prompt/_adult_illustration_source_transport_cache.py \
            studio_prompt/_adult_illustration_source_transport_http.py \
            studio_prompt/adult_illustration_source_transport.py \
            tests/test_adult_illustration_payload_evidence.py \
            docs/adult-illustration/SOURCE-PAYLOAD-EVIDENCE.md \
            > artifact/evidence/change.patch
          (cd artifact && find . -type f -print0 | sort -z | xargs -0 sha256sum) > artifact/evidence/SHA256SUMS.txt
          printf '%s\n' \
            'parent=4b659470ae20a74787ed503d1e7d624e1187ef67' \
            'issue=694' \
            'scope=immutable content-addressed provider payload retention; quota/pruning excluded' \
            > artifact/evidence/MANIFEST.txt
      - uses: actions/upload-artifact@v4
        with:
          name: immutable-provider-payloads
          path: artifact
          if-no-files-found: error
          retention-days: 7
