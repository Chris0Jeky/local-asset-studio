name: Verify immutable provider payload retention

on:
  push:
    branches:
      - audit/694-immutable-provider-payloads

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact stacked parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4b659470ae20a74787ed503d1e7d624e1187ef67"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/verify-694-immutable-provider-payloads.yml"
      - name: Install focused dependencies
        run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - name: Write regression contracts
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/test_adult_illustration_payload_evidence.py <<'PY'
          from __future__ import annotations

          import copy
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          import tempfile
          import unittest
          from unittest.mock import patch

          from studio_prompt.adult_illustration_source_transport import (
              BoundedProviderTransport,
              SnapshotResponseCache,
              WireResponse,
              fetch_civitai,
              fetch_huggingface,
          )
          from tests.test_adult_illustration_source_transport import (
              ScriptedExchange,
              _body,
              _civitai_payload,
              _hf_payload,
              _json_response,
          )


          CIVITAI_URL = "https://civitai.com/api/v1/model-versions/123"
          HF_URL = "https://huggingface.co/api/models/owner/model/revision/main?blobs=true"


          def _evidence(result):
              return result["raw_payload_ref"]["payload_evidence"]


          class ImmutableProviderPayloadEvidenceTests(unittest.TestCase):
              def test_changed_refresh_preserves_both_exact_bodies_across_restart(self):
                  first_payload = _civitai_payload()
                  second_payload = copy.deepcopy(first_payload)
                  second_payload["model"]["allowCommercialUse"] = "None"
                  first_body = _body(first_payload)
                  second_body = _body(second_payload)
                  with tempfile.TemporaryDirectory() as temporary:
                      root = Path(temporary)
                      first_exchange = ScriptedExchange(_json_response(CIVITAI_URL, first_payload))
                      first = fetch_civitai(
                          123,
                          BoundedProviderTransport(
                              exchange=first_exchange,
                              cache=SnapshotResponseCache(root),
                          ),
                      )
                      second_exchange = ScriptedExchange(_json_response(CIVITAI_URL, second_payload))
                      second = fetch_civitai(
                          123,
                          BoundedProviderTransport(
                              exchange=second_exchange,
                              cache=SnapshotResponseCache(root),
                              refresh=True,
                          ),
                      )

                      first_ref, second_ref = _evidence(first), _evidence(second)
                      self.assertEqual(first_ref["state"], "retained")
                      self.assertEqual(second_ref["state"], "retained")
                      self.assertNotEqual(first_ref["sha256"], second_ref["sha256"])
                      self.assertNotEqual(first_ref["content_key"], second_ref["content_key"])
                      self.assertEqual(
                          first["raw_payload_ref"]["cache_key"],
                          second["raw_payload_ref"]["cache_key"],
                      )
                      self.assertTrue(first["raw_payload_ref"]["retained_in_cache"])
                      self.assertTrue(second["raw_payload_ref"]["retained_in_cache"])

                      reopened = SnapshotResponseCache(root)
                      self.assertEqual(reopened.load_payload(first_ref["sha256"]), first_body)
                      self.assertEqual(reopened.load_payload(second_ref["sha256"]), second_body)
                      self.assertEqual(len(list((root / "payloads").glob("*.json"))), 2)
                      self.assertEqual(len(list(root.glob("*.json"))), 1)

              def test_same_content_200_and_304_deduplicate_without_losing_receipts(self):
                  payload = _hf_payload()
                  with tempfile.TemporaryDirectory() as temporary:
                      root = Path(temporary)
                      first = fetch_huggingface(
                          "owner/model",
                          "main",
                          BoundedProviderTransport(
                              exchange=ScriptedExchange(
                                  _json_response(HF_URL, payload, headers={"etag": '"v1"'})
                              ),
                              cache=SnapshotResponseCache(root),
                          ),
                      )
                      repeated = fetch_huggingface(
                          "owner/model",
                          "main",
                          BoundedProviderTransport(
                              exchange=ScriptedExchange(
                                  _json_response(HF_URL, payload, headers={"etag": '"v2"'})
                              ),
                              cache=SnapshotResponseCache(root),
                              refresh=True,
                          ),
                      )

                      def not_modified(request, timeout):
                          self.assertEqual(request.headers["if-none-match"], '"v2"')
                          return WireResponse(
                              url=HF_URL,
                              status=304,
                              headers={"etag": '"v2"'},
                              body=b"",
                          )

                      revalidated = fetch_huggingface(
                          "owner/model",
                          "main",
                          BoundedProviderTransport(
                              exchange=ScriptedExchange(not_modified),
                              cache=SnapshotResponseCache(root),
                              refresh=True,
                          ),
                      )
                      self.assertEqual(
                          [first["transport_receipt"]["cache_state"],
                           repeated["transport_receipt"]["cache_state"],
                           revalidated["transport_receipt"]["cache_state"]],
                          ["miss", "refreshed", "revalidated"],
                      )
                      self.assertEqual(_evidence(first), _evidence(repeated))
                      self.assertEqual(_evidence(first), _evidence(revalidated))
                      self.assertEqual(len(list((root / "payloads").glob("*.json"))), 1)

              def test_new_cache_hit_upgrades_legacy_mutable_body_without_inventing_old_refs(self):
                  payload = _hf_payload()
                  with tempfile.TemporaryDirectory() as temporary:
                      root = Path(temporary)
                      first = fetch_huggingface(
                          "owner/model",
                          "main",
                          BoundedProviderTransport(
                              exchange=ScriptedExchange(_json_response(HF_URL, payload)),
                              cache=SnapshotResponseCache(root),
                          ),
                      )
                      evidence = _evidence(first)
                      (root / evidence["content_key"]).unlink()
                      self.assertEqual(
                          SnapshotResponseCache(root).inspect_payload(evidence["sha256"])["state"],
                          "unavailable",
                      )
                      no_network = ScriptedExchange(AssertionError("cache hit contacted network"))
                      current = fetch_huggingface(
                          "owner/model",
                          "main",
                          BoundedProviderTransport(
                              exchange=no_network,
                              cache=SnapshotResponseCache(root),
                          ),
                      )
                      self.assertEqual(current["transport_receipt"]["cache_state"], "hit")
                      self.assertEqual(no_network.calls, [])
                      self.assertEqual(_evidence(current)["state"], "retained")
                      self.assertEqual(
                          SnapshotResponseCache(root).load_payload(evidence["sha256"]),
                          _body(payload),
                      )

              def test_missing_and_corrupt_evidence_are_distinguishable(self):
                  payload = _civitai_payload()
                  with tempfile.TemporaryDirectory() as temporary:
                      root = Path(temporary)
                      cache = SnapshotResponseCache(root)
                      result = fetch_civitai(
                          123,
                          BoundedProviderTransport(
                              exchange=ScriptedExchange(_json_response(CIVITAI_URL, payload)),
                              cache=cache,
                          ),
                      )
                      evidence = _evidence(result)
                      path = root / evidence["content_key"]
                      path.unlink()
                      missing = cache.inspect_payload(evidence["sha256"])
                      self.assertEqual((missing["state"], missing["reason"]),
                                       ("unavailable", "missing"))
                      cache.retain_payload(_body(payload))
                      path.write_bytes(b"{}")
                      corrupt = cache.inspect_payload(evidence["sha256"])
                      self.assertEqual(corrupt["state"], "corrupt")
                      self.assertIn(corrupt["reason"], {"sha256-mismatch", "invalid-json"})
                      with self.assertRaisesRegex(ValueError, "corrupt"):
                          cache.load_payload(evidence["sha256"])

              def test_failed_evidence_publication_does_not_replace_request_cache(self):
                  first_payload = _civitai_payload()
                  changed_payload = copy.deepcopy(first_payload)
                  changed_payload["model"]["allowCommercialUse"] = "None"
                  with tempfile.TemporaryDirectory() as temporary:
                      root = Path(temporary)
                      first_cache = SnapshotResponseCache(root)
                      first_exchange = ScriptedExchange(_json_response(CIVITAI_URL, first_payload))
                      first = fetch_civitai(
                          123,
                          BoundedProviderTransport(exchange=first_exchange, cache=first_cache),
                      )
                      request = first_exchange.calls[0][0]
                      cache_path = first_cache.path_for(request)
                      before = cache_path.read_bytes()
                      failing_cache = SnapshotResponseCache(root)
                      with patch.object(
                          failing_cache.payloads,
                          "retain",
                          side_effect=OSError("injected evidence publication failure"),
                      ):
                          with self.assertRaisesRegex(OSError, "evidence publication failure"):
                              fetch_civitai(
                                  123,
                                  BoundedProviderTransport(
                                      exchange=ScriptedExchange(
                                          _json_response(CIVITAI_URL, changed_payload)
                                      ),
                                      cache=failing_cache,
                                      refresh=True,
                                  ),
                              )
                      self.assertEqual(cache_path.read_bytes(), before)
                      self.assertEqual(
                          SnapshotResponseCache(root).load_payload(_evidence(first)["sha256"]),
                          _body(first_payload),
                      )
                      self.assertEqual(len(list((root / "payloads").glob("*.json"))), 1)

              def test_concurrent_same_digest_publication_is_exclusive_and_idempotent(self):
                  payload = _body(_civitai_payload())
                  with tempfile.TemporaryDirectory() as temporary:
                      root = Path(temporary)
                      cache = SnapshotResponseCache(root)
                      with ThreadPoolExecutor(max_workers=8) as pool:
                          references = list(pool.map(lambda _: cache.retain_payload(payload), range(24)))
                      self.assertTrue(all(reference == references[0] for reference in references))
                      self.assertEqual(references[0]["state"], "retained")
                      self.assertEqual(len(list((root / "payloads").glob("*.json"))), 1)

              def test_cache_disabled_is_explicitly_unavailable_not_retained(self):
                  result = fetch_civitai(
                      123,
                      BoundedProviderTransport(
                          exchange=ScriptedExchange(
                              _json_response(CIVITAI_URL, _civitai_payload())
                          )
                      ),
                  )
                  evidence = _evidence(result)
                  self.assertEqual((evidence["state"], evidence["reason"]),
                                   ("unavailable", "cache-disabled"))
                  self.assertFalse(result["raw_payload_ref"]["retained_in_cache"])


          if __name__ == "__main__":
              unittest.main()
          PY
      - name: Prove the parent loses historical payload evidence
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tests${PYTHONPATH:+:$PYTHONPATH}"
          set +e
          python -m unittest tests.test_adult_illustration_payload_evidence -v > /tmp/provider-payload-red.log 2>&1
          status=$?
          set -e
          cat /tmp/provider-payload-red.log
          test "$status" -ne 0
          grep -q 'test_changed_refresh_preserves_both_exact_bodies_across_restart' /tmp/provider-payload-red.log
          grep -Eq 'FAILED|ERROR' /tmp/provider-payload-red.log
          ! grep -q 'Failed to import test module' /tmp/provider-payload-red.log
      - name: Implement immutable content-addressed payload evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > studio_prompt/_adult_illustration_source_transport_payloads.py <<'PY'
          """Immutable content-addressed retention for validated provider metadata bytes."""
          from __future__ import annotations

          import hashlib
          import os
          from pathlib import Path
          import tempfile
          from typing import Any

          from ._adult_illustration_source_transport_common import (
              AUTHORITY,
              MAX_PROVIDER_RESPONSE_BYTES,
              SHA256,
              parse_provider_json,
          )

          PAYLOAD_EVIDENCE_SCHEMA = (
              "studio.adult-illustration-provider-payload-evidence/v1"
          )


          def _reference(
              digest: str,
              *,
              state: str,
              byte_count: int | None,
              reason: str | None,
          ) -> dict[str, Any]:
              if not isinstance(digest, str) or SHA256.fullmatch(digest) is None:
                  raise ValueError("Provider payload evidence SHA-256 is invalid")
              if byte_count is not None and (
                  not isinstance(byte_count, int)
                  or isinstance(byte_count, bool)
                  or not 0 <= byte_count <= MAX_PROVIDER_RESPONSE_BYTES
              ):
                  raise ValueError("Provider payload evidence byte count is invalid")
              if state not in {"retained", "unavailable", "corrupt"}:
                  raise ValueError("Provider payload evidence state is invalid")
              if reason is not None and (
                  not isinstance(reason, str) or not reason or len(reason) > 96
              ):
                  raise ValueError("Provider payload evidence reason is invalid")
              return {
                  "schema": PAYLOAD_EVIDENCE_SCHEMA,
                  "sha256": digest,
                  "state": state,
                  "bytes": byte_count,
                  "content_key": (
                      f"payloads/{digest}.json" if state == "retained" else None
                  ),
                  "reason": reason,
                  **AUTHORITY,
              }


          def unavailable_payload_evidence(
              digest: str,
              byte_count: int,
              reason: str,
          ) -> dict[str, Any]:
              """Describe exact bytes that were not admitted to immutable retention."""
              return _reference(
                  digest,
                  state="unavailable",
                  byte_count=byte_count,
                  reason=reason,
              )


          class ImmutableProviderPayloadStore:
              """Retain validated raw metadata under immutable SHA-256 identity."""

              def __init__(self, root: str | Path):
                  self.root = Path(root)
                  if self.root.is_symlink():
                      raise ValueError("Provider payload evidence root cannot be a symlink")
                  self.root.mkdir(exist_ok=True)
                  self._resolved_root = self.root.resolve(strict=True)
                  if not self._resolved_root.is_dir():
                      raise ValueError("Provider payload evidence root must be a directory")

              def _path(self, digest: str) -> Path:
                  if not isinstance(digest, str) or SHA256.fullmatch(digest) is None:
                      raise ValueError("Provider payload evidence SHA-256 is invalid")
                  return self._resolved_root / f"{digest}.json"

              @staticmethod
              def _validate_body(body: bytes) -> bytes:
                  if (
                      not isinstance(body, bytes)
                      or not 1 <= len(body) <= MAX_PROVIDER_RESPONSE_BYTES
                  ):
                      raise ValueError("Provider payload evidence bytes are invalid")
                  parse_provider_json(body, MAX_PROVIDER_RESPONSE_BYTES)
                  return body

              def _inspect(
                  self,
                  digest: str,
              ) -> tuple[dict[str, Any], bytes | None]:
                  path = self._path(digest)
                  try:
                      if not path.exists():
                          return (
                              _reference(
                                  digest,
                                  state="unavailable",
                                  byte_count=None,
                                  reason="missing",
                              ),
                              None,
                          )
                      if path.is_symlink():
                          return (
                              _reference(
                                  digest,
                                  state="corrupt",
                                  byte_count=None,
                                  reason="symlink",
                              ),
                              None,
                          )
                      resolved = path.resolve(strict=True)
                      if (
                          resolved.parent != self._resolved_root
                          or not resolved.is_file()
                      ):
                          return (
                              _reference(
                                  digest,
                                  state="corrupt",
                                  byte_count=None,
                                  reason="invalid-path",
                              ),
                              None,
                          )
                      size = resolved.stat().st_size
                      if not 1 <= size <= MAX_PROVIDER_RESPONSE_BYTES:
                          return (
                              _reference(
                                  digest,
                                  state="corrupt",
                                  byte_count=(
                                      size if 0 <= size <= MAX_PROVIDER_RESPONSE_BYTES else None
                                  ),
                                  reason="invalid-size",
                              ),
                              None,
                          )
                      body = resolved.read_bytes()
                  except FileNotFoundError:
                      return (
                          _reference(
                              digest,
                              state="unavailable",
                              byte_count=None,
                              reason="missing",
                          ),
                          None,
                      )
                  except OSError:
                      return (
                          _reference(
                              digest,
                              state="corrupt",
                              byte_count=None,
                              reason="unreadable",
                          ),
                          None,
                      )
                  if len(body) != size:
                      return (
                          _reference(
                              digest,
                              state="corrupt",
                              byte_count=len(body),
                              reason="changed-during-read",
                          ),
                          None,
                      )
                  if hashlib.sha256(body).hexdigest() != digest:
                      return (
                          _reference(
                              digest,
                              state="corrupt",
                              byte_count=len(body),
                              reason="sha256-mismatch",
                          ),
                          None,
                      )
                  try:
                      parse_provider_json(body, MAX_PROVIDER_RESPONSE_BYTES)
                  except ValueError:
                      return (
                          _reference(
                              digest,
                              state="corrupt",
                              byte_count=len(body),
                              reason="invalid-json",
                          ),
                          None,
                      )
                  return (
                      _reference(
                          digest,
                          state="retained",
                          byte_count=len(body),
                          reason=None,
                      ),
                      body,
                  )

              def inspect(self, digest: str) -> dict[str, Any]:
                  """Return retained, unavailable or corrupt without inventing bytes."""
                  reference, _ = self._inspect(digest)
                  return reference

              def load(self, digest: str) -> bytes:
                  """Read exact retained bytes or distinguish missing from corrupt evidence."""
                  reference, body = self._inspect(digest)
                  if reference["state"] == "unavailable":
                      raise FileNotFoundError("Provider payload evidence is unavailable")
                  if reference["state"] != "retained" or body is None:
                      raise ValueError("Provider payload evidence is corrupt")
                  return body

              def retain(self, body: bytes) -> dict[str, Any]:
                  """Publish exact validated bytes once; never replace a digest path."""
                  body = self._validate_body(body)
                  digest = hashlib.sha256(body).hexdigest()
                  path = self._path(digest)
                  existing, existing_body = self._inspect(digest)
                  if existing["state"] == "retained":
                      if existing_body != body:
                          raise ValueError(
                              "Provider payload evidence digest resolves to different bytes"
                          )
                      return existing
                  if existing["state"] == "corrupt":
                      raise ValueError("Provider payload evidence destination is corrupt")

                  temporary: Path | None = None
                  try:
                      with tempfile.NamedTemporaryFile(
                          mode="xb",
                          prefix=f".{digest}.",
                          suffix=".tmp",
                          dir=self._resolved_root,
                          delete=False,
                      ) as handle:
                          temporary = Path(handle.name)
                          handle.write(body)
                          handle.flush()
                          os.fsync(handle.fileno())
                      try:
                          os.link(temporary, path)
                      except FileExistsError:
                          pass
                      reference, retained = self._inspect(digest)
                      if reference["state"] != "retained" or retained != body:
                          raise ValueError(
                              "Provider payload evidence publication was not exact"
                          )
                      return reference
                  finally:
                      if temporary is not None:
                          temporary.unlink(missing_ok=True)
          PY

