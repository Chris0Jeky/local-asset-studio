name: UX use cases
on:
  pull_request:
    paths:
      - 'app/static/**'
      - 'presets/catalog.json'
      - 'research/ux/use-cases.json'
      - 'tests/studio_use_cases.py'
      - 'tests/pose_editor_handoff_browser.py'
      - 'tests/test_use_case_matrix.py'
      - 'tests/studio_browser_smoke.py'
      - 'studio_workflow/guides.py'
      - '.github/workflows/ux-use-cases.yml'
      - 'scripts/ci-install-chromium.sh'
      - 'tests/test_ci_browser_dependencies.py'
permissions:
  contents: read
jobs:
  use-cases:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pillow playwright==1.57.0
      - name: Offline gate (cases and scoring; no browser)
        run: python -m unittest discover -s tests -p test_use_case_matrix.py -v
      - name: Check bounded browser dependency setup
        run: python -m unittest discover -s tests -p test_ci_browser_dependencies.py -v
      - name: Install Chromium with bounded signed Ubuntu dependencies
        timeout-minutes: 4
        run: bash scripts/ci-install-chromium.sh
      - name: Measure every use case against the local fixture (never ComfyUI)
        run: python -u tests/studio_use_cases.py
      - name: Review key meanings on the first laptop screen
        run: python -u tests/studio_use_cases.py --case library-review-next-by-keyboard --viewport 1366x768 --out .runtime/review-keys-1366x768.json --screenshots .runtime/review-keys-1366x768
      - name: Review key meanings on the first desktop screen
        run: python -u tests/studio_use_cases.py --case library-review-next-by-keyboard --viewport 1920x1080 --out .runtime/review-keys-1920x1080.json --screenshots .runtime/review-keys-1920x1080
      - name: Pose replacement and stale-response browser regressions
        run: python -u tests/pose_editor_handoff_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-use-case-evidence
          path: |
            .runtime/ux-use-cases/
            .runtime/review-keys-*
            .runtime/pose-handoff-browser/
            research/ux/use-case-matrix.json
          if-no-files-found: ignore
          retention-days: 7
