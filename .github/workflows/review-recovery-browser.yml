name: Review reload recovery QA
on:
  pull_request:
    paths:
      - 'app/static/**'
      - 'app/workspace.py'
      - 'app/server.py'
      - 'tests/review_recovery*'
      - 'tests/test_review_recovery.py'
      - 'tests/test_workspace_identity.py'
      - 'tests/asset_detail_browser.py'
      - 'tests/studio_browser_smoke.py'
      - '.github/workflows/review-recovery-browser.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright==1.57.0 -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p 'test_review_recovery.py' -v
      - run: python -m unittest discover -s tests -p 'test_workspace_identity.py' -v
      - name: Native reload, storage, tabs and metadata receipts
        run: python tests/review_recovery_browser.py --out .runtime/review-reload-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-reload-proof
          path: .runtime/review-reload-proof/
          if-no-files-found: error
          retention-days: 7
