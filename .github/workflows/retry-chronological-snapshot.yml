name: Retry chronological snapshot
on:
  push:
    branches: [codex/retry-chronological-snapshot]
    paths: [.github/workflows/retry-chronological-snapshot.yml]
permissions:
  contents: read
  pull-requests: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture the existing reviewed recovery PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pr198-source
          git bundle create /tmp/pr198-source/source.bundle HEAD refs/remotes/origin/main refs/remotes/origin/codex/chronological-recovery-followups
          python - <<'PY'
          import json,os,pathlib,urllib.request
          root=pathlib.Path('/tmp/pr198-source')
          for name,endpoint in [('pr','pulls/198'),('reviews','pulls/198/reviews?per_page=100'),('comments','pulls/198/comments?per_page=100'),('discussion','issues/198/comments?per_page=100')]:
              request=urllib.request.Request('https://api.github.com/repos/Chris0Jeky/local-asset-studio/'+endpoint,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response:data=json.load(response)
              (root/(name+'.json')).write_text(json.dumps(data,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-pr198-source
          path: /tmp/pr198-source/
          retention-days: 3
