name: Retry chronological snapshot
on:
  push:
    branches: [codex/retry-chronological-snapshot]
    paths: [.github/workflows/retry-chronological-snapshot.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore the exact tested integration without overwriting concurrent work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/retry-verification
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin codex/chronological-recovery-followups main
          python - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess,urllib.request
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          expected_head='b56972e83e81da05ecbcfc5c51f0b7a478918c21'
          branch='codex/chronological-recovery-followups'
          assert git('rev-parse','origin/'+branch)==expected_head, 'PR changed; reconcile before publishing'
          sha='4a894fec1df8761636f6bf96e50648581c0716fc'
          request=urllib.request.Request('https://api.github.com/repos/Chris0Jeky/local-asset-studio/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=30) as response:blob=json.load(response)
          data=base64.b64decode(blob['content'])
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
          assert hashlib.sha256(data).hexdigest()=='34434c4d2c90e940856ab59b61509484077e472085d0d726a9dd3477a97d83a3'
          package=json.loads(lzma.decompress(data))
          assert package['pr_head']==expected_head
          assert package['main']=='4ff057c84abb26664d066160580677361c857eb4'
          subprocess.run(['git','merge-base','--is-ancestor',package['main'],'origin/main'],check=True)
          subprocess.run(['git','switch','-C','retry-publication','origin/'+branch],check=True)
          subprocess.run(['git','merge','--no-edit',package['main']],check=True)
          assert git('rev-parse','HEAD^{tree}')==package['before_tree']=='d30bc28289aace7da10d92c65a521a047fef70e0'
          allowed={'docs/reconciliation/2026-09-13-retry-closeout.md','tests/test_production_terminal.py'}
          assert set(package['manifest'])==allowed
          root=pathlib.Path('/tmp/retry-verification')
          patch=root/'retry-addition.patch';patch.write_text(package['patch'],encoding='utf-8')
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==allowed
          for name,record in package['manifest'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==record['sha256'],name
          assert git('write-tree')==package['after_tree']=='4adb89305940c7e98cd8a17478ad801b61931fc4'
          (root/'manifest.json').write_text(json.dumps({k:v for k,v in package.items() if k!='patch'},indent=2),encoding='utf-8')
          print('Exact integration tree and both tested files verified.')
          PY
      - run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - name: Verify full suite and repository contracts
        run: |
          set -o pipefail
          python -m unittest discover -s tests 2>&1 | tee /tmp/retry-verification/full-suite.log
          python scripts/validate-repo.py 2>&1 | tee /tmp/retry-verification/validation.log
          node tests/production_terminal_frontend.cjs
          node tests/frontend_health.cjs
          git diff --cached --check
          git diff --exit-code
          test "$(git write-tree)" = '4adb89305940c7e98cd8a17478ad801b61931fc4'
      - name: Publish verified integration to the existing PR
        run: |
          git commit -m 'test: preserve terminal artifacts and concurrent reconciliation (#110)'
          git push origin HEAD:codex/chronological-recovery-followups
          git rev-parse HEAD | tee /tmp/retry-verification/published-commit.txt
          git rev-parse HEAD^{tree} | tee /tmp/retry-verification/published-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-pr198-verification
          path: /tmp/retry-verification/
          retention-days: 7
