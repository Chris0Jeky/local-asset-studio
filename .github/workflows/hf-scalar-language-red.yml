name: Hugging Face scalar language regression

on:
  push:
    branches:
      - test/hf-scalar-language

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_adult_illustration_source_language -v
