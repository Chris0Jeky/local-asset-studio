name: Verified guidance delivery
on:
  push:
    branches: [codex/workflow-guidance-source]
permissions:
  contents: write
jobs:
  delivery:
    if: contains(github.event.head_commit.message, '[deliver-guidance]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply only the verified patch onto its pinned source
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, re, subprocess, tempfile
          def git(*args): return subprocess.check_output(['git', *args]).decode().strip()
          spec = json.loads(pathlib.Path('.guidance-delivery.json').read_text())
          assert re.fullmatch(r'[0-9a-f]{40}', spec['base'])
          assert spec['target'] in ('codex/workflow-output-schema', 'codex/guided-evidence-journeys')
          raw = pathlib.Path(spec['path']).read_bytes()
          assert hashlib.sha256(raw).hexdigest() == spec['sha256'], 'Transport hash mismatch; target unchanged'
          with tempfile.NamedTemporaryFile(suffix='.patch') as patch:
              patch.write(raw); patch.flush()
              git('switch', '--detach', spec['base'])
              git('apply', '--check', '--index', patch.name)
              git('apply', '--index', patch.name)
          actual = git('diff', '--cached', '--name-only').splitlines()
          assert sorted(actual) == sorted(spec['blobs']), 'Unexpected changed paths'
          for path, expected in spec['blobs'].items():
              assert git('rev-parse', ':' + path) == expected, 'File identity mismatch: ' + path
          git('diff', '--cached', '--check')
          git('config', 'user.name', 'Cristian Tcaci')
          git('config', 'user.email', '59696583+Chris0Jeky@users.noreply.github.com')
          git('commit', '-m', spec['message'])
          # New branch only, never force-update existing work.
          assert not git('ls-remote', '--heads', 'origin', spec['target']), 'Target branch already exists'
          git('push', 'origin', 'HEAD:refs/heads/' + spec['target'])
          print('Published', spec['target'], git('rev-parse', 'HEAD'))
          PY
