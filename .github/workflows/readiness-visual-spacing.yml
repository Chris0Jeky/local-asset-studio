name: Readiness visual spacing correction
on:
  push:
    branches: [codex/readiness-materialize]
    paths: [.github/workflows/readiness-visual-spacing.yml]
permissions:
  contents: write
jobs:
  spacing:
    if: github.repository == 'Chris0Jeky/local-asset-studio' && github.ref == 'refs/heads/codex/readiness-materialize'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6273f61729d5ec7befa46d0980bf59df9319aaa8
      - name: Apply tested two-file correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          def digest(raw):
              return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          edits = [
              ('app/static/app.js', 'f3c2a568025f7539d615b23a8f03a670956f89c5', 'c92d3830461c4c2a72d807d2f40f1c43b3e5831a',
               "? '<small>'+esc(r.install_note", "? '<br><small>'+esc(r.install_note"),
              ('tests/preset_model_browser.py', '4d0da3326ed006a2fd78ed5370082b79b1cb2e0a', '095f39573994f02f9ae54a53014d9b9c4b30d201',
               "                    assert 'copy the reviewed file manually' in panel.text_content()\n",
               "                    assert 'copy the reviewed file manually' in panel.text_content()\n"
               "                    notes = panel.locator('.dependency').first.locator('.file-text small')\n"
               "                    assert notes.count() == 2\n"
               "                    bounds = notes.evaluate_all('(items)=>items.map(el=>({top:el.getBoundingClientRect().top,bottom:el.getBoundingClientRect().bottom}))')\n"
               "                    assert bounds[1]['top'] >= bounds[0]['bottom'], bounds\n"),
          ]
          for name,before,after,old,new in edits:
              path=Path(name);raw=path.read_bytes();assert digest(raw)==before,name
              text=raw.decode('utf-8');assert text.count(old)==1,name
              result=text.replace(old,new).encode('utf-8');assert digest(result)==after,name
              path.write_bytes(result)
          PY
          node tests/preset_model_readiness.cjs
          python -m py_compile tests/preset_model_browser.py
          git add app/static/app.js tests/preset_model_browser.py
          git diff --cached --check
      - name: Publish result branch for explicit connector promotion
        shell: bash
        run: |
          if git ls-remote --exit-code origin refs/heads/codex/readiness-visual-result; then
            echo 'Result already exists; preserving it.'; exit 1
          fi
          git config user.name 'Local Asset Studio tooling'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          TREE=$(git write-tree)
          COMMIT=$(printf 'fix(ui): separate dependency availability and install notes\n\nPin their visual separation in desktop and mobile browser checks.\n' | git commit-tree "$TREE" -p 6273f61729d5ec7befa46d0980bf59df9319aaa8)
          git push origin "$COMMIT:refs/heads/codex/readiness-visual-result"
          echo "Visual correction commit: $COMMIT"
