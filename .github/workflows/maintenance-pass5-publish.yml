name: Publish maintenance pass 5
on:
  push:
    branches: [codex/maintenance-pass5-transfer-20260913]
    paths: [.github/workflows/maintenance-pass5-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3d3135a17811d2e4846ada05aae35e06f60d92f4
      - name: Verify tested source before publishing new feature branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import base64, hashlib, json, os, pathlib, subprocess, zlib
          repo='Chris0Jeky/local-asset-studio'
          base='3d3135a17811d2e4846ada05aae35e06f60d92f4'
          chunks=['57df61a47b7c3fafbf31a1565b125811cc7ad69c','eda0e04a2de0a0d203dcb7cfb5c39ace2e75c8b3','057c6a23e8b235aa713beceac3b903371581d187','4c7d656011ef883624408c556ae6ca91f2710348','d9e1f34f849839c242efd6fc2ef519f287183065','151d9c29823a741979c12b1861e2a8d2338ac42f','0c99473ddcf87dfb876be16c92b9ec356b95b1ea']
          payload=b''
          def blob_sha(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for sha in chunks:
              obj=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/git/blobs/{sha}']))
              data=base64.b64decode(''.join(obj['content'].split()),validate=True)
              assert blob_sha(data)==sha
              if sha=='057c6a23e8b235aa713beceac3b903371581d187':
                  # A transport transcription changed two characters. Restore only
                  # those bytes and require the original independently computed hash.
                  assert data.count(b'gtuT9Ou3Jtb')==1
                  data=data.replace(b'gtuT9Ou3Jtb',b'gtuT9WW3Jtb')
                  assert blob_sha(data)=='a72bceb13fa6d28173e2e86c158eadd3b8c5ac0a'
              payload+=data
          assert hashlib.sha256(payload).hexdigest()=='bf7c9c138170eab205b08ee87085d8222a73586b0a318d87dc66b91983790912'
          raw=zlib.decompress(base64.b64decode(payload,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='5b950a3d1c78d51016ea64f612c770aded7f1792c64cbbd13c69347ef1fbc27c'
          specs=json.loads(raw)
          assert [s['branch'] for s in specs]==['codex/bind-live-krita-dependencies','codex/i2v-exif-orientation','codex/i2v-diagnostic-graph-diff']
          def git(*args): return subprocess.check_output(['git',*args]).decode().strip()
          receipts=[]
          for spec in specs:
              assert spec['base']==base
              assert not git('ls-remote','--heads','origin','refs/heads/'+spec['branch']), 'Existing ref; refusing overwrite'
              git('checkout','--detach',base)
              assert git('rev-parse','HEAD^{tree}')=='b34502d889ba5ffc356eb74b2ec15de8a498fd76'
              patch=spec['patch'].encode()
              assert hashlib.sha256(patch).hexdigest()==spec['patch_sha256']
              subprocess.run(['git','apply','--index','--whitespace=error'],input=patch,check=True)
              assert git('write-tree')==spec['tree'], 'Source mismatch'
              assert not any(p.startswith('.github/') for p in git('diff','--cached','--name-only').splitlines())
              subprocess.run(['git','diff','--cached','--check'],check=True)
              git('-c','user.name=Studio maintenance','-c','user.email=studio-maintenance@users.noreply.github.com','commit','-m',spec['message'])
              assert git('rev-parse','HEAD^{tree}')==spec['tree']
              git('push','origin','HEAD:refs/heads/'+spec['branch'])
              receipts.append({'branch':spec['branch'],'head':git('rev-parse','HEAD'),'tree':spec['tree'],'final_tree':spec['final_tree']})
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'publication.json'
          path.write_text(json.dumps(receipts,indent=2),encoding='utf-8')
          print(path.read_text())
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: maintenance-pass5-publication
          path: ${{ runner.temp }}/publication.json
          retention-days: 1
  integration-source:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2b5ae6364e4dc8b53d5e8eb3184a6e9a1bd924dd
          fetch-depth: 0
          persist-credentials: false
      - name: Export intervening tracked changes without runtime data
        run: |
          git diff --binary 3d3135a17811d2e4846ada05aae35e06f60d92f4 HEAD > "$RUNNER_TEMP/main-delta.patch"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/identity.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: maintenance-pass5-main-delta
          path: |
            ${{ runner.temp }}/main-delta.patch
            ${{ runner.temp }}/identity.txt
          retention-days: 1
