name: Archive qualification source
on:
  push:
    branches: [codex/archive-qualification-20261028]
    paths: ['.github/workflows/archive-source-qualification.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3392d27bf0fa8ce5305bcc2c3a88009a33d87114
          persist-credentials: false
      - name: Export tracked source and exact identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qualification-source"
          git rev-parse HEAD > "$RUNNER_TEMP/qualification-source/COMMIT.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/qualification-source/TREE.txt"
          git ls-tree -r -z HEAD > "$RUNNER_TEMP/qualification-source/manifest.git"
          git archive --format=tar HEAD > "$RUNNER_TEMP/qualification-source/source.tar"
          cd "$RUNNER_TEMP/qualification-source"
          sha256sum source.tar manifest.git > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: archive-qualified-main-source
          path: ${{ runner.temp }}/qualification-source/
          if-no-files-found: error
          retention-days: 2
