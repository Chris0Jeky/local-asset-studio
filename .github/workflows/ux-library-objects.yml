name: Verified library UX objects
on:
  push:
    branches: ['codex/ux-snapshot-2215']
    paths: ['.github/workflows/ux-library-objects.yml']
permissions:
  contents: write
jobs:
  objects:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 28cfe3b54e221ce0f18b5dd8615dfc82dd6b49d3
          persist-credentials: false
      - name: Verify patch and whole tree before creating source objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess, urllib.request
          from pathlib import Path
          api='https://api.github.com/repos/Chris0Jeky/local-asset-studio/git/blobs'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          chunks=['aae8a205daaa469cf08660940b43bfff8b86b42d','0d2a3571b498f649e8e1899a2177ae1116df4e9e']
          parts=[]
          for sha in chunks:
              with urllib.request.urlopen(urllib.request.Request(api+'/'+sha,headers=headers),timeout=30) as response:data=json.load(response)
              raw=base64.b64decode(data['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              parts.append(raw)
          patch=lzma.decompress(base64.b64decode(b''.join(parts)))
          assert len(patch)==66151
          assert hashlib.sha256(patch).hexdigest()=='a00e270861e0b3f41d62f17662e7ee5ba43e6bd760c6316dda809dfcd810d249'
          subprocess.run(['git','apply','--index','--unidiff-zero','-'],input=patch,check=True)
          tree=subprocess.check_output(['git','write-tree']).decode().strip()
          assert tree=='4031cfc36ba95ebf4378d28b7e4335019213ea32',tree
          paths=subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          assert len(paths)==10
          entries=[]
          for path in paths:
              raw=Path(path).read_bytes()
              expected=subprocess.check_output(['git','rev-parse',':'+path]).decode().strip()
              payload=json.dumps({'encoding':'base64','content':base64.b64encode(raw).decode()}).encode()
              with urllib.request.urlopen(urllib.request.Request(api,data=payload,headers=headers,method='POST'),timeout=30) as response:result=json.load(response)
              assert result['sha']==expected,path
              entries.append({'path':path,'sha':expected,'mode':'100644','type':'blob'})
          manifest={'base':'28cfe3b54e221ce0f18b5dd8615dfc82dd6b49d3','tree':tree,'files':entries}
          Path('/tmp/library-ux-objects.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          print(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: library-ux-verified-objects
          path: /tmp/library-ux-objects.json
          retention-days: 1
