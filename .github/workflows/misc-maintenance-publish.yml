          import base64,hashlib,json,os,subprocess,zlib
          raw=zlib.decompress(base64.b64decode(''.join(os.environ['PAYLOAD'].split()),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='1c1bc03ffcea4442fc09ebaf137fd9de3f5841366f50837f0e4c505b917d877a'
          spec=json.loads(raw)
          def git(*args):return subprocess.check_output(['git',*args]).decode().strip()
          assert git('rev-parse','HEAD')==spec['base']=='735de3291c9af722236b67770f3a012cf8aa49b9'
          assert spec['branch']=='codex/harden-asset-detail-browser-qa'
          assert not git('ls-remote','--heads','origin','refs/heads/'+spec['branch']), 'Ref exists; refusing overwrite'
          patch=spec['patch'].encode()
          assert hashlib.sha256(patch).hexdigest()==spec['patch_sha256']
          subprocess.run(['git','apply','--index','--whitespace=error'],input=patch,check=True)
          assert git('write-tree')==spec['tree']=='bf119fc6eadd75da5773a03bb8cc8a1d021dfd9a'
          subprocess.run(['git','diff','--cached','--check'],check=True)
          git('-c','user.name=Studio maintenance','-c','user.email=studio-maintenance@users.noreply.github.com','commit','-m','test(qa): make browser evidence causal and portable')
          git('push','origin','HEAD:refs/heads/'+spec['branch'])
          print('PUBLISHED',git('rev-parse','HEAD'),'TREE',spec['tree'])
          PYCODE
