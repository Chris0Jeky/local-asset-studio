name: Publish verified maintenance patch
on:
  push:
    branches: [codex/misc-maintenance-transfer-20260913]
    paths: [.github/workflows/misc-maintenance-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 06bd93aed2f019cb978eb5795e9f116cfb7ff749
      - name: Apply the reviewed patch and verify exact source tree
        env:
          PAYLOAD: 
          PAYLOAD_SHA256: 0b6bd751fcee96c29a09fdbafa656dc7ecc34e837744a94a8f2bac0dba28d3dd
        run: |
          python - <<'PYCODE'
          import base64, hashlib, json, os, subprocess, zlib
          raw=zlib.decompress(base64.b64decode(os.environ['PAYLOAD'],validate=True))
          assert hashlib.sha256(raw).hexdigest()==os.environ['PAYLOAD_SHA256']
          spec=json.loads(raw)
          def git(*args,**kwargs):
              return subprocess.check_output(['git',*args],**kwargs).decode().strip()
          assert git('rev-parse','HEAD')==spec['base']
          assert spec['branch']=='codex/complete-bundle-resource-guidance'
          assert not git('ls-remote','--heads','origin','refs/heads/'+spec['branch']), 'Ref exists; refusing overwrite'
          patch=spec['patch'].encode()
          assert hashlib.sha256(patch).hexdigest()==spec['patch_sha256']
          subprocess.run(['git','apply','--index','--whitespace=error'],input=patch,check=True)
          assert git('write-tree')==spec['tree'], 'Source tree mismatch'
          subprocess.run(['git','diff','--cached','--check'],check=True)
          git('-c','user.name=Studio maintenance','-c','user.email=studio-maintenance@users.noreply.github.com',
              'commit','-m','fix(guidance): include exact loader roles and declared model resources')
          assert git('rev-parse','HEAD^{tree}')==spec['tree']
          git('push','origin','HEAD:refs/heads/'+spec['branch'])
          print('PUBLISHED',spec['branch'],git('rev-parse','HEAD'),'TREE',spec['tree'])
          PYCODE
