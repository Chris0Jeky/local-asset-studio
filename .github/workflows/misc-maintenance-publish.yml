name: Publish verified maintenance patch
on:
  push:
    branches: [codex/misc-maintenance-transfer-20260913]
    paths: [.github/workflows/misc-maintenance-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f29af179c8e16d57586ef86ab8b69055493c9c79
          fetch-depth: 0
      - name: Recover the original checksum-verified transfer and publish exact tested tree
        run: |
          python - <<'PYCODE'
          import base64, hashlib, json, pathlib, re, subprocess, zlib
          text=pathlib.Path('.github/workflows/misc-maintenance-publish.yml').read_text(encoding='utf-8')
          payload=re.search(r'PAYLOAD: (\S+)',text).group(1)
          for old,new in [('pwteLeho35m','pwteLeh35m'),('JriRrbaF1/hAw','JriRrbaF/hAw'),('NHnjQXHcuWS','NHnjQXHclWS')]:
              assert payload.count(old)==1
              payload=payload.replace(old,new)
          assert hashlib.sha256(payload.encode()).hexdigest()=='c87992ed791b7c7c42774e33dee38fb3e9d1e1fb8d87aad277fc1c428b59ba53', 'Transport still differs'
          raw=zlib.decompress(base64.b64decode(payload,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='0b6bd751fcee96c29a09fdbafa656dc7ecc34e837744a94a8f2bac0dba28d3dd'
          spec=json.loads(raw)
          def git(*args,**kwargs):
              return subprocess.check_output(['git',*args],**kwargs).decode().strip()
          assert spec['base']=='06bd93aed2f019cb978eb5795e9f116cfb7ff749'
          assert spec['branch']=='codex/complete-bundle-resource-guidance'
          assert not git('ls-remote','--heads','origin','refs/heads/'+spec['branch']), 'Ref exists; refusing overwrite'
          git('checkout','--detach',spec['base'])
          patch=spec['patch'].encode()
          assert hashlib.sha256(patch).hexdigest()==spec['patch_sha256']
          subprocess.run(['git','apply','--index','--whitespace=error'],input=patch,check=True)
          assert git('write-tree')==spec['tree'], 'Source tree mismatch'
          subprocess.run(['git','diff','--cached','--check'],check=True)
          git('-c','user.name=Studio maintenance','-c','user.email=studio-maintenance@users.noreply.github.com','commit','-m','fix(guidance): include exact loader roles and declared model resources')
          assert git('rev-parse','HEAD^{tree}')==spec['tree']
          git('push','origin','HEAD:refs/heads/'+spec['branch'])
          print('PUBLISHED',spec['branch'],git('rev-parse','HEAD'),'TREE',spec['tree'])
          PYCODE
  pinned-source:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 735de3291c9af722236b67770f3a012cf8aa49b9
      - name: Package pinned tracked files for fixture reconciliation
        run: |
          test "$(git rev-parse HEAD^{tree})" = fa57225d1848af882ff3df739d3d407575e054ef
          git archive --format=tar HEAD > "$RUNNER_TEMP/metadata-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: maintenance-pinned-metadata-source
          path: ${{ runner.temp }}/metadata-source.tar
          retention-days: 1
