name: Publish observation persistence fix

on:
  push:
    branches:
      - audit/703-observation-publication

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify bounded publication branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "716e549182e1488192bf50add8f4c4a59ee52464"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/publish-703-observation-publication.yml"
      - name: Install focused test dependencies
        run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - name: Reproduce, correct, verify, and publish
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/test_observation_resume_persistence.py <<'PY'
          """Ordinary observation publishes durable state before queue ownership (#703)."""
          import copy
          import json
          import threading
          import unittest
          from unittest.mock import patch

          import test_server as fixtures
          from test_reference_hold_observation_admission import HeldReferenceJobs


          FakeStudio = fixtures.FakeStudio


          class ObservationResumePersistenceTests(unittest.TestCase):
              setUp = fixtures.ServerTests.setUp
              tearDown = fixtures.ServerTests.tearDown

              def fixture(self, status='uncertain', submission_status='observing', batch=1):
                  studio = FakeStudio(self.root, [])
                  job = studio.jobs[studio.create_job(
                      {'preset_id': 'demo', 'controls': {}, 'batch_count': batch},
                      enqueue=False,
                  )['id']]
                  job.update(
                      status=status,
                      message='Retained original outcome',
                      prompt_ids=['retained'],
                      submissions=[{
                          'index': 0,
                          'prompt_id': 'retained',
                          'seed': 1,
                          'graph': job['graph'],
                          'status': submission_status,
                      }],
                  )
                  studio._save(job)
                  studio.reference_jobs = HeldReferenceJobs()
                  return studio, job

              @staticmethod
              def state_path(studio, job):
                  return studio.runs / job['id'] / 'state.json'

              def test_failure_before_state_replace_keeps_live_and_durable_state_retryable(self):
                  studio, job = self.fixture()
                  state_path = self.state_path(studio, job)
                  before_job = copy.deepcopy(job)
                  before_state = state_path.read_bytes()
                  original = studio._write_json_atomic

                  def fail_before_state(path, value):
                      if path.name == 'state.json':
                          raise OSError('injected before state replace')
                      return original(path, value)

                  with patch.object(studio, '_write_json_atomic', side_effect=fail_before_state):
                      with self.assertRaisesRegex(OSError, 'before state replace'):
                          studio.resume_job(job['id'])

                  self.assertEqual(job, before_job)
                  self.assertEqual(state_path.read_bytes(), before_state)
                  self.assertTrue(studio.queue.empty())
                  self.assertEqual(studio.requests, [])

                  result = studio.resume_job(job['id'])
                  self.assertEqual(result['status'], 'queued')
                  self.assertEqual(studio.queue.get_nowait(), ('observe', job['id']))
                  self.assertEqual(job['prompt_ids'], ['retained'])
                  self.assertEqual(studio.requests, [])

              def test_exception_after_state_replace_is_reconciled_and_queued_once(self):
                  studio, job = self.fixture()
                  state_path = self.state_path(studio, job)
                  recipe_path = state_path.with_name('recipe.json')
                  workflow_path = state_path.with_name('workflow.json')
                  recipe_before = recipe_path.read_bytes()
                  workflow_before = workflow_path.read_bytes()
                  graph = job['graph']
                  original = studio._write_json_atomic
                  injected = []

                  def fail_after_state(path, value):
                      result = original(path, value)
                      if path.name == 'state.json' and not injected:
                          injected.append(True)
                          raise OSError('injected after state replace')
                      return result

                  with patch.object(studio, '_write_json_atomic', side_effect=fail_after_state):
                      result = studio.resume_job(job['id'])

                  self.assertEqual(result['status'], 'queued')
                  self.assertEqual(job['status'], 'queued')
                  self.assertIs(job['graph'], graph)
                  self.assertEqual(job['prompt_ids'], ['retained'])
                  self.assertEqual(studio.queue.get_nowait(), ('observe', job['id']))
                  self.assertTrue(studio.queue.empty())
                  self.assertEqual(json.loads(state_path.read_text())['status'], 'queued')
                  self.assertEqual(recipe_path.read_bytes(), recipe_before)
                  self.assertEqual(workflow_path.read_bytes(), workflow_before)
                  self.assertEqual(studio.requests, [])

              def test_terminal_reconciliation_remains_retryable_after_prepublication_failure(self):
                  studio, job = self.fixture('partial', 'completed', batch=3)
                  state_path = self.state_path(studio, job)
                  before_job = copy.deepcopy(job)
                  before_state = state_path.read_bytes()
                  original = studio._write_json_atomic

                  def fail_before_state(path, value):
                      if path.name == 'state.json':
                          raise OSError('terminal state not published')
                      return original(path, value)

                  with patch.object(studio, '_write_json_atomic', side_effect=fail_before_state):
                      with self.assertRaisesRegex(OSError, 'terminal state not published'):
                          studio.resume_job(job['id'])

                  self.assertEqual(job, before_job)
                  self.assertEqual(state_path.read_bytes(), before_state)
                  self.assertTrue(studio.queue.empty())

                  studio.resume_job(job['id'])
                  self.assertEqual(studio.queue.get_nowait(), ('observe', job['id']))
                  studio._resume(job)
                  self.assertEqual(job['status'], 'partial')
                  self.assertEqual(job['message'], 'Retained original outcome')
                  self.assertEqual(studio.requests, [])

              def test_two_callers_after_commit_side_failure_still_queue_at_most_once(self):
                  studio, job = self.fixture()
                  original = studio._write_json_atomic
                  injected = []
                  injection_lock = threading.Lock()
                  outcomes = []
                  barrier = threading.Barrier(2)

                  def fail_once_after_state(path, value):
                      result = original(path, value)
                      if path.name == 'state.json':
                          with injection_lock:
                              if not injected:
                                  injected.append(True)
                                  raise OSError('injected after committed state')
                      return result

                  def resume():
                      barrier.wait(timeout=5)
                      try:
                          outcomes.append(studio.resume_job(job['id'])['status'])
                      except Exception as exc:  # bounded clients record the refusal for assertion
                          outcomes.append(type(exc).__name__ + ': ' + str(exc))

                  self.start.stop()
                  try:
                      with patch.object(studio, '_write_json_atomic', side_effect=fail_once_after_state):
                          clients = [threading.Thread(target=resume) for _ in range(2)]
                          for client in clients:
                              client.start()
                          for client in clients:
                              client.join(timeout=5)
                              self.assertFalse(client.is_alive())
                  finally:
                      self.start.start()

                  self.assertEqual(outcomes.count('queued'), 1, outcomes)
                  self.assertEqual(len(outcomes), 2, outcomes)
                  self.assertEqual(studio.queue.qsize(), 1)
                  self.assertEqual(job['status'], 'queued')
                  self.assertEqual(studio.requests, [])


          if __name__ == '__main__':
              unittest.main()
          PY

          cat > docs/revision-commands/703-OBSERVATION-PUBLICATION.md <<'MD'
          # Ordinary observation state publication (#703)

          ## Boundary

          Ordinary Resume observation owns an existing retained prompt identity. It must durably publish the exact queued observation state before giving the in-memory job or worker queue ownership of that state. A failed persistence attempt must not leave a live `queued` record with no queue item.

          The correction is stacked on #701. It does not change which jobs are eligible for observation-only admission, stopped-tracking behavior, resource-hold policy, backend switching, prompt identities, receipt interpretation, allowance accounting or generation authority.

          ## Publication protocol

          The command builds a prospective top-level job state without mutating the live record. It writes only `state.json`; the immutable recipe and workflow are not rewritten merely to queue observation. After a successful atomic replacement, the same prospective state is published to memory and one `observe` item is queued.

          An `OSError` can occur after replacement even though the exact intended state is already durable. The command therefore reads `state.json` after such an error:

          - exact prospective state: treat publication as committed, publish memory and queue exactly once;
          - old, missing, malformed or different state: propagate the failure, preserve the prior live record and queue nothing.

          This is reconciliation of exact retained evidence, not a claim that several files form one filesystem transaction. The operation never submits `/prompt`, replaces a job identity, releases resources, refills a budget or silently retries generation.

          ## Regression coverage

          Temporary-store tests inject failures immediately before and immediately after `state.json` replacement. They cover unresolved known prompts, terminal receipt reconciliation, a later explicit retry, exact recipe/workflow retention, and two concurrent callers after an ambiguous post-replacement error. All fixtures use inert backends and assert zero backend requests.

          Merge order: **#701, then this #703 correction**.
          MD

          set +e
          python -m unittest tests.test_observation_resume_persistence -v > /tmp/observation-red.log 2>&1
          red_status=$?
          set -e
          cat /tmp/observation-red.log
          test "$red_status" -ne 0
          grep -Eq 'FAILED|ERROR' /tmp/observation-red.log

          python - <<'PY'
          from pathlib import Path

          path = Path('app/server.py')
          source = path.read_text(encoding='utf-8')
          old = '''        pending = [s for s in job["submissions"] if s.get("status") != "completed"]
                  if not pending: job["reconciliation"] = {"status": job.get("status"), "message": job.get("message")}  # what the queued reconciliation started from
                  job["status"] = "queued"; job["message"] = "Queued to resume observation; no image will be resubmitted."; self._save(job); self.queue.put(("observe", job_id)); return self.public(job)
          '''
          new = '''        pending = [s for s in job["submissions"] if s.get("status") != "completed"]
                  prospective = dict(job)
                  if not pending:
                      prospective["reconciliation"] = {"status": job.get("status"), "message": job.get("message")}
                  prospective.update(status="queued", message="Queued to resume observation; no image will be resubmitted.")
                  state = {key: value for key, value in prospective.items() if key != "graph"}
                  state_path = self.runs / job_id / "state.json"
                  try:
                      self._write_json_atomic(state_path, state)
                  except OSError:
                      # Replacement may have committed before a later filesystem error.
                      # Only exact durable evidence earns in-memory/queue publication.
                      if read_json(state_path) != state:
                          raise
                  job.update(prospective)
                  self.queue.put(("observe", job_id))
                  return self.public(job)
          '''
          if source.count(old) != 1:
              raise SystemExit('expected one exact ordinary observation publication block')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY

          python -m unittest tests.test_observation_resume_persistence -v
          python -m unittest tests.test_ordinary_observation_admission tests.test_reference_hold_observation_admission -v
          python -m unittest tests.test_server -v
          python -m py_compile app/server.py tests/test_observation_resume_persistence.py
          python scripts/validate-repo.py
          git diff --check

          rm .github/workflows/publish-703-observation-publication.yml
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "199175422+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add app/server.py tests/test_observation_resume_persistence.py docs/revision-commands/703-OBSERVATION-PUBLICATION.md .github/workflows/publish-703-observation-publication.yml
          git diff --cached --check
          git commit -m "fix: publish observation state before queueing"
          git push origin HEAD:audit/703-observation-publication
