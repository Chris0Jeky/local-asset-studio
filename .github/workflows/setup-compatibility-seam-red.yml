name: Setup compatibility seam RED

on:
  push:
    branches: [codex/setup-compatibility-readonly-seam]

permissions: {}

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the tests-only contract before implementation
        run: python -m unittest discover -s tests -p 'test_setup_context_compatibility_seam.py' -v
