name: Workshop UI
on:
  pull_request:
    paths:
      - 'app/static/**'
      - 'docs/workshop/**'
      - 'scripts/export-workshop-prototype.py'
      - 'tests/*workshop*'
      - 'tests/studio_browser_smoke.py'
      - 'tests/setup_apply_browser.py'
      - 'tests/setup_lineage_browser.py'
      - 'tests/recipe_shortlist_browser.py'
      - 'tests/preset_model_browser.py'
      - '.github/workflows/workshop-ui.yml'
permissions:
  contents: write
jobs:
  apply-guidance-accuracy:
    if: github.event.pull_request.head.ref == 'codex/610-guidance-contract-accuracy'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/610-guidance-contract-accuracy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded code and documentation corrections
        run: python scripts/tmp_apply_guidance_contract_accuracy.py
      - name: Verify focused contracts
        run: |
          node --check app/static/workshop.js
          node --test tests/workshop_contracts.cjs tests/reference_model.cjs
          python -m unittest tests.test_workshop_frontend tests.test_presentation_context -v
          python scripts/validate-repo.py
      - name: Publish correction and restore read-only CI
        shell: bash
        run: |
          git show HEAD^:.github/workflows/workshop-ui.yml > .github/workflows/workshop-ui.yml
          rm -f .github/workflows/tmp-610-guidance-contract-accuracy.yml
          rm -f scripts/tmp_apply_guidance_contract_accuracy.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(workshop): align reachable guidance contract"
          git push origin HEAD:codex/610-guidance-contract-accuracy
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package exact frontend source for offline review
        run: |
          mkdir -p /tmp/workshop-review
          git rev-parse HEAD > /tmp/workshop-review/COMMIT.txt
          git archive --format=tar HEAD app/static tests docs/workshop .github/workflows scripts/export-workshop-prototype.py > /tmp/workshop-review/workshop-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: workshop-review-source
          path: /tmp/workshop-review/
          retention-days: 1
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/workshop_contracts.cjs tests/reference_model.cjs
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Component presentation and original-control contracts
        run: python tests/workshop_browser.py --output .runtime/workshop-component
      - name: Native disclosure lifecycle and nested modal handoffs
        run: python tests/workshop_handoffs.py --output .runtime/workshop-handoffs
      - name: Real application, native HTTP/storage and original submission handler
        run: python tests/workshop_application.py --output .runtime/workshop-application
      - name: Offline prototype interactions and screenshots
        run: python tests/workshop_prototype.py --output .runtime/workshop-prototype
      - name: Export standalone prototype
        run: python scripts/export-workshop-prototype.py --output .runtime/workshop-prototype/index.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workshop-browser-evidence
          path: |
            .runtime/workshop-component/
            .runtime/workshop-application/
            .runtime/workshop-handoffs/
            .runtime/workshop-prototype/
          retention-days: 7
