name: Pinned pose source transfer
on:
  push:
    branches: [codex/pose-continuation-transfer-20260916]
    paths: [.github/workflows/pose-source-transfer.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 186d2b085c91cdc368bd79a3bcf65e0da45b5a29
          persist-credentials: false
      - name: Export exact tracked source without runtime or Git configuration
        run: |
          mkdir -p /tmp/pose-source-export
          git archive --format=tar.gz HEAD > /tmp/pose-source-export/source.tar.gz
          git cat-file commit HEAD > /tmp/pose-source-export/commit.txt
          git ls-tree -r -z HEAD > /tmp/pose-source-export/tree.z
          git rev-parse HEAD HEAD^{tree} > /tmp/pose-source-export/identity.txt
          cd /tmp/pose-source-export
          sha256sum source.tar.gz commit.txt tree.z identity.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-pose-source-186d2b0
          path: /tmp/pose-source-export/
          retention-days: 1
