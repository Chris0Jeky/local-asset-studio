name: Apply atomic setup substitution patch
on:
  push:
    branches: [codex/atomic-setup-substitution]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - name: Apply guarded shared-draft patch
        run: python scripts/apply_atomic_setup_substitution_patch.py
      - name: Verify substitution and adjacent contracts
        run: |
          python -m unittest discover -s tests -p 'test_setup_substitution*.py' -v
          python -m unittest discover -s tests -p 'test_setup_compatibility.py' -v
          python -m unittest discover -s tests -p 'test_setup_source_evidence.py' -v
          python -m unittest discover -s tests -p 'test_recipe_shortlist_apply.py' -v
          python scripts/validate-repo.py
      - name: Remove temporary patch helpers
        run: rm .github/workflows/atomic-setup-substitution.yml scripts/apply_atomic_setup_substitution_patch.py
      - name: Commit verified shared-draft integration
        run: |
          git config user.name 'Cristian Tcaci'
          git config user.email '59696583+Chris0Jeky@users.noreply.github.com'
          git add -A
          git commit -m 'feat: apply setup substitutions atomically'
          git push origin HEAD:codex/atomic-setup-substitution
