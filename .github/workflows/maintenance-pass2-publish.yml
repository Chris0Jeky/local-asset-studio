name: Publish verified maintenance pass 2
on:
  push:
    branches: [codex/maintenance-pass2-source-20260913]
    paths: [.github/workflows/maintenance-pass2-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 61a8c4e16b8e64b8bdea5a121bec71f2b0758cb8
      - name: Verify source identities before creating new branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import base64, hashlib, json, os, pathlib, subprocess, zlib
          repo='Chris0Jeky/local-asset-studio'
          base='61a8c4e16b8e64b8bdea5a121bec71f2b0758cb8'
          chunks=['1eb3282b2ed798f24fc6f29b4fa45cdfb1926668','055f0ec0bcdec8a64cdd3433e35664cf7a489a0f','9501e3dcae217ab7ab40a262afc469210b56a369','82a153f98e2b1996dc74caaefd08d627370efdea','c553ce714924426436c2d6ea229bcbea995aaf16','896c178df1df411eff4470ff34c83dd80595e349','413b08cf4aa135c0ea9e957e29b871df4a16bf6c','1480658b2be2b19692d1a65c77a37f393fe1b151','1262b0af34d50abd16907a91e831d508734b13d3']
          payload=b''
          for sha in chunks:
              obj=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/git/blobs/{sha}']))
              raw=base64.b64decode(''.join(obj['content'].split()),validate=True)
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              payload+=raw
          raw=zlib.decompress(base64.b64decode(payload,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='14f352b60ace8637044cf098b4dc07d0c851a20f6b380653001abbfd1dedce48'
          specs=json.loads(raw)
          assert [s['branch'] for s in specs]==['codex/recipe-execution-evidence','codex/wan-control-readiness','codex/headless-output-safety']
          def git(*args):return subprocess.check_output(['git',*args]).decode().strip()
          receipts=[]
          for spec in specs:
              assert spec['base']==base
              assert not git('ls-remote','--heads','origin','refs/heads/'+spec['branch']), 'Existing branch; refusing overwrite'
              git('checkout','--detach',base)
              assert git('rev-parse','HEAD^{tree}')=='c7e1c8e0857661ce614ba7dd635a4de2beb90062'
              patch=spec['patch'].encode()
              assert hashlib.sha256(patch).hexdigest()==spec['patch_sha256']
              subprocess.run(['git','apply','--index','--whitespace=error'],input=patch,check=True)
              assert git('write-tree')==spec['tree'], 'Source mismatch'
              assert not any(p.startswith('.github/') for p in git('diff','--cached','--name-only').splitlines())
              subprocess.run(['git','diff','--cached','--check'],check=True)
              git('-c','user.name=Studio maintenance','-c','user.email=studio-maintenance@users.noreply.github.com','commit','-m',spec['message'])
              assert git('rev-parse','HEAD^{tree}')==spec['tree']
              git('push','origin','HEAD:refs/heads/'+spec['branch'])
              receipts.append({'branch':spec['branch'],'commit':git('rev-parse','HEAD'),'tree':spec['tree'],'expected_final_tree':spec['final_tree'],'patch_sha256':spec['patch_sha256']})
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'publication.json'
          path.write_text(json.dumps(receipts,indent=2),encoding='utf-8')
          print(path.read_text())
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: maintenance-pass2-publication
          path: ${{ runner.temp }}/publication.json
          retention-days: 1
