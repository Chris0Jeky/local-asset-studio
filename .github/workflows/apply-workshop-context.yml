name: Apply workshop context integration
on:
  push:
    branches:
      - codex/workshop-context-guidance
    paths:
      - '.automation/workshop-context.patch'
      - '.automation/workshop-context-tests.patch'
      - '.github/workflows/apply-workshop-context.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/workshop-context-guidance
          fetch-depth: 0
      - name: Apply reviewed integration patches
        run: |
          git apply --check .automation/workshop-context.patch .automation/workshop-context-tests.patch
          git apply .automation/workshop-context.patch .automation/workshop-context-tests.patch
          rm .automation/workshop-context.patch .automation/workshop-context-tests.patch
      - name: Commit exact patched files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/static/workshop.js tests/workshop_fixture.html tests/workshop_browser_core.py tests/workshop_prototype.py .automation
          git commit -m "feat(workshop): integrate read-only context guidance"
          git push origin HEAD:codex/workshop-context-guidance
