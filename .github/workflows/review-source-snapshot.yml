name: Verified workflow continuation delivery
on:
  push:
    branches: [codex/workflow-review-snapshot]
permissions:
  contents: write
jobs:
  delivery:
    if: contains(github.event.head_commit.message, '[deliver]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify the reviewed source patch
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, pathlib, re, subprocess
          def git(*args): return subprocess.check_output(['git', *args]).decode().strip()
          p = json.loads(pathlib.Path('continuation-delivery.json').read_text())
          assert p['branch'] in ('codex/saved-run-hash-dispatch', 'codex/saved-run-history-ui')
          assert re.fullmatch('[0-9a-f]{40}', p['base'])
          chunks = p.get('patch_chunks', [])
          assert len(chunks) <= 12
          assert all(re.fullmatch(r'continuation-chunk-[a-z0-9-]+\.txt', n) for n in chunks)
          encoded = ''.join(pathlib.Path(n).read_text().strip() for n in chunks) if chunks else p['patch_gzip_base64']
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == p['patch_sha256']
          patch = pathlib.Path('/tmp/continuation.patch'); patch.write_bytes(raw)
          git('fetch', '--depth=1', 'origin', p['base'])
          git('checkout', '--detach', 'FETCH_HEAD')
          git('apply', '--check', str(patch)); git('apply', '--index', str(patch))
          changed = git('diff', '--cached', '--name-only').splitlines()
          assert set(changed) == set(p['blobs'])
          for name, sha in p['blobs'].items():
              assert name.startswith(('studio_workflow/', 'app/static/', 'tests/', 'docs/workflow-studio/'))
              assert git('rev-parse', ':' + name) == sha, name
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('commit', '-m', p['message'])
          git('push', 'origin', 'HEAD:refs/heads/' + p['branch'])
          print('DELIVERED', p['branch'], git('rev-parse', 'HEAD'), 'FILES', len(changed))
          PY
