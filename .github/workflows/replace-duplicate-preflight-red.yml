name: Replace receipt duplicate preflight regression

on:
  push:
    branches:
      - fix/replace-research-receipts

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_replace_character_duplicate_receipts -v
