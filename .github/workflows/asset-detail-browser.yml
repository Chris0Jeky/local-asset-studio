name: Asset detail workflow QA
on:
  pull_request:
    paths:
      - 'app/static/**'
      - 'tests/addressable_figures*'
      - 'tests/collection_editor*'
      - 'tests/test_collection*'
      - 'app/workspace.py'
      - 'app/server.py'
      - 'tests/asset_workspace*'
      - 'tests/test_asset_workspace*'
      - 'tests/asset_metadata*'
      - 'tests/test_asset_metadata*'
      - 'tests/asset_grid*'
      - 'tests/test_asset_grid*'
      - 'tests/asset_library*'
      - 'tests/test_asset_library*'
      - 'tests/asset_detail*'
      - 'tests/test_asset_detail*'
      - 'tests/asset_reload_browser.py'
      - 'tests/asset_recovery_contracts.cjs'
      - 'tests/studio_browser_smoke.py'
      - '.github/workflows/asset-detail-browser.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        response-delay-ms: [0, 400]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright==1.57.0 -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p 'test_asset_detail*.py' -v
      - run: node tests/asset_recovery_contracts.cjs
      - name: Native browser HTTP against synthetic Studio APIs
        run: python tests/asset_detail_browser.py --out .runtime/asset-detail-proof --response-delay-ms ${{ matrix.response-delay-ms }}
      - name: Native browser reload recovery against ephemeral synthetic Studio APIs
        if: matrix.response-delay-ms == 0
        run: python tests/asset_reload_browser.py --out .runtime/asset-reload-proof
      - name: Baseline exception and expectation exit probes
        if: matrix.response-delay-ms == 0
        run: python tests/asset_detail_driver_probe.py --out .runtime/asset-detail-proof/driver-probes
      - name: Two clients and lost responses against real metadata storage
        if: matrix.response-delay-ms == 0
        run: python tests/asset_metadata_browser.py --out .runtime/asset-metadata-proof
      - name: Scoped reload and historical receipts against actual SQLite
        if: matrix.response-delay-ms == 0
        run: python tests/asset_workspace_browser.py --out .runtime/asset-workspace-proof
      - name: Selection and filtered views against actual metadata storage
        if: matrix.response-delay-ms == 0
        run: |
          node tests/asset_library_contracts.cjs
          python tests/asset_library_browser.py --out .runtime/asset-library-proof
      - name: Stable grid focus and preview lifecycle
        if: matrix.response-delay-ms == 0
        run: |
          node tests/asset_grid_contracts.cjs
          python tests/asset_grid_browser.py --out .runtime/asset-grid-proof
      - name: Addressable figure editor recovery
        if: matrix.response-delay-ms == 0
        run: |
          node tests/addressable_figures_frontend.cjs
          python tests/addressable_figures_browser.py --out .runtime/addressable-figures-proof
      - name: Collection editing with actual Workspace storage
        if: matrix.response-delay-ms == 0
        run: |
          python -m unittest discover -s tests -p 'test_collection*.py' -v
          python tests/collection_editor_browser.py --out .runtime/collection-editor-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-detail-workflow-proof-${{ matrix.response-delay-ms }}ms
          path: |
            .runtime/asset-detail-proof/
            .runtime/asset-reload-proof/
            .runtime/asset-metadata-proof/
            .runtime/asset-workspace-proof/
            .runtime/asset-library-proof/
            .runtime/asset-grid-proof/
            .runtime/addressable-figures-proof/
            .runtime/collection-editor-proof/
          if-no-files-found: ignore
          retention-days: 7
