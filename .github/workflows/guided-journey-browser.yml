name: Guided journey browser
on:
  pull_request:
    paths:
      - 'app/static/**'
      - 'studio_workflow/guides.py'
      - 'studio_workflow/control*.py'
      - 'studio_workflow/core.py'
      - 'tests/workflow_control_preview_browser.py'
      - 'tests/test_workflow_control*.py'
      - 'tests/studio_guide*'
      - 'tests/create_readiness*'
      - 'tests/test_create_readiness_frontend.py'
      - 'tests/asset_detail_browser.py'
      - 'tests/studio_browser_smoke.py'
      - 'tests/test_studio_guide.py'
      - '.github/workflows/guided-journey-browser.yml'
permissions:
  contents: read
jobs:
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p test_studio_guide.py -v
      - run: python -m unittest discover -s tests -p test_create_readiness_frontend.py -v
      - name: Actual pages and native HTTP, storage, keyboard and stage navigation
        run: python tests/studio_guide_browser.py --out .runtime/guide-proof
      - name: Native disclosure layout and keyboard ownership on isolated coach fixture
        run: python tests/studio_guide_disclosure_browser.py --out .runtime/guide-disclosure-proof -v
      - name: Shared control contracts and real-DOM preview journey
        run: |
          python -m unittest discover -s tests -p 'test_workflow_control*.py' -v
          python tests/workflow_control_preview_browser.py --out .runtime/control-preview-proof -v
      - name: Create blockers, focus and read-only dependency retry
        run: python tests/create_readiness_browser.py --out .runtime/create-readiness-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guide-browser-proof
          path: |
            .runtime/guide-proof/
            .runtime/guide-disclosure-proof/
            .runtime/control-preview-proof/
            .runtime/create-readiness-proof/
          if-no-files-found: ignore
          retention-days: 7
