name: Exact UX review tree transfer
on:
  push:
    branches: ['codex/ux-review-transfer-20260921']
    paths: ['.github/workflows/ux-review-transfer.yml']
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          path: transfer
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 1b4620ff65bfcf5d51e9e60070c02983dd718a1c
          path: source
          fetch-depth: 0
      - name: Verify pinned parents, patches and tested complete trees
        working-directory: source
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, hashlib, json, os
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          git('config','user.name','OpenAI')
          git('config','user.email','noreply@openai.com')
          reviewed_parent='c2cd2914f01f2f510a35ca688bc511a54ecfeac3'
          assert git('rev-parse',reviewed_parent+'^{tree}')=='9b7321f631300b5712c6bd641931f1183a0531fd'
          items=[('run','57d3ed313e7d3fc3bb06b295fb0b5e21a261c383','4e454b2fcd5814a499d6611db3752b2fae6e9db4','e8b9e5f5d9a41c5339dc4b62a42c6c55279710552f42be5d19db9d7be5a5a9f1','3db4059dde003f61182878662357e67d1d23f7aa'),('daily','1b4620ff65bfcf5d51e9e60070c02983dd718a1c','98b286a37f980db03f5b332443bd987e538ab00d','14535ea1a791f62a98775e7fc22cd6980b069ebb600ebf276d1087c55c1f01ef','ecbb1f278eae9a7b256d6ef336822c611be59dde')]
          results=[]
          for name,parent,old_tree,digest,expected in items:
              git('checkout','--detach','--force',parent)
              assert git('rev-parse','HEAD^{tree}')==old_tree
              patch=Path('../transfer/.github/ux-review-'+name+'.patch').read_bytes()
              assert hashlib.sha256(patch).hexdigest()==digest
              subprocess.run(['git','apply','--index','--unidiff-zero','--whitespace=error-all','-'],input=patch,check=True)
              tree=git('write-tree');assert tree==expected,tree
              commit=git('commit-tree',tree,'-p',parent,'-p',reviewed_parent,'-m','fix: reconcile reviewed '+name+' UX with its parent')
              ref='refs/heads/codex/ux-'+name+'-review-materialized'
              git('push','origin',commit+':'+ref)
              results.append({'name':name,'commit':commit,'tree':tree,'parent':parent,'reviewed_parent':reviewed_parent})
              reviewed_parent=commit
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(json.dumps(results,indent=2)+'\n')
          print(json.dumps(results,indent=2))
          PY
