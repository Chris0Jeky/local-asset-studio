name: Source orientation contracts
on:
  pull_request:
    paths:
      - 'app/continuation.py'
      - 'app/parallax.py'
      - 'app/tiles.py'
      - 'tests/test_source_exif_orientation.py'
      - 'tests/test_parallax.py'
      - 'tests/test_tiles.py'
      - 'tests/test_continuation.py'
      - 'tests/test_vary_routes.py'
      - '.github/workflows/source-orientation.yml'
permissions:
  contents: read
jobs:
  source-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record tested source revision
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git show -s --format='commit %H%ntree %T%nparents %P'
          git ls-files -s -- app/continuation.py app/parallax.py app/tiles.py tests/test_source_exif_orientation.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - name: Orientation, original bytes and preparation contracts
        run: |
          python -m unittest discover -s tests -p test_source_exif_orientation.py -v
          python -m unittest discover -s tests -p test_parallax.py -v
          python -m unittest discover -s tests -p test_tiles.py -v
          python -m unittest discover -s tests -p test_continuation.py -v
          python -m unittest discover -s tests -p test_vary_routes.py -v
