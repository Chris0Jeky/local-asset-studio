name: Issue 458 fixture contract fix

on:
  push:
    branches:
      - fix/reference-hold-observation-admission

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update the duck-typed storage fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path('tests/test_production_storage.py')
          text = target.read_text(encoding='utf-8')
          old = '''class StorageStudio:
              def require_worker(self):
                  from test_server import server
                  return server.Studio.require_worker(self)
          '''
          new = '''class StorageStudio:
              def require_worker(self):
                  from test_server import server
                  return server.Studio.require_worker(self)
              def require_worker_observation(self):
                  from test_server import server
                  return server.Studio.require_worker_observation(self)
          '''
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one StorageStudio admission delegate')
          target.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Install focused dependencies
        run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt

      - name: Verify admission and storage contracts
        shell: bash
        run: |
          PYTHONPATH=tests python -m unittest \
            tests.test_reference_hold_observation_admission \
            tests.test_mixed_batch \
            tests.test_mixed_batch_owner \
            tests.test_production_terminal \
            tests.test_reference_jobs \
            tests.test_production_storage -v

      - name: Publish the verified fixture update without helper machinery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_production_storage.py
          git rm .github/workflows/issue-458-fixture-fix.yml
          git commit -m "test: add observation guard to storage fixture"
          git push origin HEAD:fix/reference-hold-observation-admission
