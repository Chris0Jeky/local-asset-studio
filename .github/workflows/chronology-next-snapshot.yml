name: Chronology next snapshot
on:
  push:
    branches: [codex/chronology-next-snapshot]
    paths: [.github/workflows/chronology-next-snapshot.yml]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture newer main and overlap evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/chronology
          git bundle create /tmp/chronology/source.bundle refs/remotes/origin/main ^268fc8fa4803374878c976c8af859f0200e1d155
          python - <<'PY'
          import json,os,pathlib,subprocess,urllib.request
          def get(path):
              req=urllib.request.Request('https://api.github.com/repos/Chris0Jeky/local-asset-studio/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          pulls=get('pulls?state=open&per_page=100')
          data={'main':subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip(),'open_prs':[{'number':p['number'],'title':p['title'],'head':p['head']['sha'],'files':[f['filename'] for f in get('pulls/'+str(p['number'])+'/files?per_page=100')]} for p in pulls], 'issue187':get('issues/187')}
          pathlib.Path('/tmp/chronology/integration.json').write_text(json.dumps(data,indent=2),encoding='utf-8')
          print('Main',data['main'])
          print('Open PRs',data['open_prs'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chronology-main-integration
          path: /tmp/chronology/
          retention-days: 3
