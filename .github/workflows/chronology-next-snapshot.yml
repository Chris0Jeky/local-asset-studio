name: Chronology next snapshot
on:
  push:
    branches: [codex/chronology-next-snapshot]
    paths: [.github/workflows/chronology-next-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mixed-batch-recovery
          fetch-depth: 0
          persist-credentials: false
      - name: Capture incremental source for concurrent review reconciliation
        run: |
          mkdir -p /tmp/source
          git bundle create /tmp/source/integration.bundle HEAD refs/remotes/origin/main ^f1283853bbc918ee5d93161a25bf92fcb3596640
          git rev-parse HEAD > /tmp/source/head.txt
          git rev-parse HEAD^{tree} > /tmp/source/tree.txt
          git log -5 --oneline > /tmp/source/commits.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr224-concurrent-integration
          path: /tmp/source/
          retention-days: 3
