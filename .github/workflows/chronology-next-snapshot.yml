name: Chronology next snapshot
on:
  push:
    branches: [codex/chronology-next-snapshot]
    paths: [.github/workflows/chronology-next-snapshot.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mixed-batch-recovery
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only the exact reviewed follow-up source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/review-proof
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess,urllib.request
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')=='e509f2d59dcc8aeb78eec293979dbc34cc5e8b6b', 'Concurrent feature changes require reconciliation'
          assert git('rev-parse','HEAD^{tree}')=='1e72c5418308a45be8f8be6a279ff16efcdb0c21'
          sha='5184b6551ff62af23dcafd26cad132a90471ff86'
          req=urllib.request.Request('https://api.github.com/repos/Chris0Jeky/local-asset-studio/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as response:blob=json.load(response)
          data=base64.b64decode(blob['content'])
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
          assert hashlib.sha256(data).hexdigest()=='4adafa6b33aeca649792735451ef9d05c567a97f6fbe93d19c44e4dd29c69381'
          package=json.loads(lzma.decompress(data))
          assert package['head']==git('rev-parse','HEAD') and package['before_tree']==git('write-tree')
          allowed={'app/server.py','app/static/studio.css','tests/test_mixed_batch.py','tests/mixed_batch_browser.py','docs/reconciliation/2026-09-13-mixed-batch-recovery.md'}
          assert set(package['manifest'])==allowed
          for name,record in package['manifest'].items():assert git('rev-parse','HEAD:'+name)==record['before_blob'],name
          root=pathlib.Path('/tmp/review-proof');patch=root/'review-fix.patch'
          patch.write_text(package['patch'],encoding='utf-8')
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==allowed
          for name,record in package['manifest'].items():assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==record['sha256'],name
          assert git('write-tree')==package['after_tree']=='b51119765a80c253b2ea289f6797926afdd252c2'
          (root/'manifest.json').write_text(json.dumps({k:v for k,v in package.items() if k!='patch'},indent=2),encoding='utf-8')
          PY
      - run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt playwright==1.57.0
      - name: Full suite and validator
        run: |
          set -o pipefail
          python -m unittest discover -s tests 2>&1 | tee /tmp/review-proof/full-suite.log
          python scripts/validate-repo.py 2>&1 | tee /tmp/review-proof/validation.log
          node tests/mixed_batch_frontend.cjs
          git diff --cached --check
      - run: python -m playwright install --with-deps chromium
      - name: Both actual browser paths must pass
        run: |
          set -o pipefail
          python tests/mixed_batch_browser.py --out /tmp/review-proof/mixed-browser 2>&1 | tee /tmp/review-proof/mixed-browser.log
          python tests/recipe_shortlist_browser.py --out /tmp/review-proof/shortlist-browser 2>&1 | tee /tmp/review-proof/shortlist-browser.log
      - name: Publish verified fixes to the existing PR
        run: |
          git diff --exit-code
          test "$(git write-tree)" = 'b51119765a80c253b2ea289f6797926afdd252c2'
          git commit -m 'fix: preserve mixed sources on restart and prevent stacked panel overlap'
          git push origin HEAD:codex/mixed-batch-recovery
          git rev-parse HEAD > /tmp/review-proof/published-commit.txt
          git rev-parse HEAD^{tree} > /tmp/review-proof/published-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mixed-batch-review-proof
          path: /tmp/review-proof/
          retention-days: 7
