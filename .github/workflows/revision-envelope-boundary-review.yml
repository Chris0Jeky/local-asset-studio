name: Revision envelope boundary review

on:
  push:
    branches:
      - review/revision-envelope-size-boundary

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_revision_request_envelope_boundary.py' -v
