name: Prepare saved-lineage review blobs
on:
  push:
    branches: [codex/restyle-saved-lineage-630]
    paths: [.github/restyle-prepare-630.py, .github/workflows/restyle-prepare-630.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'Chris0Jeky/local-asset-studio' && github.ref == 'refs/heads/codex/restyle-saved-lineage-630'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Reconstruct and verify tested sources
        run: |
          test "$(git rev-parse HEAD^)" = f8fcc40f7388c23d13309c20c2776017a20004b2
          python .github/restyle-prepare-630.py
          git diff --check
          node --check app/static/app.js
          node tests/frontend_handoffs.cjs
      - name: Store immutable blobs only; no ref or commit writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,urllib.request
          from pathlib import Path
          expected={'app/static/app.js':'c167a9417e1bdeee1c2c155775b53b408c69eb94','tests/frontend_handoffs.cjs':'b7d629ecf9f42617acc0d39d704963da0587f606','tests/setup_lineage_browser.py':'8afe6d51fde070b4aac98178b3e761ccb994af66'}
          for path,sha in expected.items():
              data=Path(path).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              request=urllib.request.Request('https://api.github.com/repos/Chris0Jeky/local-asset-studio/git/blobs',data=json.dumps({'content':data.decode('utf-8'),'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response:
                  result=json.load(response)
              assert result['sha']==sha
              print('VERIFIED_BLOB',path,sha)
          PY
