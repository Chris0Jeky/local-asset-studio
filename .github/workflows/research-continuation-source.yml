name: Research continuation source
on:
  push:
    branches: [codex/research-continuation-source-0918]
    paths: [.github/workflows/research-continuation-source.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f0b3f7cfd75c3ead770815a4d72fde181cd5c265
          fetch-depth: 5
          path: settings
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 018e985023f3308e06d502ea7a55c99e1d6b504b
          fetch-depth: 5
          path: profiles
          persist-credentials: false
      - name: Retain exact diffs and object identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/research-diffs"
          for dir in settings profiles; do
            git -C "$dir" diff --binary 6cdf6ab09683b37f55e1b55af582e4e28eac8100 HEAD > "$RUNNER_TEMP/research-diffs/$dir.patch"
            git -C "$dir" rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/research-diffs/$dir.identity"
            git -C "$dir" ls-tree -rz HEAD > "$RUNNER_TEMP/research-diffs/$dir.tree"
          done
          cd "$RUNNER_TEMP/research-diffs"
          sha256sum *.patch *.identity *.tree > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: research-continuation-diffs
          path: ${{ runner.temp }}/research-diffs/
          retention-days: 1
          if-no-files-found: error
