name: UX session source
on:
  push:
    branches: ['codex/ux-collection-session-transfer']
    paths: ['.github/workflows/ux-session-source.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 20c46dd45044a6f9193b3e562df5bee4e5fc8912
          fetch-depth: 0
          persist-credentials: false
      - name: Capture two exact source revisions
        run: |
          mkdir -p /tmp/ux-source
          git branch snapshot-main HEAD
          git fetch --no-tags origin 8f9a5fc559aaa8c3b8bd1d97f5d100c8f2e63e8e
          git branch snapshot-grid 8f9a5fc559aaa8c3b8bd1d97f5d100c8f2e63e8e
          git bundle create /tmp/ux-source/source.bundle snapshot-main snapshot-grid
          sha256sum /tmp/ux-source/source.bundle > /tmp/ux-source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ux-session-pinned-source
          path: /tmp/ux-source/
          retention-days: 1
