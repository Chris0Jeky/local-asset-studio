name: Repair reviewed handoff fixture once
on:
  push:
    branches: [codex/prepared-draft-recovery-20261003]
    paths: [.github/workflows/publish-handoff-fixture-once.yml]
permissions: {}
jobs:
  publish:
    if: github.repository == 'Chris0Jeky/local-asset-studio' && github.ref == 'refs/heads/codex/prepared-draft-recovery-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inject the real UI policy module, without changing any assertions
        run: |
          test "$(git rev-parse HEAD^)" = ce67cee03be3b9582a089cde38d27252ccc40cc9
          test "$(git hash-object tests/frontend_handoffs.cjs)" = 31800808ba0dc3bf0a8d70cc4ffa3c680adf5498
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/frontend_handoffs.cjs');s=p.read_text()
          old="const StudioAssetRecovery = require('../app/static/asset-recovery.js');"
          assert s.count(old)==1
          s=s.replace(old,old+"\nconst StudioUX = require('../app/static/studio-core.js');")
          old='URL, Blob, StudioContinuation, StudioAssetRecovery,'
          assert s.count(old)==1
          p.write_text(s.replace(old,old+' StudioUX,'))
          PY
          test "$(git hash-object tests/frontend_handoffs.cjs)" = 427dc348d42000957683027864a10cda02a1ece1
          node tests/frontend_handoffs.cjs
          node tests/prepared_draft_recovery.cjs
          git diff --check
      - name: Publish only the reviewed harness repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/frontend_handoffs.cjs
          git commit -m 'test: supply the real StudioUX module to legacy handoff fixtures'
          git push origin HEAD:refs/heads/codex/prepared-draft-recovery-20261003
