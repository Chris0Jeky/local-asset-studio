name: Setup source integrity contracts
on:
  push:
    branches: [codex/setup-source-evidence-bridge]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - run: python -m unittest discover -s tests -p 'test_setup_source_evidence_edges.py' -v
