name: Apply setup source integrity fixes
on:
  push:
    branches: [codex/setup-source-evidence-bridge]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - name: Apply exact retained-receipt fixture updates
        run: python scripts/apply_setup_source_fixture_patch.py
      - name: Verify source bridge and compatibility contracts
        run: |
          python -m unittest discover -s tests -p 'test_setup_source_evidence*.py' -v
          python -m unittest discover -s tests -p 'test_setup_compatibility*.py' -v
          python scripts/validate-repo.py
      - name: Remove temporary patch helpers
        run: rm .github/workflows/setup-source-integrity.yml scripts/apply_setup_source_fixture_patch.py
      - name: Commit verified source-integrity changes
        run: |
          git config user.name 'Cristian Tcaci'
          git config user.email '59696583+Chris0Jeky@users.noreply.github.com'
          git add -A
          git commit -m 'fix: bind setup evidence to exact retained receipts'
          git push origin HEAD:codex/setup-source-evidence-bridge
