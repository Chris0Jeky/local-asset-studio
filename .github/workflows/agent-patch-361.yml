name: Apply issue 361 reference review use case

on:
  push:
    branches:
      - fix/361-reference-review-use-case

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove the registration contract fails before implementation
        run: |
          if python -m unittest tests/test_reference_review_use_case_registration.py -v; then
            echo '::error::The missing-journey regression test unexpectedly passed before the patch.'
            exit 1
          fi
          echo 'Expected missing registration, driver, documentation, and CI coverage reproduced.'

      - name: Apply the measured journey
        run: python .github/agent-patch-361.py

      - name: Install browser dependencies
        run: |
          python -m pip install pillow playwright==1.57.0
          python -m playwright install --with-deps chromium

      - name: Verify registration and offline contracts
        run: |
          python -m py_compile tests/studio_use_cases.py .github/agent-patch-361.py
          python -m unittest tests/test_reference_review_use_case_registration.py -v
          python -m unittest tests/test_use_case_matrix.py -v
          python -m unittest discover -s tests -p 'test_reference_review*.py' -v

      - name: Run the measured Prompt Lab journey
        run: python tests/studio_use_cases.py --case reference-analysis-review-and-apply --out .runtime/reference-review-use-case.json

      - name: Run the richer two-viewport proof
        run: python tests/reference_review_browser.py --output .runtime/reference-review/browser

      - name: Validate the repository
        run: |
          python scripts/validate-repo.py
          git diff --check

      - name: Commit the verified implementation
        run: |
          git rm .github/workflows/agent-patch-361.yml .github/agent-patch-361.py
          git add .github/workflows/reference-review-use-case.yml docs/UX-USE-CASE-MATRIX.md research/ux/use-cases.json tests/studio_use_cases.py tests/test_use_case_matrix.py tests/test_reference_review_use_case_registration.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(ux): measure reference review and apply journey'
          git push origin HEAD
