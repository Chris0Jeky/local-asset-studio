name: Repository payload contracts
on:
  pull_request:
    paths:
      - 'scripts/validate-repo.py'
      - 'tests/test_validate_repo*.py'
      - 'tests/test_repo_payload_guard.py'
      - 'models/**'
      - 'presets/**'
      - 'workflows/**'
      - 'examples/*/MANIFEST.json'
      - '.github/workflows/repo-payload.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repo-payload-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  payload:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git log -1 --format=%H
      - run: python -m unittest discover -s tests -p 'test_validate_repo*.py' -v
      - run: python -m unittest discover -s tests -p test_repo_payload_guard.py -v
      - run: python scripts/validate-repo.py
