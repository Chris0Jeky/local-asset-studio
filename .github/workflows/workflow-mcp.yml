name: Workflow MCP contracts
on:
  pull_request:
    paths:
      - 'studio_workflow/**'
      - 'tests/test_workflow_*'
      - 'scripts/workflow-mcp.py'
      - 'integrations/workflow-mcp/**'
      - '.github/workflows/workflow-mcp.yml'
  push:
    branches: [main]
    paths:
      - 'studio_workflow/**'
      - 'tests/test_workflow_*'
      - 'scripts/workflow-mcp.py'
      - 'integrations/workflow-mcp/**'
      - '.github/workflows/workflow-mcp.yml'
permissions:
  contents: read
jobs:
  protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r integrations/workflow-mcp/requirements.txt
      - name: Require optional SDK (no skipped protocol gate)
        run: python -c "import mcp; import importlib.metadata; assert importlib.metadata.version('mcp') == '1.28.1'"
      - run: python -m unittest discover -s tests -p test_workflow_agent_bridge.py -v
      - run: python -m unittest discover -s tests -p test_workflow_mcp.py -v
      - run: python -m unittest discover -s tests -p test_workflow_saved_run_clients.py -v
      - run: python scripts/workflow-mcp.py --describe
