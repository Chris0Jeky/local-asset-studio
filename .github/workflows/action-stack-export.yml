name: action-stack-narration-export
on:
  pull_request:
    paths: ['scripts/action_stack_export.py', 'tests/test_action_stack_export.py', '.github/workflows/action-stack-export.yml']
  push:
    paths: ['scripts/action_stack_export.py', 'tests/test_action_stack_export.py', '.github/workflows/action-stack-export.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p "test_action_stack_export.py" -v
