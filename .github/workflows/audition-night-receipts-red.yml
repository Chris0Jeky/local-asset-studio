name: Night audition receipt regressions

on:
  push:
    branches:
      - test/audition-night-receipt-regressions

permissions:
  contents: read

jobs:
  focused-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_audition_night_receipts -v
