name: Storage continuation source receipt
on:
  push:
    branches: [codex/storage-resume-source-20261029]
    paths: ['.github/workflows/storage-resume-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cfca66203233fc2b670c749533455eb55626a4b9
          persist-credentials: false
      - name: Export canonical tracked blobs and identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/storage-source"
          git rev-parse HEAD > "$RUNNER_TEMP/storage-source/COMMIT.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/storage-source/TREE.txt"
          git ls-tree -r -z HEAD > "$RUNNER_TEMP/storage-source/manifest.git"
          python - <<'PY'
          import io, os, pathlib, subprocess, tarfile
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'storage-source'
          with tarfile.open(out/'source.tar','w') as archive:
              for row in subprocess.check_output(['git','ls-tree','-r','-z','HEAD']).split(b'\0'):
                  if not row:continue
                  meta,path=row.split(b'\t',1);mode,kind,sha=meta.decode().split()
                  if kind!='blob':raise SystemExit('Unsupported tracked object: '+kind)
                  data=subprocess.check_output(['git','cat-file','blob',sha])
                  item=tarfile.TarInfo(path.decode());item.mode=int(mode,8)&0o777
                  item.size=len(data);archive.addfile(item,io.BytesIO(data))
          PY
          cd "$RUNNER_TEMP/storage-source"
          sha256sum source.tar manifest.git > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: storage-continuation-source
          path: ${{ runner.temp }}/storage-source/
          if-no-files-found: error
          retention-days: 2
