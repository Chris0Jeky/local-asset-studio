# Publication retry 2: cross-realm state is normalised before assertion.
name: Apply issue 345 replacement source guard

on:
  push:
    branches:
      - fix/345-restyle-handoff-guards
    paths:
      - '.github/workflows/agent-patch-583-replace.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove the stale replacement regression fails before the fix
        run: |
          python .github/agent-patch-583-replace.py --test-only
          if node --test tests/workbench_handoff_guards.cjs; then
            echo '::error::The stale replacement regression unexpectedly passed before the source fix.'
            exit 1
          fi
          echo 'Expected stale replacement mutation reproduced.'

      - name: Guard the replacement copy
        run: python .github/agent-patch-583-replace.py --implementation

      - name: Verify focused frontend behavior
        run: |
          node --check app/static/studio-workbench.js
          node --test tests/workbench_handoff_guards.cjs
          node --test tests/frontend_handoffs.cjs
          python -m unittest tests/test_studio_ux.py -v
          python scripts/validate-repo.py
          git diff --check

      - name: Commit verified implementation
        run: |
          git add app/static/studio-workbench.js tests/workbench_handoff_guards.cjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(workbench): guard replacement source copies'
          git push origin HEAD
