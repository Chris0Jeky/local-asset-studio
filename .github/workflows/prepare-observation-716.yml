name: Prepare exact observation owner blobs
on:
  push:
    branches: ['audit/716-durable-observation-state']
    paths: ['.github/workflows/prepare-observation-716.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'Chris0Jeky/local-asset-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const assert = require('assert/strict');
            const {execFileSync} = require('child_process');
            const git = (...args) => execFileSync('git', args, {encoding:'utf8'}).trim();
            assert.equal(context.ref, 'refs/heads/audit/716-durable-observation-state');
            assert.equal(git('rev-parse','HEAD^1'), 'b19c5f5c6032fa11cb31171cfeccb151333cddeb');
            assert.equal(git('rev-parse','HEAD^2'), 'e65138436ab7bc0f0fa95a6e65c6c5dfce92db1f');
            const blob = bytes => crypto.createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
            const owners = {
              'app/server.py': ['1f5bf8e7d531de82db67a45aeeb64a141ae7dd30','8cb855a7a36718cc3f3de108ac4e99cb71419317'],
              'tests/test_observation_resume_persistence.py': ['96b043c091dc9bd3184d9de0fc918e719a934fb3','2e89ca156b23db7203268757ec2e9b420383634c'],
              'tests/test_reference_hold_observation_admission.py': ['be7abea640334c91297191e18c5291e000979208','651425049de9ff89eca82dc8277e98c624071889']
            };
            const texts = {};
            for (const [path, [before]] of Object.entries(owners)) {
              const raw = fs.readFileSync(path);
              assert.equal(blob(raw), before, path);
              texts[path] = raw.toString('utf8');
            }
            const change = (path, before, after, count=1) => {
              assert.equal(texts[path].split(before).length-1, count, path);
              texts[path] = texts[path].split(before).join(after);
            };
            const server = 'app/server.py';
            change(server, 'import submission_evidence\n', 'import submission_evidence\nimport observation_state\n');
            change(server, '    def _save(self, job):\n', [
              '    _sync_parent_directory = staticmethod(observation_state.sync_parent_directory)',
              '',
              '    def _write_observation_state(self, path, value):',
              '        return observation_state.publish(path, value, self._sync_parent_directory)',
              '',
              '    def _save(self, job):', ''
            ].join('\n'));
            change(server, [
              '        try:',
              '            self._write_json_atomic(state_path, state)',
              '        except OSError:',
              '            # Replacement may have committed before a later filesystem error.',
              '            # Only exact durable evidence earns in-memory/queue publication.',
              '            if read_json(state_path) != state:',
              '                raise', ''
            ].join('\n'), [
              '        # Readable replacement bytes cannot certify a failed synchronization.',
              '        # Every failure preserves live/queue state until a later explicit retry.',
              '        self._write_observation_state(state_path, state)', ''
            ].join('\n'));
            const persistence = 'tests/test_observation_resume_persistence.py';
            change(persistence, '_write_json_atomic', '_write_observation_state', 8);
            change(persistence, 'def test_exception_after_state_replace_is_reconciled_and_queued_once(self):',
              'def test_exception_after_state_replace_requires_explicit_retry_then_queues_once(self):');
            change(persistence, [
              "        with patch.object(studio, '_write_observation_state', side_effect=fail_after_state):",
              "            result = studio.resume_job(job['id'])",
              '',
              "        self.assertEqual(result['status'], 'queued')", ''
            ].join('\n'), [
              '        before_job = copy.deepcopy(job)',
              "        with patch.object(studio, '_write_observation_state', side_effect=fail_after_state):",
              "            with self.assertRaisesRegex(OSError, 'after state replace'):",
              "                studio.resume_job(job['id'])",
              '        self.assertEqual(job, before_job)',
              '        self.assertTrue(studio.queue.empty())',
              "        self.assertEqual(json.loads(state_path.read_text())['status'], 'queued')",
              "        result = studio.resume_job(job['id'])",
              '',
              "        self.assertEqual(result['status'], 'queued')", ''
            ].join('\n'));
            const fixture = 'tests/test_reference_hold_observation_admission.py';
            change(fixture, 'class ObservationStudio:\n', [
              'class ObservationStudio:',
              '    _sync_parent_directory = staticmethod(server.Studio._sync_parent_directory)',
              '    _write_observation_state = server.Studio._write_observation_state', '', ''
            ].join('\n'));
            const save = '            studio._save = lambda value: studio._write_json_atomic(studio.runs / value["id"] / "state.json", value)\n';
            change(fixture, save, save + '            studio._save(job)  # Establish the retained state before observation admission.\n');
            // Verify every candidate before creating any unreferenced data blob.
            for (const [path, [, expected]] of Object.entries(owners)) {
              assert.equal(blob(Buffer.from(texts[path],'utf8')), expected, path);
            }
            for (const [path, [, expected]] of Object.entries(owners)) {
              const result = await github.rest.git.createBlob({...context.repo, content:texts[path], encoding:'utf-8'});
              assert.equal(result.data.sha, expected, path);
              core.info(`Verified owner blob ${path}: ${expected}`);
            }
            // No commits, trees, refs, PRs or installed resources are changed here.
