name: Publish reviewed fingerprint freshness follow-up once
on:
  push:
    branches: [codex/pinned-fingerprint-freshness-20261003]
    paths: [.github/maintenance/fingerprint-freshness.patch]
permissions: {}
jobs:
  apply-reviewed-patch:
    if: github.repository == 'Chris0Jeky/local-asset-studio' && github.ref == 'refs/heads/codex/pinned-fingerprint-freshness-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact reviewed patch and verify output bytes
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = 2e4ae749b20f58e19ef9e4a9ceb43185343b16b3
          test "$(git hash-object app/server.py)" = 0a955c1552b9d6237cebeeca1fba6765690beca6
          test "$(git hash-object tests/test_model_integrity_regressions.py)" = c4799c3953ab4e401b463849e5a66745a36c1705
          git apply --check --index .github/maintenance/fingerprint-freshness.patch
          git apply --index .github/maintenance/fingerprint-freshness.patch
          git diff --cached --check
          test "$(git hash-object app/server.py)" = 63987a8ea869eba8707e278662b586d64a2f7716
          test "$(git hash-object tests/test_model_integrity_regressions.py)" = 9931ee932187b8457693246543b61d5833df94b1
          test "$(git hash-object tests/test_pinned_fingerprint_freshness.py)" = 84bda40d5c3a98fddf08c5222b59ccb364e13088
      - run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - run: python -m unittest discover -s tests -p test_pinned_fingerprint_freshness.py -v
      - run: python -m unittest discover -s tests -p test_model_integrity_regressions.py -v
      - run: python -m unittest discover -s tests -p test_preset_model_readiness.py -v
      - name: Commit only reviewed edits to the feature branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: freshly hash pinned production models instead of trusting stat-only cache'
          git push origin HEAD:refs/heads/codex/pinned-fingerprint-freshness-20261003
