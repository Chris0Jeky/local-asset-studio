name: Publish reviewed model integrity patch once
on:
  push:
    branches: [codex/model-integrity-20261003]
    paths: [.github/maintenance/model-integrity.patch]
permissions: {}
jobs:
  apply-reviewed-patch:
    if: github.repository == 'Chris0Jeky/local-asset-studio' && github.ref == 'refs/heads/codex/model-integrity-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact base and apply reviewed patch
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = 451eb72f6700e574f25241b290247b562896a579
          python - <<'PY'
          import subprocess
          expected = {
              'app/backends.py': 'a93f37eb2dc4a1bf3f7c25d4f0f5b9f1244454b1',
              'app/model_library.py': '7a70bb46da960e53fc74156b9af41eb1b516cbc1',
              'app/model_requirements.py': '4f0bf025f05a2a85c5bfd973081d8553907fe36d',
              'app/server.py': '6a27fe82079a0608a7fa1b66f2eadcba188f2ca7',
              'models/library.json': 'cfb85ab07410b50e8c0a907519dfc37623c22552',
              'scripts/validate-repo.py': 'd90aac8d9b4e80b625ebd5810fa98c478b668a53',
          }
          for path, wanted in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if actual != wanted: raise SystemExit(f'Base drift: {path}: {actual}')
          PY
          git apply --check --index .github/maintenance/model-integrity.patch
          git apply --index .github/maintenance/model-integrity.patch
          git diff --cached --check
      - name: Verify published bytes match locally tested files
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'app/backends.py': 'b40a8f6c4b99d702f0554d189bfa2a678c5913a1',
              'app/model_library.py': '147ce8222e2aa3a49ee0354449aaf682b4e6a8dc',
              'app/model_requirements.py': '622abd553f8b0a70be1c9bbf4d3ce77aa1b8c00a',
              'app/server.py': '0a955c1552b9d6237cebeeca1fba6765690beca6',
              'models/library.json': '93d3a974286eef6249c497d35133a1011347155f',
              'scripts/validate-repo.py': '27efaf5a6538f8ca52d01bfd6f0695f765d2aef5',
              'tests/test_model_integrity_regressions.py': 'c4799c3953ab4e401b463849e5a66745a36c1705',
          }
          for path, wanted in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if actual != wanted: raise SystemExit(f'Output drift: {path}: {actual}')
          PY
      - run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - run: python -m unittest discover -s tests -p test_model_integrity_regressions.py -v
      - name: Commit only reviewed code to this feature branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: enforce valid fingerprint records, unique pins and backend affinity'
          git push origin HEAD:refs/heads/codex/model-integrity-20261003
