name: Publish reviewed Looks application once
on:
  push:
    branches: [codex/looks-application-20261003]
    paths: [.github/maintenance/apply-looks-application.py]
permissions: {}
jobs:
  publish:
    if: github.repository == 'Chris0Jeky/local-asset-studio' && github.ref == 'refs/heads/codex/looks-application-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed edits to exact base
        run: |
          test "$(git rev-parse HEAD^)" = f4bee5986191fe7a57efdb285f3775c6617387c3
          python .github/maintenance/apply-looks-application.py
          git diff --check
          node tests/looks_frontend.cjs
          node tests/studio_ux.cjs
          python -m unittest discover -s tests -p test_frontend_handoffs.py -v
      - name: Commit only feature changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/static/app.js app/static/looks.js app/static/studio-core.js app/static/studio-workbench.js tests/looks_frontend.cjs
          git commit -m 'fix: keep failed Look applications explicit and blocked across draft recovery'
          git push origin HEAD:refs/heads/codex/looks-application-20261003
