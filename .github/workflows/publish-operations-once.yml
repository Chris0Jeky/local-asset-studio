name: Publish reviewed operations clarification once
on:
  push:
    branches: [codex/operations-restart-docs-20261003]
    paths: [.github/workflows/publish-operations-once.yml]
permissions: {}
jobs:
  apply-reviewed-edits:
    if: github.repository == 'Chris0Jeky/local-asset-studio' && github.ref == 'refs/heads/codex/operations-restart-docs-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact reviewed documentation edits
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = 451eb72f6700e574f25241b290247b562896a579
          python - <<'PY'
          from pathlib import Path
          import subprocess
          changes = {
              'docs/OPERATIONS.md': ('51ecf827db258d9382ad28418c4d892337fd751e', 'f2dfb1f71c658f3980be97c73bb35b60ffde2224', [
                  ('The defaults are in `config/example.json`.', '`config/example.json` is a starting template, not an exhaustive list of defaults. Omitted keys use the defaults in `app/server.py` and `app/backends.py`; selected runtime defaults are described below.'),
                  ('A Studio restart with an open request marks a job that was never sent as `cancelled`, and any other job as `unresolved`.', 'On restart, an open cancellation request has three outcomes: a never-submitted job becomes `cancelled`; a job that already settled keeps its terminal status and the cancellation becomes `too_late`; a still-live or uncertain job gets an `unresolved` cancellation. An already-resolved record for the same request is left unchanged.'),
              ]),
              'app/job_cancel.py': ('09cbe48affdb74da0f805ae75bc4c8e9706a291b', '912175e524e53ada42f87e012b12f5343081c78f', [
                  ('At load: a request the worker never resolved. A never-sent job is cancelled; anything else is unresolved.', 'At load: cancel a never-sent job, mark a settled job too_late, otherwise leave cancellation unresolved.'),
              ]),
          }
          for name, (before, after, replacements) in changes.items():
              if subprocess.check_output(['git', 'hash-object', name], text=True).strip() != before:
                  raise SystemExit('Base drift: ' + name)
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  if text.count(old) != 1: raise SystemExit('Unexpected replacement count: ' + name)
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
              if subprocess.check_output(['git', 'hash-object', name], text=True).strip() != after:
                  raise SystemExit('Output drift: ' + name)
          assert subprocess.check_output(['git', 'hash-object', 'tests/test_job_cancel_restart_outcomes.py'], text=True).strip() == 'e9cf1f0ac0fac9bbf231a247b4c17ef3262630b9'
          PY
          git add docs/OPERATIONS.md app/job_cancel.py
          git diff --cached --check
      - run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - run: python -m unittest discover -s tests -p 'test_job_cancel*.py' -v
      - name: Commit only reviewed edits to the feature branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: distinguish restart cancellation outcomes and configuration defaults'
          git push origin HEAD:refs/heads/codex/operations-restart-docs-20261003
