name: Exact-tree UX source transfer
on:
  push:
    branches: ['codex/ux-publish-20260921']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          path: transfer
      - uses: actions/checkout@v4
        with:
          ref: f22b56bbeee0ecd907aa71b22e4071cc0dde4dde
          path: source
      - name: Verify exact source tree before non-force publication
        working-directory: source
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, os
          parent = 'f22b56bbeee0ecd907aa71b22e4071cc0dde4dde'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == parent
          patch = Path('../transfer/.github/ux-source.patch').read_bytes()
          patch = patch.replace(b'\n diff --git ', b'\ndiff --git ')
          needle = b"+      text(change, name ? 'Change: '+name : 'Choose recipe');\n"
          assert patch.count(needle) == 1
          patch = patch.replace(needle, needle + b"+      change.setAttribute('aria-label', name ? 'Change recipe: '+name : 'Choose recipe');\n")
          subprocess.run(['git','apply','--index','--unidiff-zero','--whitespace=error-all','-'],input=patch,check=True)
          tree = subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree == '863d971867870f01dee1d24394faa8033fdd53aa', tree
          subprocess.run(['git','config','user.name','OpenAI'],check=True)
          subprocess.run(['git','config','user.email','noreply@openai.com'],check=True)
          commit = subprocess.check_output(['git','commit-tree',tree,'-p',parent,'-m','fix: make recipe and mobile Create entry points explicit and accessible'],text=True).strip()
          subprocess.run(['git','push','origin',commit+':refs/heads/codex/ux-create-entry-points'],check=True)
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('Published '+commit+'\nVerified tree: '+tree+'\n')
          PY
