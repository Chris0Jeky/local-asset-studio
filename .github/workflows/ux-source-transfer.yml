name: Exact UX correction materialization
on:
  push:
    branches: ['codex/ux-publish-20260921']
    paths: ['.github/workflows/ux-source-transfer.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          path: transfer
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: eefe639d8bcef238564c4c2aca2c50dcdef53f4a
          path: source
          fetch-depth: 1
      - name: Verify exact parent, correction bytes and complete tree
        working-directory: source
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, hashlib, os
          parent='eefe639d8bcef238564c4c2aca2c50dcdef53f4a'
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')==parent
          assert git('rev-parse','HEAD^{tree}')=='424698c203879258a79c65ec2e65241a8ef81e48'
          patch=Path('../transfer/.github/ux-focus.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest()=='0f9cdb4b0889b07b1b8b5e13d5a266489431778ed033a684ac9003becac98f2c'
          subprocess.run(['git','apply','--unidiff-zero','--index','--whitespace=error-all','-'],input=patch,check=True)
          tree=git('write-tree')
          assert tree=='82f5cefe75dc23e00729f4da8166adbc775d4f85',tree
          git('config','user.name','OpenAI')
          git('config','user.email','noreply@openai.com')
          commit=git('commit-tree',tree,'-p',parent,'-m','fix: preserve modal escape and focus while completing daily UX coverage')
          # Transfer ref only. The connected GitHub client verifies the tree before updating the PR head.
          git('push','origin',commit+':refs/heads/codex/ux-daily-materialized')
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('Commit: '+commit+'\n\nTree: '+tree+'\n')
          print(commit,tree)
          PY
