name: Apply setup context CLI bound fix
on:
  push:
    branches: [codex/setup-context-compatibility]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded bounded-read patch
        run: python scripts/apply_setup_context_cli_bound_fix.py
      - name: Verify context and adjacent compatibility contracts
        run: |
          python -m unittest discover -s tests -p 'test_setup_context_compatibility*.py' -v
          python -m unittest discover -s tests -p 'test_setup_compatibility*.py' -v
          python -m unittest discover -s tests -p 'test_setup_source_evidence*.py' -v
          python -m unittest discover -s tests -p 'test_setup_substitution*.py' -v
          python scripts/validate-repo.py
      - name: Remove temporary patch helpers
        run: rm .github/workflows/setup-context-cli-bounds.yml scripts/apply_setup_context_cli_bound_fix.py
      - name: Commit verified implementation
        run: |
          git config user.name 'Cristian Tcaci'
          git config user.email '59696583+Chris0Jeky@users.noreply.github.com'
          git add -A
          git commit -m 'fix: bound setup context CLI input reads'
          git push origin HEAD:codex/setup-context-compatibility
