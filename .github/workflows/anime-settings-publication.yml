name: Transfer tested anime settings blobs
on:
  push:
    branches: [codex/anime-settings-publication]
    paths: [.github/workflows/anime-settings-publication.yml, .github/accelerator-transfer.patch, .github/profile-transfer.patch]
permissions:
  contents: write
jobs:
  blobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: transfer
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 0b510ac852c922db4a01e49ce68cdb083f9ad4e4
          path: product
          persist-credentials: false
      - name: Apply tested patches and transfer exact trees only; no commits or refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          source='0b510ac852c922db4a01e49ce68cdb083f9ad4e4'
          source_tree='8f1add8c511eb803ed6d02a21ccd48e7e33c80d6'
          definitions=[('accelerator','1df6808072267eff56aa502651036fe7278c77e837243849f2f120c52a195087','175f39ae40156391f9a79c97989bcfbf7767782a'),('profile','2b3f47ab50f1d7297e9842e3106f93058bd43827856e5465d52b81b933b74a64','f2c07b8e43267ac29f3a0e835ac2ac8862bacbfe')]
          def git(*args,input=None):
              return subprocess.check_output(['git',*args],cwd='product',input=input)
          def post(endpoint,value):
              request=urllib.request.Request('https://api.github.com/repos/Chris0Jeky/local-asset-studio/git/'+endpoint,data=json.dumps(value).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response: return json.load(response)
          assert git('rev-parse','HEAD').decode().strip()==source
          assert git('rev-parse','HEAD^{tree}').decode().strip()==source_tree
          reports=[]
          for name,patch_hash,expected in definitions:
              path=Path('transfer/.github')/(name+'-transfer.patch')
              if not path.exists(): continue
              patch=path.read_bytes()
              assert hashlib.sha256(patch).hexdigest()==patch_hash, 'Patch byte mismatch: '+name
              git('read-tree',source)
              git('apply','--cached','--whitespace=error-all','-',input=patch)
              assert git('write-tree').decode().strip()==expected, 'Local tree mismatch: '+name
              paths=git('diff','--cached','--name-only',source).decode().splitlines()
              assert 1<=len(paths)<=16 and all(p.startswith(('app/','studio_prompt/','presets/','research/','tests/','docs/')) for p in paths)
              entries=[]
              for path in paths:
                  raw=git('show',':'+path)
                  oid=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
                  blob=post('blobs',{'encoding':'base64','content':base64.b64encode(raw).decode()})
                  assert blob['sha']==oid
                  entries.append({'path':path,'type':'blob','mode':'100644','sha':oid})
              tree=post('trees',{'base_tree':source_tree,'tree':entries})
              assert tree['sha']==expected, 'Remote tree mismatch: '+name
              reports.append({'slice':name,'source':source,'tree':tree['sha'],'patch_sha256':patch_hash,'files':entries})
          assert reports, 'No input patches'
          Path(os.environ['RUNNER_TEMP'],'anime-settings-blobs.json').write_text(json.dumps(reports,indent=2))
          print(json.dumps(reports,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: anime-settings-blobs
          path: ${{ runner.temp }}/anime-settings-blobs.json
          retention-days: 1
          if-no-files-found: error
