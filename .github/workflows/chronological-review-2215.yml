name: Chronological review verification
on:
  push:
    branches: [codex/chronological-audit-2215]
    paths: [.github/workflows/chronological-review-2215.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify final review patch against the unchanged schema PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/schema-final-proof
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin codex/backend-schema-captures
          python - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess,urllib.request
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          sha='21b1e13e1232e1d176948bbe8b290dc12cea78ca'
          request=urllib.request.Request('https://api.github.com/repos/Chris0Jeky/local-asset-studio/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=30) as response:blob=json.load(response)
          archive=base64.b64decode(blob['content'])
          assert hashlib.sha1(b'blob '+str(len(archive)).encode()+b'\0'+archive).hexdigest()==sha
          assert hashlib.sha256(archive).hexdigest()=='3108b1e2f9e32709a4970f5aed08ecc6d1817bd65a2dc2e1e67a895d122e8f7a'
          package=json.loads(lzma.decompress(archive));head='d36555da1984900adbfc9e0eba130dc795e7bf13'
          assert package['head']==head and git('rev-parse','origin/codex/backend-schema-captures')==head, 'PR changed; preserve it'
          subprocess.run(['git','switch','-C','verified-schema-final','origin/codex/backend-schema-captures'],check=True)
          allowed={'scripts/validate-live.py','tests/test_schema_capture.py','docs/GRAPH-SCHEMA-CAPTURES.md'}
          assert set(package['manifest'])==allowed
          for path,record in package['manifest'].items():assert git('rev-parse','HEAD:'+path)==record['before_blob'],path
          root=pathlib.Path('/tmp/schema-final-proof');patch=root/'review.patch';patch.write_text(package['patch'],encoding='utf-8')
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==allowed
          for path,record in package['manifest'].items():assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()==record['sha256'],path
          (root/'manifest.json').write_text(json.dumps({'base':package['base'],'previous_head':head,'files':package['manifest'],'tested_tree':git('write-tree')},indent=2),encoding='utf-8')
          PY
      - run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - name: Full suite and repository contracts
        run: |
          set -o pipefail
          python -m unittest discover -s tests 2>&1 | tee /tmp/schema-final-proof/full-suite.log
          python scripts/validate-repo.py 2>&1 | tee /tmp/schema-final-proof/validation.log
          git diff --cached --check
          git diff --exit-code
      - name: Publish only verified reviewed source
        run: |
          git commit -m 'fix: parse complete schema URLs and reject contradictory historical rows (#97)'
          git push origin HEAD:codex/backend-schema-captures
          git rev-parse HEAD > /tmp/schema-final-proof/published-commit.txt
          git rev-parse HEAD^{tree} > /tmp/schema-final-proof/published-tree.txt
          git diff --binary 3d3135a17811d2e4846ada05aae35e06f60d92f4 HEAD > /tmp/schema-final-proof/complete.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chronological-final-schema-proof
          path: /tmp/schema-final-proof/
          retention-days: 7
