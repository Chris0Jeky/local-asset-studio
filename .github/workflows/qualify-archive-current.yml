name: Archive receipt consistency qualification
on:
  push:
    branches: [codex/storage-resume-source-20261029]
    paths: ['.github/workflows/qualify-archive-current.yml']
permissions:
  contents: write
jobs:
  objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a51013d111093232f43762976a97ecd8abe1bd4b
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact reviewed correction
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess
          encoded=''
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='fecc84a4d49a71298de77622160eb87c29dcfe2fc24f644af55d169c4679d292'
          pathlib.Path('/tmp/review.patch').write_bytes(patch)
          subprocess.run(['git','apply','--index','/tmp/review.patch'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert subprocess.check_output(['git','write-tree']).decode().strip()=='a9ddd6f9e081c6796ef2dea625e31747f6025e0e'
          PY
      - run: python -m pip install -r integrations/workflow-mcp/requirements.txt -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - name: Require SDK and run all reviewed Archive contracts
        run: |
          python -c "import mcp; import importlib.metadata; assert importlib.metadata.version('mcp') == '1.30.0'"
          python -m unittest discover -s tests -p 'test_workflow_asset_archive_*.py' -v
          python scripts/validate-repo.py
      - name: Publish only the two verified source blobs and tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,pathlib,subprocess
          def git(*args):return subprocess.check_output(['git',*args])
          def api(path,data):return json.loads(subprocess.check_output(['gh','api','--method','POST','repos/Chris0Jeky/local-asset-studio/git/'+path,'--input','-'],input=json.dumps(data).encode()))
          paths=git('diff','--cached','--name-only').decode().splitlines()
          assert paths==['studio_workflow/asset_archive_client.py','tests/test_workflow_asset_archive_client.py']
          entries=[]
          for path in paths:
              sha=git('rev-parse',':'+path).decode().strip()
              assert api('blobs',{'encoding':'base64','content':base64.b64encode(git('cat-file','blob',sha)).decode()})['sha']==sha
              entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          tree=api('trees',{'base_tree':'649b2b289c74aa47cce8cb11d6e7e711d37e9d82','tree':entries})['sha']
          assert tree=='a9ddd6f9e081c6796ef2dea625e31747f6025e0e'
          receipt={'tree':tree,'branch_moved':False,'entries':entries}
          pathlib.Path('publication.json').write_text(json.dumps(receipt,indent=2)+'\n');print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: archive-receipt-consistency-publication
          path: publication.json
          if-no-files-found: error
          retention-days: 2
