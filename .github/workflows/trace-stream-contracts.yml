name: Incremental trace contracts
on:
  pull_request:
    paths:
      - 'app/inference_trace*.py'
      - 'app/resource_receipts.py'
      - 'app/backend_contracts.py'
      - 'app/performance_history.py'
      - 'studio_workflow/core.py'
      - 'scripts/inspect-inference-trace.py'
      - 'tests/test_inference_trace*.py'
      - 'tests/test_resource_receipts*.py'
      - 'tests/fixtures/inference_trace_cpu.json'
      - 'research/game-assets/requirements-media.txt'
      - 'tests/requirements-runtime.txt'
      - '.github/workflows/trace-stream-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'app/inference_trace*.py'
      - 'app/resource_receipts.py'
      - 'app/backend_contracts.py'
      - 'app/performance_history.py'
      - 'studio_workflow/core.py'
      - 'scripts/inspect-inference-trace.py'
      - 'tests/test_inference_trace*.py'
      - 'tests/test_resource_receipts*.py'
      - 'tests/fixtures/inference_trace_cpu.json'
      - 'research/game-assets/requirements-media.txt'
      - 'tests/requirements-runtime.txt'
      - '.github/workflows/trace-stream-contracts.yml'
permissions:
  contents: read
concurrency:
  group: trace-stream-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/game-assets/requirements-media.txt -r tests/requirements-runtime.txt
      - run: python -m unittest discover -s tests -p "test_inference_trace*.py" -v
      - run: python -m unittest discover -s tests -p "test_resource_receipts*.py" -v
