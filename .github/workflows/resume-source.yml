name: Private session recovery source
on:
  push:
    branches: [codex/privacy-qualification-20261028]
    paths: ['.github/workflows/resume-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0ecbcbbc1c8015ae35ca5a1e7fec5a4e3194c48
          persist-credentials: false
      - name: Archive tracked source and identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/resume-source"
          git rev-parse HEAD > "$RUNNER_TEMP/resume-source/COMMIT.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/resume-source/TREE.txt"
          git ls-tree -r -z HEAD > "$RUNNER_TEMP/resume-source/manifest.git"
          git archive --format=tar HEAD > "$RUNNER_TEMP/resume-source/source.tar"
          cd "$RUNNER_TEMP/resume-source"
          sha256sum source.tar manifest.git > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: private-session-resume-source
          path: ${{ runner.temp }}/resume-source/
          if-no-files-found: error
          retention-days: 2
